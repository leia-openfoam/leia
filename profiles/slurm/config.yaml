# SLURM profile: one sbatch per case (mesh+decompose+solve share group "case").
#   pip install snakemake-executor-plugin-slurm
#   snakemake --workflow-profile profiles/slurm
#
# Configured for the Lichtenberg cluster (TU Darmstadt) -- see CLUSTER.md.
# The module environment and launcher are injected through `config:` below,
# overriding config/config.yaml. Lichtenberg's job_submit plugin REQUIRES
# --mem-per-cpu (supplied here via mem_mb_per_cpu) and auto-routes the partition
# from the runtime. Edit the account / module / OpenFOAM lines for a different
# cluster or project.
executor: slurm
jobs: 200                  # max sbatch jobs in flight
printshellcmds: true
rerun-incomplete: true

default-resources:
  slurm_account: "special00004"
  mem_mb_per_cpu: 4000
  runtime: 1440            # minutes (24 h), matches the old Allrun_*_parallel.sbatch

# ONLY the CFD solve is an MPI job. Meshing, field initialisation, domain
# decomposition, field reconstruction and the ParaView stub are all SERIAL
# (tasks=1 in the Snakefile) and are grouped into one cheap sbatch per case
# ("case_pre" / "case_post"); `solve` is ungrouped so it gets its own
# allocation with exactly --ntasks={np}. Keeping the parallel step out of the
# serial group is what makes this profile work: a mixed group's allocation did
# not carry the solve's task count, and the jobstep failed with "More
# processors requested than permitted".
# The solve step inherits the default runtime + its rule's tasks.
#
# SIZING THE SERIAL RULES. These are tasks=1, so mem_mb_per_cpu IS the job's
# total memory -- and being serial, they do NOT get cheaper when the solve's np
# goes up. They were 3000 MB / 30 min, which is ample at 128^3 (2.10M cells) and
# fails outright on the cell-doubling ladder's top rungs: 203^3 = 8.37M cells is
# ~18 GB for the solver spread over np ranks, but blockMesh, leiaSetFields and a
# scotch decomposePar each hold the WHOLE mesh in ONE process. decompose and
# reconstruct get the largest share -- scotch partitioning holds the cell
# connectivity graph on top of the mesh, and reconstructPar merges np processor
# meshes plus every written time.
# Lichtenberg nodes are 96+ cores / 364800 MB with no MaxMemPerCPU, so a fat
# single-core request is cheap: it pins one core, not a node.
set-resources:
  mesh:
    runtime: 120
    mem_mb_per_cpu: 16000
  preprocess:
    runtime: 120
    mem_mb_per_cpu: 16000
  decompose:
    runtime: 240
    mem_mb_per_cpu: 24000
  reconstruct:
    runtime: 240
    mem_mb_per_cpu: 24000
  paraview_stub:
    runtime: 10
    mem_mb_per_cpu: 1000

# Override execution knobs from config/config.yaml. The preamble loads the
# Lichtenberg toolchain, forces the OpenMPI transport that is known-good on the
# interconnect (from the group's proven isoAdv.sbatch), and sources the OpenFOAM
# the leia binaries are built against ($HOME/OpenFOAM/OpenFOAM-v2512).
# LAUNCHER: `srun --ntasks={np} --overlap` (corrected 2026-08-08).
#
# History, because this has now bitten twice in opposite directions:
#
#   * Bare `srun` was tried on 2026-07-28 and failed with "CPU binding outside of
#     job step allocation / Unable to satisfy cpu bind request", so the profile
#     switched to `mpirun -np {np}`.
#   * `mpirun` then fails for EVERY parallel (np > 1) study, with
#     "There are not enough slots available in the system to satisfy the {np}
#     slots that were requested". The group sbatch IS allocated correctly
#     (measured: NCPUS=4, ReqCPUS=4) -- but snakemake's slurm-jobstep executor
#     wraps each rule in `srun` with ONE task, and mpirun, launched inside that
#     step, sees a single slot. A plain `sbatch -n 4` runs the identical case
#     fine, which is what made this look like an allocation problem.
#
# `--overlap` is the fix for exactly that nesting: it lets the inner step share
# the allocation's resources instead of demanding exclusive ones, which is also
# what caused the original 2026-07-28 CPU-binding failure. Measured on
# sdplsStability (18 parallel np=4 cases): 0 solver CSVs with mpirun, 18 with
# `srun --ntasks={np} --overlap`.
#
# `--cpu-bind=none` ADDED 2026-08-15, and it is not cosmetic: without it every
# parallel study since the launcher switch has been running with ALL {np} ranks
# confined to ONE CPU.
#
# `--overlap` lets the inner step share the outer jobstep's resources -- but it
# shares its CPU MASK too, and snakemake's slurm-jobstep wrapper creates that
# outer step with a single task. So the 8 ranks inherited a 1-CPU mask, and
# OpenMPI's busy-wait progress engine then collapses: every rank spins its full
# timeslice waiting for ranks that are not scheduled. The symptom is not an
# error, which is why it survived so long -- the run just goes 4 orders of
# magnitude slower, and the CPU time looks plausible because spinning IS CPU.
#
# MEASURED on the stationaryDroplet2D N=64 case, np 8, identical in every other
# respect (config/stationaryDropletFootEvalFace.yaml):
#
#   launcher                                   steps/s    wall/CPU
#   srun --ntasks=8 --overlap                   0.0077       9.05
#   srun --ntasks=8 --overlap --cpu-bind=none   86           1.08
#
# 11000x. The diagnostic to watch is the RATIO: OpenFOAM's ExecutionTime is CPU
# and ClockTime is wall, so `wall/CPU ~= np` means the ranks are sharing one
# core, and `~1` means they are not. A plain `sbatch -n 8` outside snakemake was
# always fast (60 steps in 1 s), which is what made this look like a cluster
# load problem rather than a launcher one.
#
# profiles/local keeps `mpirun -np {np}` -- there is no srun nesting there.
config:
  - "mpi_launcher=srun --ntasks={np} --overlap --cpu-bind=none"
  - "env_preamble=module purge; module load gcc/11.5.0-z7mc openmpi/4.1.8-6xzv; export OMPI_MCA_pml=ob1 OMPI_MCA_btl=self,vader,tcp OMPI_MCA_mtl=^ofi,psm2; source $HOME/OpenFOAM/OpenFOAM-v2512/etc/bashrc"
