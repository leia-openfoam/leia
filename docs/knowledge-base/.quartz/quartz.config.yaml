# Quartz v5 configuration for the leia knowledge base (docs/knowledge-base). The build clones
# Quartz at the pinned tag (QUARTZ_TAG in the workflow and in build.sh) and copies this file
# over its quartz.config.yaml. Derived from quartz.config.default.yaml at v5.0.0.
configuration:
  pageTitle: leia knowledge base
  pageTitleSuffix: " - leia"
  enableSPA: true
  enablePopovers: true
  analytics: null
  locale: en-GB
  baseUrl: leia-openfoam.github.io/leia
  ignorePatterns:
    - private
    - templates
    - .obsidian
    - .quartz
  defaultDateType: created
  theme:
    fontOrigin: googleFonts
    cdnCaching: true
    typography:
      header: Schibsted Grotesk
      body: Source Sans Pro
      code: IBM Plex Mono
    colors:
      lightMode:
        light: "#faf8f8"
        lightgray: "#e5e5e5"
        gray: "#b8b8b8"
        darkgray: "#4e4e4e"
        dark: "#2b2b2b"
        secondary: "#284b63"
        tertiary: "#84a59d"
        highlight: "rgba(143, 159, 169, 0.15)"
        textHighlight: "#fff23688"
      darkMode:
        light: "#161618"
        lightgray: "#393639"
        gray: "#646464"
        darkgray: "#d4d4d4"
        dark: "#ebebec"
        secondary: "#7b97aa"
        tertiary: "#84a59d"
        highlight: "rgba(143, 159, 169, 0.15)"
        textHighlight: "#b3aa0288"
plugins:
  - source: github:quartz-community/note-properties
    enabled: true
    order: 5
    options:
      includeAll: false
      includedProperties: [status, part, date_settled, decided_by, tags, aliases]
      excludedProperties: []
      hidePropertiesView: false
      delimiters: "---"
      language: yaml
    layout:
      position: beforeBody
      priority: 15
      display: all
  - source: github:quartz-community/created-modified-date
    enabled: true
    order: 10
    options:
      priority: [frontmatter]
  - source: github:quartz-community/syntax-highlighting
    enabled: true
    order: 20
    options:
      theme:
        light: github-light
        dark: github-dark
      keepBackground: false
  - source: github:quartz-community/spacer
    enabled: true
    order: 25
    options: {}
    layout:
      position: left
      priority: 25
      display: mobile-only
  - source: github:quartz-community/obsidian-flavored-markdown
    enabled: true
    order: 30
    options:
      enableInHtmlEmbed: false
      enableCheckbox: true
  - source: github:quartz-community/github-flavored-markdown
    enabled: true
    order: 40
  - source: github:quartz-community/table-of-contents
    enabled: true
    order: 50
  - source: github:quartz-community/crawl-links
    enabled: true
    order: 60
    options:
      markdownLinkResolution: absolute
      prettyLinks: true
      openLinksInNewTab: true
      externalLinkIcon: true
  - source: github:quartz-community/description
    enabled: true
    order: 70
  - source: github:quartz-community/latex
    enabled: true
    order: 80
    options:
      renderEngine: katex
  - source: github:quartz-community/remove-draft
    enabled: true
  - source: github:quartz-community/alias-redirects
    enabled: true
  - source: github:quartz-community/content-index
    enabled: true
    options:
      enableSiteMap: true
      enableRSS: false
  - source: github:quartz-community/favicon
    enabled: true
  - source: github:quartz-community/content-page
    enabled: true
  - source: github:quartz-community/folder-page
    enabled: true
  - source: github:quartz-community/tag-page
    enabled: true
  - source: github:quartz-community/explorer
    enabled: true
    options:
      title: Knowledge base
      folderClickBehavior: collapse
      folderDefaultState: open
      useSavedState: true
    layout:
      position: left
      priority: 50
  - source: github:quartz-community/graph
    enabled: true
    options:
      localGraph:
        drag: true
        zoom: true
        depth: 1
        scale: 1.1
        repelForce: 0.5
        centerForce: 0.3
        linkDistance: 30
        fontSize: 0.6
        opacityScale: 1
        removeTags: []
        showTags: true
        enableRadial: false
      globalGraph:
        drag: true
        zoom: true
        depth: -1
        scale: 0.9
        repelForce: 0.5
        centerForce: 0.3
        linkDistance: 30
        fontSize: 0.6
        opacityScale: 1
        removeTags: []
        showTags: true
        focusOnHover: true
        enableRadial: true
    layout:
      position: right
      priority: 10
  - source: github:quartz-community/search
    enabled: true
    layout:
      position: left
      priority: 20
      group: toolbar
      groupOptions:
        grow: true
  - source: github:quartz-community/backlinks
    enabled: true
    layout:
      position: right
      priority: 30
  - source: github:quartz-community/article-title
    enabled: true
    layout:
      position: beforeBody
      priority: 10
  - source: github:quartz-community/content-meta
    enabled: true
    layout:
      position: beforeBody
      priority: 20
  - source: github:quartz-community/tag-list
    enabled: true
    layout:
      position: beforeBody
      priority: 30
  - source: github:quartz-community/page-title
    enabled: true
    layout:
      position: left
      priority: 10
  - source: github:quartz-community/darkmode
    enabled: true
    layout:
      position: left
      priority: 30
      group: toolbar
  - source: github:quartz-community/reader-mode
    enabled: true
    layout:
      position: left
      priority: 35
      group: toolbar
  - source: github:quartz-community/breadcrumbs
    enabled: true
    layout:
      position: beforeBody
      priority: 5
      condition: not-index
  - source: github:quartz-community/footer
    enabled: true
    options:
      links:
        GitHub: https://github.com/leia-openfoam/leia
        STATUS.md: https://github.com/leia-openfoam/leia/blob/development/STATUS.md
        METHOD.md: https://github.com/leia-openfoam/leia/blob/development/METHOD.md
  - source: github:quartz-community/stacked-pages
    enabled: true
    layout:
      position: afterBody
      priority: 50
      display: all
layout:
  groups:
    toolbar:
      priority: 35
      direction: row
      gap: 0.5rem
  byPageType:
    "404":
      positions:
        beforeBody: []
        left: []
        right: []
    content: {}
    folder:
      exclude: [reader-mode]
      positions:
        right: []
    tag:
      exclude: [reader-mode]
      positions:
        right: []
    canvas: {}
    bases: {}
