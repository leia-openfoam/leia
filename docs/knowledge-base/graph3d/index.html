<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>leia knowledge graph</title>
<meta name="description" content="The leia knowledge base as an interactive 3D graph: every node a note, every arrow a wikilink.">
<style>
  :root { --bg:#0f1115; --panel:rgba(20,23,30,.94); --fg:#e6e8eb; --muted:#9aa3ad; --line:#2a2f3a; --accent:#8ab4f8; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--fg); font:14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  #graph { position:fixed; inset:0; }
  #panel { position:fixed; top:12px; left:12px; width:min(340px, calc(100vw - 24px)); box-sizing:border-box; background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:12px 14px; max-height:calc(100vh - 24px); overflow:auto; z-index:2; }
  #panel.hidden { display:none; }
  #panel h1 { font-size:16px; margin:0 0 4px; }
  #panel p { margin:4px 0 8px; color:var(--muted); }
  #panel a { color:var(--accent); }
  .row { display:flex; flex-wrap:wrap; gap:6px 10px; margin:6px 0; }
  .row h2 { flex-basis:100%; font-size:12px; margin:6px 0 0; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; }
  label { display:inline-flex; align-items:center; gap:5px; cursor:pointer; white-space:nowrap; }
  .sw { width:11px; height:11px; border-radius:50%; display:inline-block; }
  input[type=search] { width:100%; box-sizing:border-box; padding:6px 8px; border-radius:6px; border:1px solid var(--line); background:#161a22; color:var(--fg); }
  #hits { list-style:none; margin:4px 0 0; padding:0; max-height:150px; overflow:auto; }
  #hits li { padding:3px 5px; cursor:pointer; border-radius:4px; }
  #hits li:hover { background:#222836; }
  #hits small { color:var(--muted); }
  #toggle { position:fixed; top:12px; right:12px; z-index:3; background:var(--panel); border:1px solid var(--line); color:var(--fg); border-radius:8px; padding:6px 10px; cursor:pointer; }
  #count { color:var(--muted); font-size:12px; }
  .tip { background:rgba(15,17,21,.96); color:#e6e8eb; padding:8px 10px; border-radius:8px; border:1px solid #2a2f3a; max-width:320px; font-size:13px; }
  .tip b { display:block; margin-bottom:2px; }
  .tip i { color:#9aa3ad; font-style:normal; display:block; margin-bottom:3px; }
  @media (max-width: 600px) { #panel { font-size:13px; padding:10px; } }
</style>
</head>
<body>
<div id="graph"></div>
<button id="toggle" aria-label="Show or hide the panel">panel</button>
<div id="panel">
  <h1>leia knowledge graph</h1>
  <p>Every node is a note of the <a id="home" href="../">knowledge base</a>; every arrow is a wikilink.
     Size: the number of links. Hover: the verdict. Click: open the note. <span id="count"></span></p>
  <input id="q" type="search" placeholder="search a note (title, slug, description)" autocomplete="off">
  <ul id="hits"></ul>
  <div class="row" id="parts"><h2>parts</h2></div>
  <div class="row" id="statuses"><h2>status</h2></div>
  <div class="row">
    <label><input type="checkbox" id="hubs"> hubs and their neighbours only</label>
    <label><input type="checkbox" id="spin" checked> rotate</label>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/3d-force-graph"></script>
<script>
(async function () {
  const PART_COLOR = { advection: '#4c9be8', viscosity: '#e8a54c', 'surface-tension': '#d94c8f',
    'mass-flux': '#4cc9a0', 'gradient-control': '#a05ce8', verification: '#9aa3ad', all: '#f2f2f2' };
  const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const mix = (a, b, t) => {
    const p = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
    const [x, y] = [p(a), p(b)];
    return '#' + x.map((v, i) => Math.round(v + (y[i] - v) * t).toString(16).padStart(2, '0')).join('');
  };
  const colorOf = n => {
    const base = PART_COLOR[n.part] || '#cccccc';
    switch (n.status) {
      case 'open': return mix(base, '#ffffff', 0.35);
      case 'candidate': return mix(base, '#000000', 0.25);
      case 'retracted': return '#5c6370';
      case 'voided': return '#3d424c';
      default: return base;
    }
  };
  const params = new URLSearchParams(location.search);
  const local = params.get('local') === '1';
  const siteRoot = new URL('../', location.href);
  const urlOf = n => local ? new URL('../' + n.file, location.href).href : new URL(n.url, siteRoot).href;

  let data;
  try {
    data = await (await fetch('graph.json', { cache: 'no-store' })).json();
  } catch (e) {
    document.getElementById('count').textContent = 'graph.json is missing: run `make kb-graph`.';
    return;
  }
  const byId = Object.fromEntries(data.nodes.map(n => [n.id, n]));
  const neighbours = {};
  for (const l of data.links) {
    (neighbours[l.source] = neighbours[l.source] || new Set()).add(l.target);
    (neighbours[l.target] = neighbours[l.target] || new Set()).add(l.source);
  }

  // legend and filters
  const selected = { part: new Set(data.parts), status: new Set(data.statuses) };
  const count = (key, v) => data.nodes.filter(n => n[key] === v).length;
  const makeBoxes = (id, key, values, colour) => {
    const host = document.getElementById(id);
    for (const v of values) {
      const lab = document.createElement('label');
      lab.innerHTML = `<input type="checkbox" checked data-key="${key}" data-value="${esc(v)}">` +
        (colour ? `<span class="sw" style="background:${colour(v)}"></span>` : '') + `${esc(v)} <small>(${count(key, v)})</small>`;
      host.appendChild(lab);
    }
  };
  makeBoxes('parts', 'part', data.parts, v => PART_COLOR[v] || '#ccc');
  makeBoxes('statuses', 'status', data.statuses, v => colorOf({ part: 'advection', status: v }));
  document.querySelectorAll('input[data-key]').forEach(b => b.addEventListener('change', () => {
    const s = selected[b.dataset.key];
    b.checked ? s.add(b.dataset.value) : s.delete(b.dataset.value);
    refresh();
  }));
  document.getElementById('hubs').addEventListener('change', refresh);

  const Graph = ForceGraph3D({ controlType: 'orbit' })(document.getElementById('graph'))
    .backgroundColor('#0f1115')
    .showNavInfo(false)
    .nodeId('id')
    .nodeVal(n => Math.pow(Math.max(n.degree, 1), 1.5))
    .nodeColor(colorOf)
    .nodeOpacity(0.95)
    .nodeLabel(n => `<div class="tip"><b>${esc(n.title)}</b><i>${esc(n.kind)} · ${esc(n.part)} · ${esc(n.status)} · ${n.degree} links</i>${esc(n.description)}</div>`)
    .linkColor(() => '#6b7280')
    .linkOpacity(0.35)
    .linkDirectionalArrowLength(3.5)
    .linkDirectionalArrowRelPos(1)
    .linkDirectionalParticles(0)
    .onNodeClick(n => window.open(urlOf(n), '_blank'))
    .onNodeHover(n => document.body.style.cursor = n ? 'pointer' : null);
  Graph.controls().autoRotate = document.getElementById('spin').checked;
  Graph.controls().autoRotateSpeed = 0.6;
  document.getElementById('spin').addEventListener('change', e => { Graph.controls().autoRotate = e.target.checked; });

  function visibleSet() {
    const hubsOnly = document.getElementById('hubs').checked;
    let ids = data.nodes.filter(n => selected.part.has(n.part) && selected.status.has(n.status)).map(n => n.id);
    if (hubsOnly) {
      const hubs = new Set(data.nodes.filter(n => n.kind === 'hub').map(n => n.id));
      ids = ids.filter(id => hubs.has(id) || [...(neighbours[id] || [])].some(x => hubs.has(x)));
    }
    return new Set(ids);
  }
  function refresh() {
    const vis = visibleSet();
    const nodes = data.nodes.filter(n => vis.has(n.id));
    const links = data.links.filter(l => vis.has(l.source.id || l.source) && vis.has(l.target.id || l.target))
      .map(l => ({ source: l.source.id || l.source, target: l.target.id || l.target }));
    Graph.graphData({ nodes, links });
    document.getElementById('count').textContent =
      `${nodes.length} of ${data.counts.nodes} notes, ${links.length} of ${data.counts.links} links.`;
  }
  refresh();

  // search and focus
  function focus(node) {
    const d = 90, r = Math.hypot(node.x, node.y, node.z) || 1, k = 1 + d / r;
    Graph.cameraPosition({ x: node.x * k, y: node.y * k, z: node.z * k }, node, 1200);
  }
  const q = document.getElementById('q'), hits = document.getElementById('hits');
  q.addEventListener('input', () => {
    const s = q.value.trim().toLowerCase();
    hits.innerHTML = '';
    if (!s) return;
    const found = data.nodes.filter(n => (n.title + ' ' + n.id + ' ' + n.description).toLowerCase().includes(s)).slice(0, 12);
    for (const n of found) {
      const li = document.createElement('li');
      li.innerHTML = `${esc(n.title)} <small>${esc(n.id)}</small>`;
      li.addEventListener('click', () => { const g = Graph.graphData().nodes.find(x => x.id === n.id); if (g) focus(g); });
      hits.appendChild(li);
    }
  });
  const want = params.get('focus');
  if (want) setTimeout(() => { const g = Graph.graphData().nodes.find(x => x.id === want); if (g) focus(g); }, 1800);

  document.getElementById('toggle').addEventListener('click', () => document.getElementById('panel').classList.toggle('hidden'));
  if (window.innerWidth < 600) document.getElementById('panel').classList.add('hidden');
  window.addEventListener('resize', () => Graph.width(window.innerWidth).height(window.innerHeight));
})();
</script>
</body>
</html>
