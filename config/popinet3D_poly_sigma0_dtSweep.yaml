# IS THE POLYHEDRAL FAR-FIELD FAILURE A TIME-STEP (CFL) EFFECT? (2026-09-08)
#
# The static amplification test (slFitAmplification, workflow/README.md "The amplification
# bound of the fit") measures the per-cell Lebesgue constant of the semi-Lagrangian
# reconstruction at the departure displacement d = -u dt:
#     Lambda_c = |1 - sum_j g_j| + sum_j |g_j|,  g_j = b(d)^T M^-1 w_j^2 b(d_j).
# Measured on this mesh: Lambda - 1 is PROPORTIONAL to |d|, hence to the local Courant
# number (hex 0.0133 / 0.0265 / 0.0527 / 0.1041 / 0.2030 and poly 0.0684 / 0.1347 / 0.2608 /
# 0.4871 / 0.8413 at |d| = 0.25 / 0.5 / 1 / 2 / 4 times U dt).
#
# The prediction follows: over a FIXED PHYSICAL TIME the accumulated bound is
#     Lambda^(T/dt) = exp((Lambda - 1) T/dt) = exp(c U T),
# which does not contain dt. A smaller time step buys proportionally more steps at
# proportionally smaller growth per step, so it cannot remove the failure.
#
# THE ARMS: the sigma = 0 passive-transport control at FIXED_DELTA_T = dt, dt/2 and dt/4
# (dt = 9.23685e-06 s, the capillary step at N = 64). END_TIME 0.006 s covers the failure,
# which the dt arm produced at t = 4.70e-03 s (step 508 of the horizon run).
#
# PRE-REGISTERED READ-OUT: the physical time at which the zero-set error first exceeds 1e-2
# (the fake zero set in the far field), and the step number at that time.
#   PREDICTION (the static test): the same TIME in all three arms, at steps 508 / 1016 / 2032.
#       The instability is a property of the update operator on those stencils, and the CFL
#       number is only the multiplier on its rate. A smaller step cannot fix it.
#   FALSIFIED IF: the failure time moves later as dt falls, or does not occur at dt/2 or
#       dt/4 within END_TIME. Then the near-wall cells DO need their own step limit, and the
#       fix is a local time-step constraint, not a reconstruction change.
# Either outcome is decisive, and both are cheap: 650 / 1300 / 2600 steps.
#
# MEASURED 2026-09-09, job 54503136, all three arms COMPLETED. THE PREDICTION HOLDS.
#   arm    dt [s]         steps to failure   failure time [s]   rate [1/s]   rate/step [%]
#   dt     9.23685e-06     528               4.877e-03          132.78       0.1227
#   dt/2   4.618425e-06   1009               4.660e-03          128.59       0.0594
#   dt/4   2.3092125e-06  1974               4.558e-03          126.05       0.0291
# The failure step scales as 1 : 1.91 : 3.74, the failure TIME agrees to 6.5 %, and the
# growth rate per unit physical time is constant to 5 % across a factor 4 in the step. The
# pre-failure trajectory of zeroSetRadialL2/R at matched physical times agrees to 0.3 % in
# all three arms. The falsifier did not occur: the failure moved EARLIER, not later.
# So the near-wall cells do not need their own step limit, and a smaller step cannot fix
# the polyhedral failure. See STATUS.md, "CONFIRMED: the polyhedral failure is not a time
# step effect (2026-09-09)".
#
# NORMALISE BEFORE YOU THRESHOLD. zeroSetRadialL2 and centroidError are absolute lengths in
# metres. In SI they are 400 times smaller than in Popinet's units, so a fixed threshold
# reads every SI run as clean. Divide by DROPLET_RADIUS first.
#
# SI UNITS (2026-09-08). This study runs Popinet's benchmark in real units at his own
# dimensionless groups: D = 1 mm, rho = 1000 kg/m^3 and nu = 1e-6 m^2/s in BOTH phases,
# sigma = 0.012 N/m, U = 0.0692820323 m/s, box 5 x 2.5 (x 2.5) mm, T_U = D/U = 0.01443375673 s.
# That gives La = sigma D/(rho nu^2) = 12000, We = rho U^2 D/sigma = 0.4, Re = 69.28, and
# density and viscosity ratios of 1 -- so every number Popinet reports still applies.
# Sentences below that use his units (D = 0.4, U = 1, sigma = 1, the unit square, 0.13107)
# describe the SAME case: multiply a length by 2.5e-3 m, a velocity by 0.0692820323 m/s and
# a time by 0.03608439182 s. Verify with:
#     python3 workflow/scripts/popinet_si.py check <this file>
#
study_name: popinet3D_poly_sigma0_dtSweep
case: popinetTranslating3D
mesh: poly
mode: parallel
np: 32
solver: leiaSemiLagrangianLevelSetTwoPhaseFoam
theme:  method-comparison
setfields_args: "-alphaName alpha.water"
solve_runtime: 300
axes_override:
  FIXED_DELTA_T: [9.23685e-06, 4.618425e-06, 2.3092125e-06]
  N_CELLS: [64]
  MAX_CELL_SIZE: [4.875e-05]
  REFINE_ALLOW_PIN_MISMATCH: ["true"]
  END_TIME: [0.006]
  WRITE_INTERVAL: [0.003]
  POPINET_NX: [128]
  POPINET_XLEN: [2]
  DOMAIN_LENGTH: [0.0025]
  CAPILLARY_REF_LENGTH: [0.0025]
  CAPILLARY_DT_COEFF: [0.004729265146]
  DROPLET_RADIUS: [0.0005]
  DROPLET_OFFSET_X: [0]
  TRANSLATION_SPEED: [0.0692820323]
  SIGMA: [0]
  POPINET_RHO: [1000]
  POPINET_NU: [1.0e-06]
  SURFACE_FILE: [box5x2p5x2p5mm.fms]
  MOMENTUM_DIV_SCHEME: ["upwind"]
  MASS_FLUX: ["rhoLENT"]
  MASS_FLUX_BOUND_RHO: ["true"]
  VOLUME_CORRECTION: ["noVolumeCorrection"]
  MOMENTUM_DDT_SCHEME: ["backward"]
  RHO_DDT_SCHEME: ["backward"]
  CURVATURE_EXTENSION: ["none"]
  SURFACE_TENSION_FORCE: ["reconstructedCurvature"]
  FACE_CURVATURE_SOURCE: [model]
  PSI_FILTER: [none]
  PHASE_INDICATOR: [detrixheAslam]
  SL_TRACE_VELOCITY: ["projectedFlux"]
  SL_RECONSTRUCTION: [uncachedQuadraticWeightedLeastSquares]
  SL_FOOT_INTEGRATOR: ["taylor"]
collapse_other_axes: true
export_slides: false
mpi_launcher: "mpirun -np {np}"
env_preamble: "source $HOME/OpenFOAM/OpenFOAM-v2512/etc/bashrc; [ -f $HOME/.leia_env ] && . $HOME/.leia_env || true"
