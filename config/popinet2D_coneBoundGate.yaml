# ============================================================================
# GATE B7a -- the distance-cone bound at a MOVING INTERFACE, 2D hexahedral
#
# WHAT IS BEING TESTED. slValueBound lipschitzCone, the bound derived from the
# Lipschitz property of a signed distance function:
#
#     l_c = max_j ( psi_j - L|x_d - x_j| ),   u_c = min_j ( psi_j + L|x_d - x_j| )
#     psi_c^{n+1} = clip(H_c, l_c, u_c)
#
# over the arrival cell's stencil, with H_c the quadratic candidate and L = 1 the
# eikonal value. Proposed as Rank 5 of five by the external review of 2026-09-09.
#
# WHY THIS CASE FIRST. Popinet's 2D hexahedral translating droplet at N = 64 is a
# case where NOTHING IS BROKEN: it completes its 1563 steps, and the far-field
# amplification defect that motivates a bound lives on polyhedra. So this gate
# does not ask whether the bound fixes anything. It asks the question that
# falsified the previous bound: WHAT DOES IT COST WHERE THERE IS NOTHING TO FIX?
# The quasi-monotone clip failed exactly here, at +30 % volume error, because it
# flattened the level set's own extrema.
#
# WHAT ALREADY PASSED, and is not re-asked here:
#   B0  render inertness            only the four new token lines change
#   B1  bit-identity, 8 arms        config/popinet2D_clipRegionGate.yaml at
#                                   1563 steps, np = 4: every arm byte-identical
#                                   to studies/popinet2D_clipRegionGate_preBound_20260910,
#                                   covering valueBound none AND stencilBounds in
#                                   all four (clipRegion, clipKeepExtrema) forms
#   B3  exact-field unit gate       leiaTestSLReconstruction on the unit square:
#                                   0 empty intervals, truth inside to 1.1e-16,
#                                   ZERO error increase from clipping, and at 96
#                                   apex cells the monotone clip errs by 0.0157
#                                   (one cell width) while the cone bound errs 0
#
# THE MATRIX. 3 bound types x 2 Lipschitz modes x 2 recovery paths = 12 arms.
# The redundancy is deliberate and self-validating: the cone tokens are read by
# lipschitzCone ONLY, so the four arms of each non-cone bound MUST be
# bit-identical to each other. If they are not, a cone token is leaking into a
# path it does not belong to, and no other row can be trusted.
#
# PRE-REGISTERED READ-OUT, at the full horizon t = T_U (1563 steps):
#   PASS   the lipschitzCone arms complete 1563 steps; AND their
#          phaseVolumeRelError, zeroSetRadialL2, centroidError, l2MagUPrime and
#          meanMagUPrime stay within 1 % of the valueBound none baseline; AND the
#          inadmissible fraction stays below 1 % of cell-steps.
#   FALSIFIED IF an interface metric moves by more than 1 %. The bound would then
#          be damaging the interface the way the monotone clip did, and its
#          exactness at the distance cone's apex does not carry into a coupled
#          run. This is the outcome the monotone clip produced, so it is the
#          outcome to bet against.
#   ALSO FALSIFIED IF the inadmissible fraction is large. An empty interval means
#          the OLD field already violates the Lipschitz condition over that
#          stencil, so the bound has no mathematical meaning there and the guard
#          is inapplicable to a transported (never reinitialised) level set.
#          slBoundInadmissible locates those cells.
#   THE SHARPEST ROW is lipschitzCone / unity / cellOnly: the coefficient-free
#          production candidate. If it is inert here, the polyhedral rung is next.
#          If it costs volume here, the bound is finished as a production fix
#          whatever it does on polyhedra.
#
# NOTE ON WHAT THIS GATE CANNOT SHOW. It cannot show that the bound makes
# anything stable. rho(B) > 1 on this very mesh (1.00441), and this run completes
# anyway, so completion here is not evidence of stability. The stability question
# belongs to leiaTestTransportSpectrum -mode growth, which measures the NONLINEAR
# map; the review is explicit that Lambda may not be reassigned after a nonlinear
# clip and that the mapping itself must be tested.
#
# NORMALISE BEFORE YOU THRESHOLD. Every length here is absolute metres. Divide
# zeroSetRadialL2 and centroidError by DROPLET_RADIUS = 5e-4 m before comparing
# against any percentage. Never report L_inf.
#
# SI UNITS. Box 5 mm x 2.5 mm, droplet R = 0.5 mm, U = 0.0692820323 m/s,
# sigma = 0.012 N/m, rho = 1000 kg/m3, nu = 1e-06 m2/s, La = 12000.
# Verify with: python3 workflow/scripts/popinet_si.py check
# ============================================================================
study_name: popinet2D_coneBoundGate
case: popinetTranslating2D
mesh: hex
mode: parallel
np: 4
solver: leiaSemiLagrangianLevelSetTwoPhaseFoam
theme:  method-comparison
setfields_args: "-alphaName alpha.water"
solve_runtime: 720
axes_override:
  SL_VALUE_BOUND: ["none", "lipschitzCone", "stencilBounds"]
  SL_CONE_L_MODE: ["unity", "stencil"]
  SL_CONE_INADMISSIBLE: ["cellOnly", "none"]
  SL_CONE_L: [1]
  SL_CLIP: ["false"]
  SL_CLIP_REGION: ["all"]
  SL_CLIP_KEEP_EXTREMA: ["false"]
  N_CELLS: [64]
  POPINET_NX: [128]
  POPINET_XLEN: [2]
  DOMAIN_LENGTH: [0.0025]
  CAPILLARY_REF_LENGTH: [0.0025]
  CAPILLARY_DT_COEFF: [0.004729265146]
  DROPLET_RADIUS: [0.0005]
  DROPLET_OFFSET_X: [0]
  TRANSLATION_SPEED: [0.0692820323]
  SIGMA: [0.012]
  POPINET_RHO: [1000]
  POPINET_NU: [1.0e-06]
  END_TIME: [0.01443375673]
  WRITE_INTERVAL: [0.01443375673]
  MOMENTUM_DIV_SCHEME: ["upwind"]
  MASS_FLUX: ["rhoLENT"]
  MASS_FLUX_BOUND_RHO: ["true"]
  VOLUME_CORRECTION: ["noVolumeCorrection"]
  MOMENTUM_DDT_SCHEME: ["backward"]
  RHO_DDT_SCHEME: ["backward"]
  CURVATURE_EXTENSION: ["none"]
  SURFACE_TENSION_FORCE: ["reconstructedCurvature"]
  FACE_CURVATURE_SOURCE: [model]
  PSI_FILTER: [none]
  PHASE_INDICATOR: [detrixheAslam]
  SL_TRACE_VELOCITY: ["projectedFlux"]
  SL_RECONSTRUCTION: [uncachedQuadraticWeightedLeastSquares]
  SL_FOOT_INTEGRATOR: ["taylor"]
  SL_LIMITER: ["none"]
collapse_other_axes: true
export_slides: false
mpi_launcher: "mpirun -np {np}"
env_preamble: "source $HOME/OpenFOAM/OpenFOAM-v2512/etc/bashrc; [ -f $HOME/.leia_env ] && . $HOME/.leia_env || true"
