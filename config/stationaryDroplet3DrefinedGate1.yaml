# G1 WITH THE REAL FORCE -- decomposition independence on the statically refined mesh, serial.
#
# The constant-curvature gate (config/stationaryDroplet3DrefinedWB*) answered the hanging-node
# question but is BLIND to decomposition: every dynamic column there is round-off (|u| ~ 1e-10),
# so serial and 4-rank runs differ in reduction order only. This pair runs the PRODUCTION force
# (reconstructedCurvature) on the same refined N_fine = 60 mesh (51 640 cells, 5 dilations),
# 921 steps to t = 0.01, once on ONE rank. PASS = workflow/scripts/compare_metrics_csv.py
# reports every column within 1e-10 relative at every step against the twin
# (config/stationaryDroplet3DrefinedGate4.yaml); a decomposition-dependent answer on the
# refined mesh is a defect even when both runs complete (processor patches cut through the
# 2:1 transition polyhedra and the hanging-node faces).
study_name: stationaryDroplet3DrefinedGate1
case: stationaryDroplet3D
mesh: hexRefined
mode: serial
np: 1
solver: leiaSemiLagrangianLevelSetTwoPhaseFoam
theme:  semi-lagrangian-level-set
setfields_args: "-alphaName alpha.water"
axes_override:
  DOMAIN_LENGTH: [0.006]
  N_CELLS: [60]
  REFINE_LEVELS: [1]
  REFINE_BAND_CELLS: [6]
  REFINE_SOURCE: [interface]
  END_TIME: [0.01]
  WRITE_INTERVAL: [0.005]
  SURFACE_TENSION_FORCE: [reconstructedCurvature]
  CURVATURE_EXTENSION: [cellCentreInverse]
  FACE_CURVATURE_SOURCE: [model]
  PSI_FILTER: [none]
  VOLUME_CORRECTION: [noVolumeCorrection]
  MOMENTUM_DDT_SCHEME: [backward]
  RHO_DDT_SCHEME: [backward]
  MOMENTUM_DIV_SCHEME: [upwind]
  MASS_FLUX: [rhoLENT]
  MASS_FLUX_BOUND_RHO: ["true"]
  PHASE_INDICATOR: [detrixheAslam]
  SL_TRACE_VELOCITY: [projectedFlux]
  SL_RECONSTRUCTION: [uncachedQuadraticWeightedLeastSquares]
  SL_FOOT_INTEGRATOR: [taylor]
collapse_other_axes: true
export_slides: false
mpi_launcher: "mpirun -np {np}"
env_preamble: "source $HOME/OpenFOAM/OpenFOAM-v2512/etc/bashrc; [ -f $HOME/.leia_env ] && . $HOME/.leia_env || true"
