# nSL vs pointValue on the 3D 3Ddeformation flow (see nslConv2Dvortex.yaml).
# DIV pinned: the SL solver never advects psi by flux, the token is inert.
study_name: nslConv3Ddeformation
case: 3Ddeformation
mesh: hex
mode: parallel
np: 4

solver: leiaSemiLagrangeLevelSetFoam
theme:  semi-lagrangian-level-set

axes_override:
  END_TIME: [3.0]
  N_CELLS:  [32, 64, 128]
  CFL:      [0.5]
  SL_SCHEME: [pointValue, normalProjected]
  SL_RECONSTRUCTION: [uncachedQuadraticWeightedLeastSquares]
  PHASE_INDICATOR: [detrixheAslam]
  DIV: [linear]
collapse_other_axes: true

export_slides: false

mpi_launcher: "mpirun -np {np}"
env_preamble: "source $HOME/OpenFOAM/OpenFOAM-v2512/etc/bashrc"
