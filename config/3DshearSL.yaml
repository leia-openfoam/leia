# Semi-Lagrangian level set advection on the reversed 3D shear flow.
# >>> 3D convergence of the production quadraticWeightedLeastSquares reconstruction. <<<
#
# The 3D companion to config/bulkVortexSL.yaml: same solver
# (leiaSemiLagrangeLevelSetFoam), same error norms, its own study dir. Domain is
# [0,1]x[0,1]x[0,2] so N_CELLS -> N x N x 2N cubic cells (h = 1/N). shear3D with
# oscillation on reverses at T = END_TIME, so exact(T) = initial -> the reversed
# error is a true accuracy measure. Interface: sphere r = 0.15 @ (0.35,0.75,0.25).
#
#   snakemake --workflow-profile profiles/local --configfile config/3DshearSL.yaml
#
# Only the best quadratic reconstruction (quadraticWeightedLeastSquares, full) is swept in 3D;
# CFL 0.5 and 1.0 confirm 2nd-order convergence is independent of the step size
# up to the CFL = 1 stability bound. N=128 (4.2M cells) is the expensive tier.

study_name: 3DshearSL
case: 3Dshear
mesh: hex
mode: parallel
np: 8

solver: leiaSemiLagrangeLevelSetFoam

axes_override:
  END_TIME: [3.0]                        # T = period = end time (reversible)
  N_CELLS:  [32, 64, 128]                # h = 1/N cubic cells (N x N x 2N). 128 (4.2M
                                         # cells) is memory-bound at np=8 on 15 GB even with the single-precision
                                         # quadraticWeightedLeastSquares pseudo-inverse cache (~4 GB)
                                         # on this 15 GB box.
  CFL:      [0.5, 1.0]                   # stability-bound sweep
  # quadraticWeightedLeastSquares = memory-bound production fit;
  # uncachedQuadraticWeightedLeastSquares = the SAME fit, CPU-bound (no per-cell
  # pseudo-inverse cache -> per-step Cholesky), identical accuracy/stability;
  # defectCorrectedIDW = unstable research model.
  SL_RECONSTRUCTION: [quadraticWeightedLeastSquares, uncachedQuadraticWeightedLeastSquares, defectCorrectedIDW]
  PHASE_INDICATOR: [detrixheAslam]
  # 3D fvSchemes references @!DIV!@ (the Eulerian psi flux scheme). The SL solver
  # never advects psi by flux, so DIV is inert -- pin it to a single value or the
  # base config/config.yaml axes_override (DIV: [linear, upwind]) merges in and
  # doubles every run with bit-identical results.
  DIV: [linear]
collapse_other_axes: true

export_slides: false  # 3D: no field montages; figures assembled separately

mpi_launcher: "mpirun -np {np}"
env_preamble: "source $HOME/OpenFOAM/OpenFOAM-v2506/etc/bashrc"
