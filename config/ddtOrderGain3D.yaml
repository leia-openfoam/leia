# RETRY OF THE MOMENTUM TIME ORDER, as a gain gate.
#
# THE ORDER MISMATCH THIS IS AIMED AT. The semi-Lagrangian departure point is a
# second-order Taylor expansion (pointValueScheme.C:367-368):
#     x_d = x_c - u dt + 0.5 a dt^2,   a = (u^{n+1} - u^n)/dt + (u . grad u)
# which is 2nd-order accurate GIVEN u. With Euler momentum, u carries O(dt) error,
# so x_d carries O(dt^2) per step and the interface position accumulates O(dt) over
# a fixed time: the level set is FIRST order in time. A second-order trajectory is
# being fed a first-order velocity, and that is worth removing.
#
# WHY THE 2026-07-14 REJECTION IS WORTH RE-TESTING. It recorded, at N=64 and
# dt = dt_sigma/4: Euler stable at max|U| ~1e-5, backward DIVERGES with peak ~48,
# CrankNicolson 0.9 diverges to ~1e+102, and backward usable only at dt_sigma/8.
# That test predates three fixes landed today, and one is directly implicated: the
# t=0 Young-Laplace solve was UNREFERENCED on a singular system and inherited
# relTol 0.01, leaving the initial pressure ~1% off and handing step 1 an impulse of
# order 0.01*sigma*kappa. A divergence to ~48 m/s is the signature of an amplified
# STARTUP transient, not of slow parasitic growth -- and Euler's L-stability damps
# exactly that, where a higher-order scheme does not. So the July verdict may have
# been a measurement of the impulse rather than of the scheme.
#
# WHAT THIS CANNOT DELIVER, stated up front so the result is not over-read.
# `backward` alone does NOT make the coupled scheme 2nd order in time. The capillary
# force is evaluated once per step from the interface at t^n -- explicit, hence 1st
# order, whatever ddt does. Iterating it to convergence (psiOuterCorrectors) makes it
# backward-Euler, which is ALSO 1st order, and that switch was measured INERT here
# (max|U| within 0.4%, config/psiOuterCorrectorsGain3D.yaml). Genuine 2nd order needs
# BOTH a 2nd-order ddt AND a MIDPOINT (t^{n+1/2}) capillary force. The midpoint force
# is not implemented and is a DIFFERENT item from task #24, which changes implicitness
# and not order. If this study shows backward is usable, the midpoint force becomes
# the natural follow-on and the first genuinely 2nd-order-in-time configuration.
#
# THE DESIGN. One resolution, R/h = 15.8 (N_L = 95) -- the arm that AMPLIFIES
# post-fix (gAvg +2.70e-04, max|U| 5.82e-03), so a change in the gain is measurable
# there. Two schemes x two steps, quarter horizon, scored on the per-step gain:
#   Euler    at dt = 5.4514e-6  -- the control, and the same run as the post-fix
#                                 ladder's N_L=95 arm, so it cross-validates
#   backward at dt = 5.4514e-6  -- does it still diverge post-fix?
#   Euler    at dt = 2.7257e-6  -- the dt control, needed because e-folds ~ dt^0.35
#                                 means halving the step improves things ANYWAY, and
#                                 without this arm a stable backward-at-half-dt would
#                                 be indistinguishable from that effect
#   backward at dt = 2.7257e-6  -- July's claim was that backward needs dt_sigma/8
# CrankNicolson is excluded: it is A-stable but NOT L-stable, its amplification factor
# tends to -1 for stiff modes so grid-scale capillary oscillations are not damped at
# all, and July measured 1e+102. Excluding it is a physics judgement, not an oversight.
#
# PREDICTIONS (recorded before the run).
#   a. If backward is now usable at the native step and gAvg is unchanged or lower,
#      the July divergence was the t=0 impulse, and the momentum order can be raised
#      free -- which makes the midpoint capillary force the next step and a genuinely
#      2nd-order-in-time scheme reachable.
#   b. If backward still diverges at the native step but is stable at half, the July
#      result stands on its own physics: Euler's L-stability is load-bearing and the
#      price of 2nd order is 2x the steps. Then compare gAvg of backward-at-half
#      against EULER-at-half, not against Euler-at-native, or the dt^0.35 effect will
#      be misread as a scheme win.
#   c. If backward diverges at both steps, the order mismatch cannot be fixed from the
#      momentum side at this resolution and the trajectory's 2nd order is unreachable
#      while the force stays 1st order.
#   Report volume AND shape error alongside the gain, never the gain alone.
study_name: ddtOrderGain3D
case: stationaryDroplet3D
mesh: hex
mode: parallel
np: 32

solver: leiaSemiLagrangianLevelSetTwoPhaseFoam
theme:  method-comparison

setfields_args: "-alphaName alpha.water"

axes_override:
  DOMAIN_LENGTH: [0.006]
  N_CELLS: [95]
  MOMENTUM_DDT_SCHEME: [Euler, backward]
  # native capillary step for R/h = 15.8, and half of it (dt_sigma/6.1)
  FIXED_DELTA_T: [5.4514e-6, 2.7257e-6]
  CURVATURE_EXTENSION: [cellCentreInverse]
  FACE_CURVATURE_SOURCE: [model]
  PSI_FILTER: [biharmonicBand]
  PSI_FILTER_THETA: [0.2]
  END_TIME: [0.025]

# 4586 steps at the native dt, 9172 at half; 857375 cells; ~2 h for the longest
# at np32 from the measured 2.97e-5 core-s per cell-step.
solve_runtime: 300
export_slides: false

env_preamble: "source $HOME/OpenFOAM/OpenFOAM-v2512/etc/bashrc"
