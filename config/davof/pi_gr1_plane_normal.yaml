# M. Fricke, T. Maric, D. Bothe, Contact line advection using the geometrical Volume-of-Fluid method,
# J. Comput. Phys. 407 (2020) 109221, doi:10.1016/j.jcp.2019.109221, arXiv:1907.01785.
# Gr1 of the row pointIso-davof (2026-11-20): plane translation, normal arm, N 20 and 40, OF Co 0.2 and 0.5, L1(alpha_f) against the exact plane
# sbatch -J pi_gr1_plane_normal --export=ALL,STUDY=davof/pi_gr1_plane_normal run-studies.sbatch
study_name: pi_gr1_plane_normal
studies_dir: studies/davof
case: davof/planeTranslation3D
mesh: hex
mode: serial
np: 1
solver: davofAdvectorFoam
theme:  davof
setfields_app: initDavofFields
setfields_args: ""
post_solve: "python3 {REPO}/workflow/scripts/tpf_advection_metrics.py --case . --out advectorVoF.csv"
axes_override:
  TPF_SURF_CELL_TOL: ["1e-8"]
  TPF_RECON_WISP_TOL: ["1e-3"]
  TPF_ENRIGHT_SETTING: [pointIsoDavof]
  TPF_GRAZING_CUT: [openfoam]
  TPF_CCS_END_INTERVAL: [cubic]
  TPF_CCS_TOLERANCE: [relative]
  TPF_POSITIONING_TOL: ["1e-12"]
  N_CELLS: [20, 40]
  TARGET_ADVECTIVE_CO: [0.124, 0.3101]
  TPF_VELOCITY_ARM: [normal]
  TPF_ROW: [pointIso-davof]
  TPF_VOLUME_RULE: [kromerBothe]
  TPF_ANCHOR_METHOD: [ccs]
  TPF_FLUX_INTEGRATION: [sweptFaceCells]
  TPF_SWEPT_SCALE: ["true"]
  TPF_SWEPT_FACE_UPDATE: [pieces]
  TPF_SWEPT_COPLANAR: [donorSide]
  TPF_SWEPT_CAP_SET: [final]
  TPF_PLANE_SOURCE: [anchor]
  TPF_KB_FAN: ["auto"]
  TPF_SWEPT_AXIS_PLANES: ["true"]
  TPF_SWEPT_TET_CACHE: ["true"]
  TPF_SWEPT_POINT_VELOCITY_LAZY: ["true"]
  TPF_SWEPT_PRE_TEST_COPLANAR_SIDE: ["true"]
  TPF_WRITE_PRECISION: ["17"]
  TPF_RECON_ERROR_EVERY_STEP: ["false"]
  TPF_PROFILING: ["false"]
collapse_other_axes: true
solve_mem_mb: 16000
solve_runtime: 60
export_slides: false
env_preamble: "source $HOME/OpenFOAM/OpenFOAM-v2606/etc/bashrc"
