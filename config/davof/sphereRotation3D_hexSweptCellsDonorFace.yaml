# The face update of the piecewise swept flux separated from its flux
# (2026-10-29): the ladder sphereRotation3D_hexSweptCells found the
# piecewise clip bounded where the prism aborts, with a better shape error
# (Eshape 1.38e-4 against the comparators' 2.4e-4 at N = 64), but with a
# face-fraction error ABOVE the prism's at N = 32 (5.5e-2 against 2.3e-2,
# exact normal; the growth is in the first 50 steps, 4.2e-3 -> 3.4e-2,
# while the prism goes 5.0e-3 -> 8.5e-3). The piecewise face update clips
# the pre-image pieces by the planes of the cells they lie in, so a face
# whose pre-image spans two cells mixes two planes that differ at the
# shared face. Here the flux stays piecewise (bounded) and the face update
# takes the donor's plane alone (sweptCellsFaceUpdate donor, the face update
# of sweptFace), N = 32 / 64, exact and ring normal, inletOutlet alpha.
# 2 x 2 = 4 serial cases.
#
# PRE-REGISTERED (2026-10-29). H-F1: with the donor-plane face update the
# face-fraction error at N = 32 returns to the prism's level (within 20 % of
# 2.3e-2 exact, 4.2e-2 ring) and the run stays bounded (the flux is
# unchanged), which would locate the face-fraction loss in the piecewise
# face update, not in the flux. FALSIFIED if L1(alphaf) stays at 5e-2: then
# the loss comes from the fluxes' effect on the cell state (the wisp halo),
# or from the one-surface consistency the piecewise face update kept and
# the donor face update breaks.
#
# NOTE (2026-10-29): inletOutlet needs the flux field phi at construction,
# which initDavofFields does not register (FOAM FATAL in the preprocess
# step of jobs 55752459/55752605); the runs use TPF_ALPHA_BC fixedValue
# (alpha zero on every boundary face, in- and outflow; the sphere stays 3
# to 6 cells from the walls, so only the wisps' boundary flux is removed).
#
# MEASURED at N = 32 and 64 (2026-10-29, job 55752784, fork 8e2f359): H-F1
# HELD. With the donor-plane face update and the piecewise flux every case
# completes the turn bounded (min(alpha) after the bounding -1.9e-13 to
# -4.1e-14; the largest excess over 1 is 6e-12 to 1.5e-11, and 2.0e-7 in one
# step of the ring row at N = 32) and conservative (the deviation of
# sum(alpha V) 1.4e-12 % to 5.8e-12 %, the boundary term zero). L1(alphaf)
# at the end of the turn: exact normal 2.288e-2 (N = 32; the prism 2.328e-2)
# and 1.456e-2 (N = 64; the prism aborts at step 572), ring normal 4.164e-2
# (N = 32; the prism 4.233e-2) and 2.313e-2 (N = 64; the prism aborts at
# step 268): at or below the prism's where the prism completes, the
# pairwise order 32 -> 64 is 0.65 (exact) and 0.85 (ring); the first step's
# error equals the prism's (5.06e-3 against 5.03e-3 at N = 32). The
# piecewise face update of the ladder gave 5.49e-2 and 4.30e-2 (exact) on
# the same fluxes: the face-fraction loss was in the piecewise face update,
# not in the flux. Cost 0.28 s per step at N = 32 and 1.45 s at N = 64
# against the prism's 0.16 and 1.04 (the CSV's cpu per step).
#
# EXTENDED to N = 128 (2026-10-29, after the N = 32/64 result; the two new
# cases are appended, the finished ones kept). PRE-REGISTERED: P-R3' the
# N = 128 cases complete the turn bounded (min(alpha) above -1e-12, the
# excess over 1 below 1e-10) and conservative (sum(alpha V) within 1e-10 %);
# P-R4' L1(alphaf) at the end of the turn falls from N = 64 to 128 with a
# pairwise order in [0.6, 1.3] for both normals (the 32 -> 64 orders are 0.65
# and 0.85), the centre error L1(x) with an order above 1.7; P-R5' at N = 128
# the sweptFaceCells row ends below the prism's where the prism completes
# (the ladder's prism at N = 128, exact normal, job 55751077, if it does).
# FALSIFIED by an abort, a deviation above 1e-9 %, or an order below 0.5.
#
# MEASURED at N = 128 (2026-10-29, job 55753244, fork 8e2f359; both cases
# 1600 steps, completed). P-R3' HELD on the excess and the mass, MISSED on
# the floor: min(alpha) after the bounding -1.4e-11 (exact) and -5.2e-11
# (ring) against the stated -1e-12 (a round-off accumulation over 1600
# steps, 6.8e6 cells; the N = 32 ring row has -3.0e-11 as well); the excess
# over 1 is 8.0e-11 and 8.2e-11; the deviation of sum(alpha V) 4.8e-11 %
# (4.8e-13 relative) for both. P-R4' HELD for the ring normal (L1(alphaf)
# 4.16e-2 / 2.31e-2 / 1.32e-2, orders 0.85 and 0.81) and for the exact
# normal in the stated window (2.29e-2 / 1.46e-2 / 8.96e-3, orders 0.65 and
# 0.70), the centre error L1(x) 1.49e-3 / 4.73e-4 / 1.40e-4 (exact, orders
# 1.66 and 1.76) and 2.81e-3 / 7.59e-4 / 2.02e-4 (ring, 1.89 and 1.91),
# Eshape 4.68e-4 / 1.40e-4 / 4.06e-5 (exact, 1.74 and 1.78) and 7.76e-4 /
# 2.14e-4 / 5.81e-5 (ring, 1.86 and 1.88); the exact row's face-fraction
# order lies below the ring row's while its error is lower at every N.
# P-R5' not decidable at N = 128: the prism aborts there (steps 602 exact,
# 105 ring, ladder job 55751077); at N = 32, where the prism completes, the
# row ends below it (2.288e-2 against 2.328e-2 exact, 4.164e-2 against
# 4.233e-2 ring). Rank fallbacks at most 170 faces per step at N = 128, no
# face beyond one layer. Cost 9.08 / 9.06 s per step at N = 128 (prism
# 7.39 s up to its abort).
#
#   sbatch --parsable -J leia-davof-sphereRotation3D_hexSweptCellsDonorFace --export=ALL,STUDY=davof/sphereRotation3D_hexSweptCellsDonorFace run-studies.sbatch
study_name: sphereRotation3D_hexSweptCellsDonorFace
studies_dir: studies/davof
case: davof/sphereRotation3D
mesh: hex
mode: serial
np: 1

solver: advectorVoF
theme:  davof

setfields_app: initDavofFields
setfields_args: ""
post_solve: "python3 {REPO}/workflow/scripts/tpf_advection_metrics.py --case . --out advectorVoF.csv"

# The YAML booleans are QUOTED: they are rendered verbatim into the OpenFOAM
# dictionaries (false, not False).
axes_override:
  N_CELLS: [32, 64, 128]
  TARGET_ADVECTIVE_CO: [0.2]
  TPF_ROW: [davof-planeSurf-exact, davof-planeSurf-ringArea]
  TPF_VELOCITY_ARM: [rotation]
  TPF_VOLUME_RULE: [kromerBothe]
  TPF_ANCHOR_METHOD: [ccs]
  TPF_FLUX_INTEGRATION: [sweptFaceCells]
  TPF_SWEPT_SCALE: ["true"]
  TPF_SWEPT_FACE_UPDATE: [donor]
  TPF_SWEPT_CLASSIFY: ["false"]
  TPF_ALPHA_BC: [fixedValue]
  TPF_DAVOF_METHOD: [exactSphere]
  TPF_AFE_CONSISTENCY: ["false"]
  TPF_KB_FAN: ["auto"]
collapse_other_axes: true

# N = 128: 4.2e6 cells, 1600 steps
solve_mem_mb: 16000
solve_runtime: 2880

export_slides: false

env_preamble: "source $HOME/OpenFOAM/OpenFOAM-v2606/etc/bashrc"
