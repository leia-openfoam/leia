# RERUN of sphereTranslation3D_hexExactSurfaceOffCentre (leia b3d91618) on the fork
# branch davof-sliver (agent "sliver", 2026-10-25), N = 64 only, rows exact and
# cellLocal, Co 0.2: the off-centre exact-sphere control showed L1(alphaf)
# excursions above 1e-12 on 40 % of the steps (max 1.44e-8 at N = 64) with zero
# linear cuts, clips, skips and fallbacks.
#
# PREDICTION (before the run): unchanged digits, the excursions remain. The
# exactSphere rule computes the volumes by tetOverlap and the face fractions by
# the quadratic cut (faceCutDisplaced); the branch changes the Kromer-Bothe face
# integration and the split quadrature's sweep apex, neither of which is called
# on this path (the split quadrature only as the non-sphere fallback, zero).
#
#   sbatch --parsable -J leia-davof-sphereTranslation3D_hexExactSurfaceOffCentreSliver --export=ALL,STUDY=davof/sphereTranslation3D_hexExactSurfaceOffCentreSliver run-studies.sbatch
study_name: sphereTranslation3D_hexExactSurfaceOffCentreSliver
studies_dir: studies/davof
case: davof/sphereTranslation3D
mesh: hex
mode: serial
np: 1

solver: advectorVoF
theme:  davof

setfields_app: initDavofFields
setfields_args: ""
post_solve: "python3 {REPO}/workflow/scripts/tpf_advection_metrics.py --case . --out advectorVoF.csv"

# The YAML booleans and the write controls are QUOTED: they are rendered
# verbatim into the OpenFOAM dictionaries (false, not False).
axes_override:
  N_CELLS: [64]
  TARGET_ADVECTIVE_CO: [0.2]
  TPF_ROW: [davof-exactSurface-exact, davof-exactSurface-cellLocal]
  TPF_SPHERE_CY: [0.5137]
  TPF_SPHERE_CZ: [0.4871]
  TPF_VOLUME_RULE: [exactSphere]
  TPF_DAVOF_METHOD: [exactSphere]
  TPF_AFE_CONSISTENCY: ["false"]
collapse_other_axes: true

solve_mem_mb: 12000
solve_runtime: 720

export_slides: false

env_preamble: "source $HOME/OpenFOAM/OpenFOAM-v2606/etc/bashrc"
