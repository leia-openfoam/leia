# The plicRDF-normal control of the sphere-translation study with the ring
# fallback (2026-10-14): the row davof-plicRDFnormal-ring of
# workflow/scripts/tpf_rows.py, otherwise the hex study
# (config/davof/sphereTranslation3D_hex.yaml: the sphere of radius 0.15 in
# the 2 x 1 x 1 box carried by U = (1 0 0) over one unit, END_TIME 1,
# N = 32/64/128 across the height, Co 0.1/0.2/0.5, the quadraticFaces
# initDavofFields state, serial). 3 x 3 x 1 = 9 cases.
#
# WHY. The control davof-plicRDFnormal (normalModel plicRDF, applyTo all: the
# helper plicRDF's normal in every interface cell, the plane positioned by
# alpha, the DAVOF face update) does not converge on the translated sphere in
# the hex study although plicRDF alone does on the same alpha. The davof
# scheme selects its interface cells by the face fractions
# (|m_c| > wispTol V^(2/3)); the helper plicRDF marks only the cells with
# alpha strictly inside (surfCellTol, 1 - surfCellTol). In the cells the
# scheme marks and the helper does not, the helper's normal is zero and the
# model kept the own normal m_c ("kept m" in the fork's Info line: 16 to 24
# of 1800 cells at N = 64, 144 to 182 of 7100 at N = 128, growing along the
# run). The fork's keyword noNormalFallback ringArea (davofNormalModel.H,
# 2026-10-14) gives those cells the ring normal of the cell instead (the
# ringArea model's sum over the point-neighbour ring, one shared
# implementation), counted as "ring fallbacks".
#
# PRE-REGISTERED PREDICTIONS (2026-10-14, written before the ladder):
# P-E1 (the mechanism): the ring fallback removes the "kept m" cells, so
#   the control converges on the sphere like plicRDF: the normal at about
#   first order, the centroid at second order over N = 32 to 128, with its
#   face fractions at first order like the ring-normal row davof-ringArea.
#   FALSIFIED if L1(n) of this row does not fall under refinement at Co 0.2.
# P-E2 (stability): the row stays bounded (min alpha above -1e-10) to the
#   end at every N and Co, the interface-cell count within a few per cent of
#   its initial value.
# P-E3 (the plane twin, planeTranslation3D_hexControl.yaml): the row still
#   fails the 1e-12 gate on both arms, because the plicRDF normal itself is
#   not exact at the corners of the box (the stencil normal of a plane that
#   meets the boundary); the fallback changes only the cells without a
#   helper normal.
#
# NOTE OF 2026-10-14, after the laptop run at N = 32, Co 0.2 (the fork's
# benchmark, before this ladder): the row reproduces the keep control
# davof-plicRDFnormal TO EVERY DIGIT (L1(alphaf) 2.069546793547e-02, L1(n)
# 4.032040426541e-02, L1(x) 1.581827656378e-03, Eshape 4.308063062444e-04,
# min alpha -3.83e-22) although the fallback is taken (8 ring fallbacks at
# step 2, 22 at most over the run, where the keep row has 8 and 22 kept m).
# The mechanism: the cells without a helper normal are exactly the cells
# whose alpha is at 0 or 1 within surfCellTol (that is the helper's
# criterion), and the davof scheme's positionPlane() calls vofCutCell, which
# returns -1 or 1 for such an alpha BEFORE cutting anything, so the cell
# gets no plane whatever normal it is handed; the normal of a "kept m" cell
# never enters the transport. P-E1 is therefore expected to be FALSIFIED on
# every rung in the strongest form (the row identical to the keep control),
# and the non-convergence of the control has another cause. The ladder is
# run to record that at N = 64 and 128 and at the three Courant numbers.
#
#   snakemake --workflow-profile profiles/local --jobs 1 --configfile config/davof/sphereTranslation3D_hexControl.yaml
# Lichtenberg:
#   sbatch --parsable -J leia-davof-sphereTranslation3D_hexControl --export=ALL,STUDY=davof/sphereTranslation3D_hexControl run-studies.sbatch
study_name: sphereTranslation3D_hexControl
studies_dir: studies/davof
case: davof/sphereTranslation3D
mesh: hex
mode: serial
np: 1

solver: advectorVoF
theme:  davof

# initDavofFields reads system/initAlphaFieldDict: alpha.water and the face
# fractions alphaf.water of the quadraticFaces state; no -alphaName.
setfields_app: initDavofFields
setfields_args: ""
# The function-object .dat files and the solver log -> advectorVoF.csv (the
# solve rule's output), one row per step.
post_solve: "python3 {REPO}/workflow/scripts/tpf_advection_metrics.py --case . --out advectorVoF.csv"

axes_override:
  N_CELLS: [32, 64, 128]
  TARGET_ADVECTIVE_CO: [0.1, 0.2, 0.5]
  TPF_ROW: [davof-plicRDFnormal-ring]
collapse_other_axes: true

# The N = 128 case (4.2e6 cells, four field writes) needs more than the Slurm default.
solve_mem_mb: 12000
solve_runtime: 1440

# Tables and figures go to the davof theme's docs data (make_davof_advection_table.py); no deck.
export_slides: false

env_preamble: "source $HOME/OpenFOAM/OpenFOAM-v2606/etc/bashrc"
