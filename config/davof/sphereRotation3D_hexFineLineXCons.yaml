# The consistency of the swept flux under oblique travel, C: the consistent
# variant on the x-line (2026-11-02): sphereRotation3D_hexFineLineX
# (anchored plane, Co 0.2, N = 32, 64) on fork davof-swept c635611 with
# sweptConsistent true, sweptConsistencyLog true and faceErrorCsv true. The
# partner of sphereRotation3D_hexFineLineDiagCons, whose header holds the
# measures and the predictions C-0..C-4 and R-1.
#
#   sbatch --parsable -J leia-davof-sphereRotation3D_hexFineLineXCons --export=ALL,STUDY=davof/sphereRotation3D_hexFineLineXCons run-studies.sbatch
study_name: sphereRotation3D_hexFineLineXCons
studies_dir: studies/davof
case: davof/sphereRotation3D
mesh: hex
mode: serial
np: 1

solver: advectorVoF
theme:  davof

setfields_app: initDavofFields
setfields_args: ""
post_solve: "python3 {REPO}/workflow/scripts/tpf_advection_metrics.py --case . --out advectorVoF.csv"

axes_override:
  N_CELLS: [32, 64]
  TARGET_ADVECTIVE_CO: [0.2]
  TPF_SETFLOW_MODE: [function]
  TPF_VELOCITY_ARM: [lineX]
  TPF_SPHERE_CX: [0.25]
  TPF_AXIS_X: [0.25]
  END_TIME: [0.45]
  TPF_WRITE_INTERVAL: [0.15]
  TPF_ROW: [davof-planeSurf-exact]
  TPF_VOLUME_RULE: [kromerBothe]
  TPF_ANCHOR_METHOD: [ccs]
  TPF_FLUX_INTEGRATION: [sweptFaceCells]
  TPF_SWEPT_SCALE: ["true"]
  TPF_SWEPT_FACE_UPDATE: [pieces]
  TPF_SWEPT_COPLANAR: [donorSide]
  TPF_SWEPT_CAP_SET: [final]
  TPF_PLANE_SOURCE: [anchor]
  TPF_ALPHA_BC: [fixedValue]
  TPF_RECON_ERROR_EVERY_STEP: ["true"]
  TPF_DAVOF_METHOD: [exactSphere]
  TPF_AFE_CONSISTENCY: ["false"]
  TPF_AFE_FACE_CSV: ["true"]
  TPF_SWEPT_CONSISTENCY_LOG: ["true"]
  TPF_SWEPT_CONSISTENT: ["true"]
  TPF_KB_FAN: ["auto"]
collapse_other_axes: true

solve_mem_mb: 8000
solve_runtime: 180

export_slides: false

env_preamble: "source $HOME/OpenFOAM/OpenFOAM-v2606/etc/bashrc"
