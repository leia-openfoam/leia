# Control of sphereRotation3D_hexHist (2026-11-01; predictions and
# analysis in that file's header): (a) the exact sphere (omega, axisPoint) as every interface cell's clipping surface (row davof-exactSurface-exact), the prism flux (the swept flux is implemented for planes only, so this control differs from the base in the surface AND the flux; its partner without the surface change is (c)), volume rule exactSphere (Strobl, Formella, Poeschel, J. Comput. Phys. 311 (2016) 158-172, doi:10.1016/j.jcp.2016.02.003).
#
#   sbatch --parsable -J leia-davof-sphereRotation3D_hexHistExactSurf --export=ALL,STUDY=davof/sphereRotation3D_hexHistExactSurf run-studies.sbatch
study_name: sphereRotation3D_hexHistExactSurf
studies_dir: studies/davof
case: davof/sphereRotation3D
mesh: hex
mode: serial
np: 1

solver: advectorVoF
theme:  davof

setfields_app: initDavofFields
setfields_args: ""
post_solve: "python3 {REPO}/workflow/scripts/tpf_advection_metrics.py --case . --out advectorVoF.csv"

axes_override:
  N_CELLS: [32, 64]
  TARGET_ADVECTIVE_CO: [0.2]
  TPF_ROW: [davof-exactSurface-exact]
  TPF_VELOCITY_ARM: [rotation]
  TPF_VOLUME_RULE: [exactSphere]
  TPF_ANCHOR_METHOD: [ccs]
  TPF_FLUX_INTEGRATION: [prism]
  TPF_SWEPT_SCALE: ["true"]
  TPF_SWEPT_FACE_UPDATE: [pieces]
  TPF_SWEPT_COPLANAR: [donorSide]
  TPF_PLANE_SOURCE: [anchor]
  TPF_ALPHA_BC: [fixedValue]
  TPF_RECON_ERROR_EVERY_STEP: ["true"]
  TPF_DAVOF_METHOD: [exactSphere]
  TPF_AFE_CONSISTENCY: ["false"]
  TPF_KB_FAN: ["auto"]
collapse_other_axes: true

solve_mem_mb: 8000
solve_runtime: 45

export_slides: false

env_preamble: "source $HOME/OpenFOAM/OpenFOAM-v2606/etc/bashrc"
