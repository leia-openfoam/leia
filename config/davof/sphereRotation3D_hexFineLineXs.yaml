# The x-line with dt / sqrt(2) (2026-11-02): TARGET_ADVECTIVE_CO 0.2/sqrt(2),
# the same speed pi/2 along x from (0.25 0.5 0.5), END_TIME 0.45; 0.0889 h per
# step along x, the per-axis displacement of sphereRotation3D_hexFineLineDiag.
# The control that crosses the direction with the per-axis displacement;
# measure and predictions (P-L1..P-L4): sphereRotation3D_hexFineLineDiagM.yaml.
#
#   sbatch --parsable -J leia-davof-sphereRotation3D_hexFineLineXs --export=ALL,STUDY=davof/sphereRotation3D_hexFineLineXs run-studies.sbatch
study_name: sphereRotation3D_hexFineLineXs
studies_dir: studies/davof
case: davof/sphereRotation3D
mesh: hex
mode: serial
np: 1

solver: advectorVoF
theme:  davof

setfields_app: initDavofFields
setfields_args: ""
post_solve: "python3 {REPO}/workflow/scripts/tpf_advection_metrics.py --case . --out advectorVoF.csv"

axes_override:
  N_CELLS: [32, 64]
  TARGET_ADVECTIVE_CO: [0.1414213562373095]
  TPF_SETFLOW_MODE: [function]
  TPF_VELOCITY_ARM: [lineX]
  TPF_SPHERE_CX: [0.25]
  TPF_AXIS_X: [0.25]
  END_TIME: [0.45]
  TPF_WRITE_INTERVAL: [0.15]
  TPF_ROW: [davof-planeSurf-exact]
  TPF_VOLUME_RULE: [kromerBothe]
  TPF_ANCHOR_METHOD: [ccs]
  TPF_FLUX_INTEGRATION: [sweptFaceCells]
  TPF_SWEPT_SCALE: ["true"]
  TPF_SWEPT_FACE_UPDATE: [pieces]
  TPF_SWEPT_COPLANAR: [donorSide]
  TPF_SWEPT_CAP_SET: [final]
  TPF_PLANE_SOURCE: [anchor]
  TPF_ALPHA_BC: [fixedValue]
  TPF_RECON_ERROR_EVERY_STEP: ["true"]
  TPF_DAVOF_METHOD: [exactSphere]
  TPF_AFE_CONSISTENCY: ["false"]
  TPF_KB_FAN: ["auto"]
collapse_other_axes: true

solve_mem_mb: 8000
solve_runtime: 60

export_slides: false

env_preamble: "source $HOME/OpenFOAM/OpenFOAM-v2606/etc/bashrc"
