# Study 2 of the plan of 2026-10-23: the SIX-COEFFICIENT SURFACE WITH ITS OWN
# VOLUME FLUX, the month-3 milestone of the proposal, on the Cartesian mesh.
# The translated sphere (cases/davof/sphereTranslation3D: R = 0.15 in the
# 2 x 1 x 1 box, U = (1 0 0), 3.3 diameters, the quadraticFaces state); the
# clipping surface of every interface cell is the paraboloid with six
# coefficients in the frame of the normal the scheme used (offset, two slopes,
# the curvature tensor), all six fitted to the cell's own face fractions by the
# Gauss-Newton of leia's regeneration (2026-10-12) with the ring tensor as the
# prior; the volume flux through a face is the liquid volume of the swept prism
# under that surface and the new face fraction the pre-image's liquid fraction
# under it (fork isoAdvectionCurved.C, clippingSurface paraboloid), so that
# alpha_k and alpha_f are the moments of one surface per cell at every step
# (the requirement of 2026-10-16). Rows: the normal that frames the fit (the
# fitted slopes take its tilt): the own normal everywhere (cellLocal), the own
# normal with the ring normal below |m_c| < 0.1 h^2 and 0.01 h^2 (cellSliver01,
# cellSliver001: the ring-evaluated share is reported), the ring normal
# everywhere (ringArea), the exact normal (the control). N = 32 / 64 / 128,
# Co 0.1 / 0.2 / 0.5: 5 x 3 x 3 = 45 serial cases; the per-step diagnostics on
# (the face-fraction error every step, the fit residual, the surface defect).
#
# Scoring, as the hex study: q the order of L1(alphaf) over N at the end of
# the run (one period = 3.3 diameters) and, from the per-step history, the
# order of the error after the first step (per step); the normal order; min
# alpha; the mass error; plus the fit's share of non-converging cells, its max
# and mean residual, and the surface defect's max and L1 per step.
#
# PRE-REGISTERED PREDICTIONS (2026-10-23, before the run; the priors: the plane
# loop's q = 0.80 / 0.81 / 1.00 at Co 0.1 / 0.2 / 0.5, the zero-velocity
# identity of the six-coefficient surface, the sagitta result that the volume
# anchor fails under the plane flux, and the proposal's accounting that the
# remainders of the fit at the displaced pre-images sum to O(h) over a period
# unless they cancel):
# P-P1 (per step): with the exact normal the face-fraction error after ONE step
#   is second order over N = 32 to 128 (at least 1.8), the first evidence that
#   the per-step update is O(h^2) with a fitted surface. FALSIFIED below 1.5.
# P-P2 (per period, the milestone's question): the order of L1(alphaf) at the
#   end of the run with the exact normal lies between 1 and 2; the hypothesis
#   of the proposal is q >= 1.8 and the null hypothesis of its accounting is
#   q = 1; this study decides between them. Stated as a two-sided prediction
#   on purpose: either outcome is the result.
# P-P3 (the loop): the ring-normal row is bounded at every N and Co; the
#   own-normal row (cellLocal) is bounded too, because second-order face
#   fractions remove the mismatch the sliver cells amplify (the sliver
#   mechanism acts on the first-order fractions of the plane loop); the
#   sliver variants lie between. FALSIFIED if cellLocal aborts at every N.
# P-P4 (the fit): the fit converges in at least 99 % of the interface cells at
#   N = 64 and 128 (leia's static 0.1 to 0.6 % failures), and the surface
#   defect stays below 1e-3 of V in L1 at N = 128 (the state stays consistent
#   with the surface that produced it). FALSIFIED if the defect grows over the
#   run by more than a factor ten from its first-step value.
# P-P5 (the normal): with the own normal and second-order fractions the
#   transported normal is second order (the clipping law) with a constant
#   below the ring normal's; the ring normal stays first order (the mean
#   normal of the ring). FALSIFIED if cellLocal's L1(n) order is below 1.5.
#
#   sbatch --parsable -J leia-davof-sphereTranslation3D_hexParaboloid --export=ALL,STUDY=davof/sphereTranslation3D_hexParaboloid run-studies.sbatch
study_name: sphereTranslation3D_hexParaboloid
studies_dir: studies/davof
case: davof/sphereTranslation3D
mesh: hex
mode: serial
np: 1

solver: advectorVoF
theme:  davof

setfields_app: initDavofFields
setfields_args: ""
post_solve: "python3 {REPO}/workflow/scripts/tpf_advection_metrics.py --case . --out advectorVoF.csv"

# The YAML booleans and the write controls are QUOTED: they are rendered
# verbatim into the OpenFOAM dictionaries (false, not False).
axes_override:
  N_CELLS: [32, 64, 128]
  TARGET_ADVECTIVE_CO: [0.1, 0.2, 0.5]
  TPF_ROW: [davof-paraboloid-exact, davof-paraboloid-cellLocal, davof-paraboloid-cellSliver01, davof-paraboloid-cellSliver001, davof-paraboloid-ringArea]
  TPF_AFE_CONSISTENCY: ["false"]
collapse_other_axes: true

# The N = 128 case (4.2e6 cells, four field writes) needs more than the Slurm
# default; the fit and the prism quadrature add to the step time.
solve_mem_mb: 12000
solve_runtime: 2880

export_slides: false

env_preamble: "source $HOME/OpenFOAM/OpenFOAM-v2606/etc/bashrc"
