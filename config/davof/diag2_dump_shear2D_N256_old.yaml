# diag2 (2026-11-14; docs/davof/REPORT-swept.md 'Pieces path: aborts and cost'): shear2D N 256 (8 ranks), pieces + alphaDump, OLD keys
# sbatch -J diag2_dump_shear2D_N256_old --export=ALL,STUDY=davof/diag2_dump_shear2D_N256_old run-studies.sbatch
study_name: diag2_dump_shear2D_N256_old
studies_dir: studies/davof
case: davof/isoShear2D
mesh: hex
mode: parallel
np: 8

solver: davofAdvectorFoam
theme:  davof

setfields_app: "initDavofFields && initVortex2D"
setfields_args: ""
post_solve: "python3 {REPO}/workflow/scripts/tpf_advection_metrics.py --case . --out advectorVoF.csv"

axes_override:
  N_CELLS: [256]
  TPF_ROW: [davof-planeSurf-ringArea]
  TARGET_ADVECTIVE_CO: [0.2]
  TPF_REPETITION: [1]
  TPF_GRAZING_CUT: [fork]
  TPF_CCS_END_INTERVAL: [none]
  TPF_CCS_TOLERANCE: [absolute]
  TPF_POSITIONING_TOL: ["1e-14"]
  TPF_ENRIGHT_SETTING: [recommendedDump]
collapse_other_axes: true

solve_mem_mb: 3000
solve_runtime: 600

export_slides: false

env_preamble: "source $HOME/OpenFOAM/OpenFOAM-v2606/etc/bashrc"
