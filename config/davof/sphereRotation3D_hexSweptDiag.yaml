# Where the plane-clipped loop breaks under rotation (2026-10-29, step 2 of
# the rotation plan): the two N = 64 cases of sphereRotation3D_hexSwept that
# aborted (exact normal, fluxIntegration prism and sweptFace, clippingSurface
# plane) re-run with the fork's diagnostic sweptClassify true: per step the
# swept faces classified by the cells their pre-image (vertices and centre)
# reaches beyond the donor (donor only / an interface cell / a full cell / an
# empty cell / outside the vertex ring), the first cell that leaves [0, 1] by
# more than 1e-10 after the conservative bounding printed with its faces'
# phi, dVf before and after the bounding and their classes, and the mass
# sum(alpha V) after the advection, the bounding and the clipping relative
# to t^n, every step. 2 serial cases; the per-step columns nSweptClass* and
# mass* in advectorVoF.csv, the event in log.advectorVoF.
#
# PRE-REGISTERED (2026-10-29). HYPOTHESIS H-D1: the pre-images of most swept
# faces reach an INTERFACE neighbour (the sphere's interface cells form a
# shell two cells thick at N = 64, and the tangential displacement Co h
# sin(theta) carries the vertices of every lateral face into the neighbour
# along the interface), so the class table is dominated by "interface", and
# the first unbounded cell is an interface cell whose outflow face has its
# pre-image in an interface neighbour whose own plane would have given a
# smaller liquid volume: the one-donor clipping over-fluxes. H-D2: the mass
# change through the conservative bounding is zero to round-off (the
# bounding corrects fluxes antisymmetrically) and the -3e-3 % of the N = 32
# runs comes from the clipping stage or the boundary, i.e. the "clipping"
# or "advection" term of the mass line is the one that is not zero.
# FALSIFIED (H-D1) by a class table dominated by "donor only" or "full"/
# "empty" with the first unbounded cell's responsible face of class
# donorOnly: then a missing flux limiter, not the one-donor clipping, is the
# cause; (H-D2) by a non-zero bounding term.
#
# MEASURED (2026-10-29, cluster job 55749811, fork 60c13fe; both cases abort
# as before, prism at step 565, sweptFace at step 390). The class table of
# the swept faces, summed over the first 50 steps (per step in brackets):
#   prism     donor only 10456 (209), interface 434432 (8689), full 47685 (954),
#             empty 149119 (2982), outside 0        of 641692 faces
#   sweptFace donor only 0,            interface 432090 (8642), full 54268 (1085),
#             empty 155386 (3108), outside 0        of 641744 faces
# so 67 % of the swept faces reach an INTERFACE neighbour, 23 % an empty
# cell, 8 % a full cell, and with the traced pre-image no face stays inside
# its donor: H-D1 HELD on the table. The first unbounded cell: prism at step
# 14, an interface cell of alpha 1.67e-4 (a sliver) going to -1.4e-8, whose
# outflow face (dVf 6.72e-10 before the bounding, 6.69e-10 after, against a
# content of 6.36e-10) has its pre-image in an interface neighbour (class
# interfaceNbr): the one-donor clip, H-D1's mechanism; sweptFace at step 1, a
# FULL cell (alpha 1, no surface) going to 1 + 3.1e-7 because the inflow
# from the interface cell upstream, 2.54666e-7 from the geometric swept
# volume, exceeds the outflow 2.54665e-7 = phi dt to a full cell: the traced
# swept volume under rotation is not phi dt (relative 4e-6, the order of
# (omega dt)^2/12), a kinematic inconsistency the prism does not have (its
# volume d.S_f IS phi dt); the fork's sweptScaleToPhi (813e8a1) removes it.
# The mass through the bounding: at round-off for sweptFace (max 1.2e-14 per
# step, sum -1.9e-12 over 390 steps) and NOT for prism (max 9.9e-9 per step
# from step 528, sum +2.8e-4; the bounding's corrections then touch the
# boundary faces of cells the unbounded wisps have reached): H-D2 HELD until
# the loop is already unbounded. The advection stage itself is conservative
# to 1e-15 per step until about step 150 (the solver's deviation 1e-12 % at
# step 100) and loses up to 1e-7 per step afterwards (sum -1.9e-5 prism,
# +3.9e-6 sweptFace), with min(alpha) -4.5e-9 at step 200 (prism), -0.013 at
# step 250 (sweptFace): the mass loss is a symptom of the unboundedness, not
# its cause. Interface cells 1760 -> 17693 (prism) and 17648 (sweptFace) at
# the abort. Decision for step 3: the one-donor clipping is the cause of the
# prism's first event and the dominant class; the swept flux needs the
# piecewise clip AND the kinematic scaling.
#
#   sbatch --parsable -J leia-davof-sphereRotation3D_hexSweptDiag --export=ALL,STUDY=davof/sphereRotation3D_hexSweptDiag run-studies.sbatch
study_name: sphereRotation3D_hexSweptDiag
studies_dir: studies/davof
case: davof/sphereRotation3D
mesh: hex
mode: serial
np: 1

solver: advectorVoF
theme:  davof

setfields_app: initDavofFields
setfields_args: ""
post_solve: "python3 {REPO}/workflow/scripts/tpf_advection_metrics.py --case . --out advectorVoF.csv"

# The YAML booleans are QUOTED: they are rendered verbatim into the OpenFOAM
# dictionaries (false, not False).
axes_override:
  N_CELLS: [64]
  TARGET_ADVECTIVE_CO: [0.2]
  TPF_ROW: [davof-planeSurf-exact]
  TPF_VELOCITY_ARM: [rotation]
  TPF_VOLUME_RULE: [kromerBothe]
  TPF_ANCHOR_METHOD: [ccs]
  TPF_FLUX_INTEGRATION: [prism, sweptFace]
  TPF_SWEPT_CLASSIFY: ["true"]
  TPF_DAVOF_METHOD: [exactSphere]
  TPF_AFE_CONSISTENCY: ["false"]
  TPF_KB_FAN: ["auto"]
collapse_other_axes: true

solve_mem_mb: 12000
solve_runtime: 1440

export_slides: false

env_preamble: "source $HOME/OpenFOAM/OpenFOAM-v2606/etc/bashrc"
