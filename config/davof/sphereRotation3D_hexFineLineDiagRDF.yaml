# plicRDF + isoAdvector on the x-z diagonal (2026-11-02): the fork's standard
# isoAdvection with the plicRDF reconstruction (J. Roenby, H. Bredmose, H.
# Jasak, A computational method for sharp interface advection, R. Soc. Open
# Sci. 3 (2016) 160405, doi:10.1098/rsos.160405, arXiv:1601.05392; H. Scheufler, J. Roenby,
# Accurate and efficient surface reconstruction from volume fraction data on
# general meshes, J. Comput. Phys. 383 (2019) 1-23,
# doi:10.1016/j.jcp.2019.01.009, arXiv:1801.05382) on the case, N, speed, dt
# and window of sphereRotation3D_hexFineLineDiag, from the same initial alpha
# (initDavofFields exactSphere; plicRDF ignores alphaf.water), fields every
# 0.0125. The comparator row as in sphereRotation3D_hexComparators: the davof
# keys at their inert defaults. Read-out: the static face fractions of its
# alpha and the cell-level error (app staticFaceFractions), its own Eshape and
# L1(x) (reconstructionError every step). Measures and the pre-registered
# predictions (R-1): sphereRotation3D_hexFineLineDiagW.yaml.
#
#   sbatch --parsable -J leia-davof-sphereRotation3D_hexFineLineDiagRDF --export=ALL,STUDY=davof/sphereRotation3D_hexFineLineDiagRDF run-studies.sbatch
study_name: sphereRotation3D_hexFineLineDiagRDF
studies_dir: studies/davof
case: davof/sphereRotation3D
mesh: hex
mode: serial
np: 1

solver: advectorVoF
theme:  davof

setfields_app: initDavofFields
setfields_args: ""
post_solve: "python3 {REPO}/workflow/scripts/tpf_advection_metrics.py --case . --out advectorVoF.csv"

# The YAML booleans are QUOTED: they are rendered verbatim into the OpenFOAM
# dictionaries (false, not False).
axes_override:
  N_CELLS: [32, 64]
  TARGET_ADVECTIVE_CO: [0.2]
  TPF_SETFLOW_MODE: [function]
  TPF_VELOCITY_ARM: [lineDiagXZ]
  TPF_SPHERE_CX: [0.25]
  TPF_SPHERE_CZ: [0.25]
  TPF_AXIS_X: [0.25]
  TPF_AXIS_Z: [0.25]
  END_TIME: [0.45]
  TPF_WRITE_INTERVAL: [0.0125]
  TPF_ROW: [plicRDF]
  TPF_ALPHA_BC: [fixedValue]
  TPF_RECON_ERROR_EVERY_STEP: ["true"]
  TPF_DAVOF_METHOD: [exactSphere]
  TPF_AFE_CONSISTENCY: ["false"]
collapse_other_axes: true

solve_mem_mb: 8000
solve_runtime: 60

export_slides: false

env_preamble: "source $HOME/OpenFOAM/OpenFOAM-v2606/etc/bashrc"
