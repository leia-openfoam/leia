# CCS aligned with the published method, Stage B (2026-11-14; docs/davof/REPORT-swept.md): deformation3D N 32, hex, davof rows.
# TARGET_ADVECTIVE_CO 0.2 and 0.5 as the standing studies; 0.96545 = OF Co 0.95 (the stored plicRDF case at target 1 reaches max Co 0.9840).
# diag1 (2026-11-15; REPORT-swept.md 'One plane per face on curved interfaces: first fault'): sbatch -J diag1d_deformation3D_N32 --export=ALL,STUDY=davof/diag1d_deformation3D_N32 run-studies.sbatch
study_name: sw2b_deformation3D_N32
studies_dir: studies/davof
case: davof/isoDeformation3D
mesh: hex
mode: serial
np: 1

solver: davofAdvectorFoam
theme:  davof

setfields_app: "initDavofFields"
setfields_args: ""
post_solve: "python3 {REPO}/workflow/scripts/tpf_advection_metrics.py --case . --out advectorVoF.csv"

axes_override:
  N_CELLS: [32]
  TPF_ROW: [davof-planeSurf-ringArea]
  TARGET_ADVECTIVE_CO: [0.2]
  TPF_REPETITION: [1]
  TPF_GRAZING_CUT: [openfoam]
  TPF_CCS_END_INTERVAL: [cubic]
  TPF_CCS_TOLERANCE: [relative]
  TPF_POSITIONING_TOL: ["1e-12"]
  TPF_ENRIGHT_SETTING: [onePlaneDiag, onePlaneS1D, onePlaneS2lowD, onePlaneS2allD, onePlaneS1S2lowD, onePlaneS1S2allD]
collapse_other_axes: true

solve_mem_mb: 4000
solve_runtime: 400

export_slides: false

env_preamble: "source $HOME/OpenFOAM/OpenFOAM-v2606/etc/bashrc"
