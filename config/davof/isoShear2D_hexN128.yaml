# The isoAdvector package's verification, the 2D sheared disc (the standing study set of
# 2026-11-07; fork branch davof-isoAdvector): the preparation of the cases of isoShear2D
# at N 128 on 1 rank(s) (rendered, meshed, initialised; a short END_TIME). The timed
# runner workflow/scripts/davof_iso/iso-time.sbatch (FLOW Shear2D) copies them, sets the
# end time 8 and the write interval 2 and runs the rows and repetitions.
#
#   sbatch --parsable -J leia-davof-isoShear2D_hexN128 --export=ALL,STUDY=davof/isoShear2D_hexN128 run-studies.sbatch
# PRE-REGISTERED (2026-11-07, before any run). The sheared disc of Rider & Kothe 1998
# (cases/davof/isoShear2D.parameter: R 0.15 at (0.5, 0.75), T = 8, the reversal at 4)
# on the one-cell-thick hexahedral mesh, N = 64 / 128 / 256 on 1 / 1 / 8 ranks (scotch),
# OpenFOAM Co 0.2 / 0.5 / 1; the rows RDF, RDFccs, RING, RINGvcc, ISO as in
# isoShear3D_hexN32.yaml, the same initial alpha and alphaf (initDavofFields
# exactCylinder), scored at t = T against the initial disc (E_shape with exactState
# exactCylinder, L1(x), L1(n), L1(alphaf) of the DAVOF rows), the bounds and the mass
# over the run, the interface-cell counts at the writes (T/4), three timed repetitions
# per cell at equal ranks and one profiled run.
#   S-1  Completion and bounds. RDF, RDFccs and ISO complete every cell. The DAVOF rows
#        (the plane-clipped loop fragments under straining: the 3D shear and deformation
#        rows of 2026-11-06 abort by the interface-cell guard at t 1.5-1.6 of 3) complete
#        at N 64 and OF Co 0.2 only, bounded to 1e-6 at most, and abort (the
#        interface-cell guard) at N >= 128 for every Co and at Co >= 0.5 at every N.
#        Falsified if a DAVOF row completes bounded to 1e-9 at N 256 and Co 1, or aborts
#        at N 64 Co 0.2.
#   S-2  The template against the fork's testsuite (test-vortexShearedDisc,
#        expected_results.csv: plicRDF E_shape 8.157e-3 / 2.334e-3 / 5.366e-4 at N 64 /
#        128 / 256, isoAlpha 9.411e-3 / 1.469e-3 / 4.343e-4; adaptive maxAlphaCo 0.5,
#        thickness 1, nAlphaBounds 5): RDF and ISO at OF Co 0.5 within 15 % of these
#        values at every N (the fixed step, the cubic cells and nAlphaBounds 3 change the
#        number, not its decade). Falsified by a deviation above 30 % at any N.
#   S-3  Errors where RING completes: E_shape(RING) / E_shape(RDF) in [0.7, 1.5], L1(n)
#        ratio in [0.7, 2.0]. Falsified by a ratio above 2 or an unbounded completion.
#   S-4  Wall clock per step at equal ranks: RING / RDF in [0.6, 1.2] where RING
#        completes (the ring is small in 2D; the face update's extra cost small on a
#        one-cell-thick mesh), the DAVOF reconstruction's share below plicRDF's.
#        Falsified by RING / RDF > 1.5 at a completed cell.
#   S-5  Orders over N (64 -> 128 -> 256) of E_shape for RDF and ISO between 1.5 and 2.5
#        at every Co. Falsified by an order below 1 or above 3.
#   Also reported, not predicted: L1(alphaf) of the DAVOF rows, the interface-cell
#   counts, the measured OF Courant number (REFERENCE_SPEED provisional 1.2, set from
#   the first preparation's initVortex2D line before the timed runs), the alpha = 0.5
#   contours.
study_name: isoShear2D_hexN128
studies_dir: studies/davof
case: davof/isoShear2D
mesh: hex
mode: serial
np: 1

solver: advectorVoF
theme:  davof

setfields_app: "initDavofFields && initVortex2D"
setfields_args: ""
post_solve: "python3 {REPO}/workflow/scripts/tpf_advection_metrics.py --case . --out advectorVoF.csv"

# The YAML booleans are QUOTED: they are rendered verbatim into the OpenFOAM
# dictionaries (false, not False).
axes_override:
  N_CELLS: [128]
  TPF_ROW: [plicRDF, plicRDF-ccs, davof-ringArea, davof-ringArea-vofCutCell, isoAlpha]
  TARGET_ADVECTIVE_CO: [0.2, 0.5, 1]
  # the preparation runs a few steps; the timed runner sets the end time and the
  # write intervals
  END_TIME: [0.05]
  TPF_WRITE_INTERVAL: [0.05]
  TPF_AFE_WRITE_INTERVAL: [0.05]
  TPF_VFE_WRITE_INTERVAL: [0.05]
collapse_other_axes: true

solve_mem_mb: 3000
solve_runtime: 30

export_slides: false

env_preamble: "source $HOME/OpenFOAM/OpenFOAM-v2606/etc/bashrc"
