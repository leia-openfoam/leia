# The ladder of the plane-clipped loop under solid-body rotation (2026-10-29,
# steps 3 and 4 of the rotation plan): cases/davof/sphereRotation3D (the
# sphere turned once about the axis parallel to y through (0.75 . 0.5),
# omega 2 pi, END_TIME 1, Co 0.2 at the sphere's far point), N = 32 / 64 /
# 128, rows davof-planeSurf-exact and davof-planeSurf-ringArea
# (clippingSurface plane, the volume anchor), fluxIntegration prism against
# sweptFaceCells, the piecewise clip of the fork branch davof-swept: the
# swept volume cut into the pieces inside the donor and its vertex-ring
# cells, each wet (a full cell), dry (an empty cell) or clipped by that
# cell's own PLIC plane of t^n (an interface cell), the piece volumes from
# the clipped triangles and the cap areas solved from closure
# (davofSweptPieces.H, verified against the note's multicell reference).
# The one-donor sweptFace rows at N = 32 and 64 are the study
# sphereRotation3D_hexSwept (same binary family, fork d33eafb) for the
# comparison. 3 x 2 x 2 = 12 serial cases. The swept flux runs with
# sweptScaleToPhi true (TPF_SWEPT_SCALE; fork 2026-10-29): the liquid share
# of the swept volume times phi_f dt, because the step-2 diagnostic found
# the traced swept volume of a face under rotation to differ from phi_f dt
# (a full cell next to an interface cell gained 3e-7 in the first step at
# N = 64 with the geometric volume, the first unbounded cell of the
# one-donor sweptFace run); the prism is unaffected by the key (its volume
# is phi_f dt). The study sphereRotation3D_hexSweptScale isolates the key.
#
# PRE-REGISTERED (2026-10-29, before the run). P-R1: with sweptFaceCells the
# N = 64 abort of the exact-normal row (prism and sweptFace aborted on the
# interface-cell guard at steps 565 and 390) disappears: the run completes
# the turn. P-R2: the mass change through the conservative bounding is at
# round-off (the "bounding" term of the fork's mass line below 1e-12 in
# every step), and the total mass deviation of the turn falls from the
# -2e-3 to -3e-3 % of the one-donor rows to below 1e-10 %. P-R3: every
# sweptFaceCells row is bounded (min(alpha) after the bounding above -1e-12
# in every step) and conservative (|Emass| below 1e-12 relative) at every N.
# P-R4: L1(alphaf) at the end of the turn is first order per turn with the
# ring normal (the pairwise order over 32-64-128 in [0.8, 1.3]) and at
# least that with the exact normal; the centre error L1(x) second order
# (above 1.7). P-R5: sweptFaceCells ends at or below prism in L1(alphaf) at
# every N (the prism is the wrong swept shape under rotation and clips
# every piece by the donor's plane). FALSIFIED: P-R1 by an abort of the
# N = 64 exact row; P-R2 by a bounding term above 1e-10; P-R3 by
# min(alpha) below -1e-10 or |Emass| above 1e-10; P-R4 by an order below
# 0.6; P-R5 by a sweptFaceCells row above the prism's at any N. The
# diagnostics to read with the verdicts: the pieces per step, the faces
# beyond one layer (expected zero at Co 0.2 away from the walls), the rank
# fallbacks (a PLIC plane parallel to a cell face), the piece closure
# residual (round-off), the partial cells without a surface.
#
# MEASURED (2026-10-29, job 55751077, fork 78464c0, alpha zeroGradient on the
# patches; 12 of 12 cases ended, tables davof_advection_sphereRotation3D_hexSweptCells*):
# P-R1 HELD: the prism aborts at N = 64 (steps 565 exact, 268 ring) and at
# N = 128 (602, 105); sweptFaceCells completes the turn at every N with both
# normals. P-R2: the bounding's mass term is at round-off in every step
# (max 1e-15 relative), HELD; the total deviation is -1.1e-5 % to -7.5e-6 %
# (exact) and -4.4e-5 % to -1.6e-5 % (ring), FALSIFIED as written: it is the
# boundary inflow of the zeroGradient alpha (P-R6, study *CellsIO: zero with
# alpha fixedValue). P-R3 PARTLY: min(alpha) after the bounding -9.9e-14 to
# -3.5e-12 at every N, but the largest excess over 1 is 6e-12 / 1.7e-11 at
# N = 32 / 64 and 2.9e-6 (exact) and 3.8e-7 (ring) at N = 128: a full-cell
# overshoot above 1e-10 at the finest rung, FALSIFIED there. P-R4 FALSIFIED:
# L1(alphaf) at the end 5.49e-2 / 4.30e-2 / 3.83e-2 (exact, orders 0.35,
# 0.17) and 6.70e-2 / 4.90e-2 / 4.05e-2 (ring, 0.45, 0.28); the first-step
# error is 4.2e-2 / 3.5e-2 / 3.3e-2, i.e. the piecewise FACE UPDATE commits
# an O(1)-in-h error at once (H-F1, study *CellsDonorFace: with the
# donor-plane face update the first-step error is the prism's, 5.1e-3). The
# centre error L1(x) 1.50e-3 / 4.75e-4 / 1.39e-4 (orders 1.66, 1.77) and
# Eshape 4.64e-4 / 1.38e-4 / 3.99e-5 (1.75, 1.79) for the exact normal, 2.03
# / 1.94 and 1.93 / 1.93 for the ring: the volume transport is second order.
# P-R5 FALSIFIED at N = 32 (5.49e-2 against the prism's 2.33e-2, exact) and
# not decidable at N = 64 / 128 (the prism aborts). Pieces: no face beyond
# one layer at any N, rank fallbacks 43 / 82 / 170 faces per step at most,
# degenerate pieces at most 1 per step. Cost per step: prism 0.16 / 1.04 /
# 7.39 s (the latter two up to the abort), sweptFaceCells 0.28 / 1.44 /
# 9.05 s at N = 32 / 64 / 128.
#
#   sbatch --parsable -J leia-davof-sphereRotation3D_hexSweptCells --export=ALL,STUDY=davof/sphereRotation3D_hexSweptCells run-studies.sbatch
study_name: sphereRotation3D_hexSweptCells
studies_dir: studies/davof
case: davof/sphereRotation3D
mesh: hex
mode: serial
np: 1

solver: advectorVoF
theme:  davof

setfields_app: initDavofFields
setfields_args: ""
post_solve: "python3 {REPO}/workflow/scripts/tpf_advection_metrics.py --case . --out advectorVoF.csv"

# The YAML booleans are QUOTED: they are rendered verbatim into the OpenFOAM
# dictionaries (false, not False).
axes_override:
  N_CELLS: [32, 64, 128]
  TARGET_ADVECTIVE_CO: [0.2]
  TPF_ROW: [davof-planeSurf-exact, davof-planeSurf-ringArea]
  TPF_VELOCITY_ARM: [rotation]
  TPF_VOLUME_RULE: [kromerBothe]
  TPF_ANCHOR_METHOD: [ccs]
  TPF_FLUX_INTEGRATION: [prism, sweptFaceCells]
  TPF_SWEPT_CLASSIFY: ["false"]
  TPF_SWEPT_SCALE: ["true"]
  TPF_DAVOF_METHOD: [exactSphere]
  TPF_AFE_CONSISTENCY: ["false"]
  TPF_KB_FAN: ["auto"]
collapse_other_axes: true

# N = 128: 4.2e6 cells, 1600 steps, four field writes
solve_mem_mb: 16000
solve_runtime: 2880

export_slides: false

env_preamble: "source $HOME/OpenFOAM/OpenFOAM-v2606/etc/bashrc"
