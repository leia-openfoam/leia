# diag2 task C PC2 dump rerun, Co 0.95 only; task C (2026-11-15): the Stage B pieces matrix recomputed with the coplanar rule made consistent (112c284a): shear3D N 32, recommended only
# sbatch -J diag2_c_shear3D_N32 --export=ALL,STUDY=davof/diag2_c_shear3D_N32 run-studies.sbatch
study_name: diag2_cd_shear3D_N32
studies_dir: studies/davof
case: davof/isoShear3D
mesh: hex
mode: serial
np: 1

solver: davofAdvectorFoam
theme:  davof

setfields_app: "initDavofFields && initShearFlow3D"
setfields_args: ""
post_solve: "python3 {REPO}/workflow/scripts/tpf_advection_metrics.py --case . --out advectorVoF.csv"

axes_override:
  N_CELLS: [32]
  TPF_ROW: [davof-planeSurf-ringArea]
  TARGET_ADVECTIVE_CO: [0.8776]
  TPF_REPETITION: [1]
  TPF_GRAZING_CUT: [openfoam]
  TPF_CCS_END_INTERVAL: [cubic]
  TPF_CCS_TOLERANCE: [relative]
  TPF_POSITIONING_TOL: ["1e-12"]
  TPF_ENRIGHT_SETTING: [recommendedPieceDump1]
collapse_other_axes: true

solve_mem_mb: 4000
solve_runtime: 600

export_slides: false

env_preamble: "source $HOME/OpenFOAM/OpenFOAM-v2606/etc/bashrc"
