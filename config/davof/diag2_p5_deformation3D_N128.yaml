# diag2 (2026-11-14; docs/davof/REPORT-swept.md 'Pieces path: aborts and cost'): deformation3D N 128 (64 ranks) Co 0.2, NEW keys, P5/P6 (coplanar rule made consistent, diag2 2026-11-15)
# sbatch -J diag2_p5_deformation3D_N128 --export=ALL,STUDY=davof/diag2_p5_deformation3D_N128 run-studies.sbatch
study_name: diag2_p5_deformation3D_N128
studies_dir: studies/davof
case: davof/isoDeformation3D
mesh: hex
mode: parallel
np: 64

solver: davofAdvectorFoam
theme:  davof

setfields_app: "initDavofFields"
setfields_args: ""
post_solve: "python3 {REPO}/workflow/scripts/tpf_advection_metrics.py --case . --out advectorVoF.csv"

axes_override:
  N_CELLS: [128]
  TPF_ROW: [davof-planeSurf-ringArea]
  TARGET_ADVECTIVE_CO: [0.2]
  TPF_REPETITION: [1]
  TPF_GRAZING_CUT: [openfoam]
  TPF_CCS_END_INTERVAL: [cubic]
  TPF_CCS_TOLERANCE: [relative]
  TPF_POSITIONING_TOL: ["1e-12"]
  TPF_ENRIGHT_SETTING: [recommended]
collapse_other_axes: true

solve_mem_mb: 4000
solve_runtime: 420

export_slides: false

env_preamble: "source $HOME/OpenFOAM/OpenFOAM-v2606/etc/bashrc"
