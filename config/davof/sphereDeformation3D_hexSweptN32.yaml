# The 3D deformation (Enright / LeVeque) comparison of the swept-face advection with
# plicRDF + isoAdvector (2026-11-06): the preparation of the cases (short END_TIME; the
# timed runner workflow/scripts/davof_enright/enright-time.sbatch sets T = 3 and the
# write intervals). Purpose and predictions: sphereDeformation3D_hexSweptN32.yaml.
#
#   sbatch --parsable -J leia-davof-sphereDeformation3D_hexSweptN32 --export=ALL,STUDY=davof/sphereDeformation3D_hexSweptN32 run-studies.sbatch
# PRE-REGISTERED (2026-11-06, before any run; Tomislav's task of 2026-11-06). The 3D
# deformation (LeVeque 1996 / Enright et al. 2002): sphere R 0.15 at (0.35 0.35 0.35) in the
# unit cube, T = 3, N = 32 / 64 / 128 on 1 / 8 / 64 ranks (scotch), OpenFOAM Co 0.5 and 1
# (dt = Co h / 2.5, 3 N 2.5 / Co steps). Rows: ours = the swept-face advection with the ring
# normal (davof-planeSurf-ringArea) in the reference setting of 407f969 plus the four
# bit-for-bit keys of round 4 (sweptAxisPlanes, sweptTetCache, sweptPointVelocityLazy,
# sweptPreTestCoplanarSide, all true: the study setting); the comparator = isoAdvector +
# plicRDF with nAlphaBounds 5, snapTol 0, clip false, nAlphaCorr 1 (the fork's deformation
# test). No exact-normal row (a deformed sphere has no exact normal). Same initial alpha and
# alphaf (initDavofFields exactSphere), same mesh, dt, decomposition and ranks. Scored at
# t = T against the initial sphere (the exact end state). Timing: total wall clock per case at
# equal ranks, three repetitions on exclusive i01 nodes, diagnostics at the write times only.
#   E-1  Both methods complete every case (6 cells each) and conserve the volume to 1e-10 %
#        (the log's dev % at every step). Falsified by an abort (reported with the counters,
#        not tuned around) or by |dev| > 1e-10 % at any step.
#   E-2  Ours stays bounded to 1e-9 over the whole run (min alpha >= -1e-9, excess <= 1e-9)
#        at both Co and every N. plicRDF's boundedness is measured; expectation from the
#        comparison of 2026-11-03 (unbounded on the diagonal at OF Co 1 in parallel): plicRDF
#        leaves [0, 1] by more than 1e-6 at Co 1 for N >= 64. Falsified for ours by any
#        excursion beyond 1e-9.
#   E-3  E_shape at T (sum |alpha - alpha_exact| V against the initial sphere): the ratio
#        ours / plicRDF lies in [0.7, 1.5] at every N >= 64 and both Co (the ring normal is
#        first order, plicRDF's second; the swept flux is bounded where isoAdvector's is
#        not; on the rotation ours was 7-21 % better in L1(x), on the diagonal at Co 0.2
#        4-12 % worse). Falsified if the ratio exceeds 2 at N = 128 for either Co: the thin
#        sheet (thinner than h at T/2 for N <= 64) is where the one-layer ring stencil and the
#        wisp rule are stressed, and a ratio above 2 would mean the ring normal on the sheet
#        loses more than the swept flux gains.
#   E-4  Orders over N of E_shape at T (log2 of the ratio on 32 -> 64 and 64 -> 128): both
#        methods between 1 and 2.5 on 64 -> 128 at both Co (the sphere returns under-resolved
#        at N = 32, so 32 -> 64 may exceed 2). Falsified for ours by an order below 1 on
#        64 -> 128.
#   E-5  Wall clock ours / plicRDF at equal ranks between 2 and 4 (Tomislav's prediction; the
#        reference setting measured 1.9 x serial at N 64 and 3.1 x on 64 ranks on the rotation,
#        where the interface is a sphere; the sheet at T/2 multiplies the interface cells, and
#        the swept flux's cost follows the interface band while isoAdvector's is mostly
#        mesh-wide). Falsified if the median ratio exceeds 6 at any N.
#   E-6  (the third row, added by Tomislav on 2026-11-06 after E-1 .. E-5 were registered and
#        before any of its runs: isoAdvector's own plane flux with the DAVOF ring normal and the
#        CCS positioning, the fork's plane-clipped loop = the preprint's davof-ringArea row plus
#        ccs: reconstructionScheme davof, normalModel ringArea, positioning ccs, faceClipping
#        plane, clippingSurface none, fitAnchor faces, fluxIntegration prism, nAlphaBounds 3,
#        snapTol 0, clip false, the swept keys inert.) Expectation from the rotation (it
#        diverged there at OF Co 1 and was within 4 % of the swept loop at Co 0.2): the plane
#        loop loses boundedness beyond 1e-6 at Co 1 for every N and ends by the abort guard or
#        unbounded; at Co 0.5 it completes with E_shape within a factor 1.3 of the swept row;
#        its wall clock is within 1.5 x plicRDF's (the flux is isoAdvector's). Falsified if it
#        stays bounded to 1e-9 at Co 1 for every N.
#   Also reported, not predicted: L1(x), L1(n), L1(alphaf) (ours) at T, the interface-cell and
#   wisp counts at T/2 and T, the swept counters per step (rank fallbacks, beyond-layer
#   faces, pyramid delta max, twisted faces, wisp pieces, bounding passes), setFlow's
#   continuity error, and the pictures of the alpha = 0.5 surface at T/2 and T.
#
study_name: sphereDeformation3D_hexSweptN32
studies_dir: studies/davof
case: davof/sphereDeformation3D
mesh: hex
mode: serial
np: 1

solver: advectorVoF
theme:  davof

setfields_app: initDavofFields
setfields_args: ""
post_solve: "python3 {REPO}/workflow/scripts/tpf_advection_metrics.py --case . --out advectorVoF.csv"

# The YAML booleans are QUOTED: they are rendered verbatim into the OpenFOAM
# dictionaries (false, not False).
axes_override:
  N_CELLS: [32]
  TPF_ROW: [davof-planeSurf-ringArea]
  TARGET_ADVECTIVE_CO: [0.5, 1]
  # the preparation runs a few steps; the timed runner sets END_TIME 3 and the
  # write intervals 0.75
  END_TIME: [0.05]
  TPF_WRITE_INTERVAL: [0.05]
  TPF_AFE_WRITE_INTERVAL: [0.05]
  TPF_VFE_WRITE_INTERVAL: [0.05]
collapse_other_axes: true

solve_mem_mb: 3000
solve_runtime: 60

export_slides: false

env_preamble: "source $HOME/OpenFOAM/OpenFOAM-v2606/etc/bashrc"
