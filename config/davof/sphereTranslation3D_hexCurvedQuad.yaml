# The accuracy of the curved quadrature (2026-10-23): one step of the
# exact-surface gate on the exact-sphere state at N = 32, Co 0.2, over the prism
# quadrature's tolerance and depth. Smoke 2 at 1e-8 / 9 reported a surface
# defect (alpha_k of the exact state against the ray-quadrature volume under the
# exact sphere) of 2.4e-4 in L1 and 6e-4 at most, constant over the run, while
# the face fractions were exact and the volume fractions did not drift (Eshape
# constant to three digits over 160 steps): the defect is a discrepancy between
# the initialisation's box-ball volumes (adaptive Simpson, 1e-12) and the ray
# quadrature of the cell volume, not of the flux prisms. This study measures
# how the defect falls with the tolerance and the depth, which bounds the
# accuracy of the volume anchor (it uses the same ray quadrature). 9 one-step
# cases.
#
# PRE-REGISTERED (2026-10-23): P-Q1 the defect L1 falls below 1e-6 at 1e-12 /
# 14 (the quadrature converges to the initialisation's volumes); FALSIFIED if
# it stays at 1e-4 at every tolerance: the two integrations then disagree
# systematically (one of them wrong), to be located before the anchored ladders.
#
#   sbatch --parsable -J leia-davof-sphereTranslation3D_hexCurvedQuad --export=ALL,STUDY=davof/sphereTranslation3D_hexCurvedQuad run-studies.sbatch
study_name: sphereTranslation3D_hexCurvedQuad
studies_dir: studies/davof
case: davof/sphereTranslation3D
mesh: hex
mode: serial
np: 1

solver: advectorVoF
theme:  davof

setfields_app: initDavofFields
setfields_args: ""
post_solve: "python3 {REPO}/workflow/scripts/tpf_advection_metrics.py --case . --out advectorVoF.csv"

axes_override:
  N_CELLS: [32]
  TARGET_ADVECTIVE_CO: [0.2]
  TPF_ROW: [davof-exactSurface-exact]
  TPF_DAVOF_METHOD: [exactSphere]
  END_TIME: [0.00625]
  TPF_WRITE_INTERVAL: [0.00625]
  TPF_CURVED_TOL_REL: [1e-8, 1e-10, 1e-12]
  TPF_CURVED_MAX_DEPTH: [9, 12, 14]
  TPF_AFE_CONSISTENCY: ["false"]
collapse_other_axes: true

solve_mem_mb: 4000
solve_runtime: 120

export_slides: false

env_preamble: "source $HOME/OpenFOAM/OpenFOAM-v2606/etc/bashrc"
