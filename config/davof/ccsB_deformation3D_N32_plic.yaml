# CCS aligned with the published method, Stage B (2026-11-14; docs/davof/REPORT-swept.md): deformation3D N 32, hex, plic rows.
# TARGET_ADVECTIVE_CO 0.2 and 0.5 as the standing studies; 0.96545 = OF Co 0.95 (the stored plicRDF case at target 1 reaches max Co 0.9840).
# sbatch -J ccsB-deformation3D-N32-plic --export=ALL,STUDY=davof/ccsB_deformation3D_N32_plic run-studies.sbatch
study_name: ccsB_deformation3D_N32_plic
studies_dir: studies/davof
case: davof/isoDeformation3D
mesh: hex
mode: serial
np: 1

solver: davofAdvectorFoam
theme:  davof

setfields_app: "initDavofFields"
setfields_args: ""
post_solve: "python3 {REPO}/workflow/scripts/tpf_advection_metrics.py --case . --out advectorVoF.csv"

axes_override:
  N_CELLS: [32]
  TPF_ROW: [plicRDF]
  TARGET_ADVECTIVE_CO: [0.96545]
  TPF_REPETITION: [1]
  TPF_GRAZING_CUT: [fork]
collapse_other_axes: true

solve_mem_mb: 4000
solve_runtime: 240

export_slides: false

env_preamble: "source $HOME/OpenFOAM/OpenFOAM-v2606/etc/bashrc"
