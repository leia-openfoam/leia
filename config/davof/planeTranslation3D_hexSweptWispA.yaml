# planeTranslation3D_hexSweptWisp passes 15 of 62 cases; three causes:
# (i) the oblique arm, one face fraction of step 1 short by 1.05e-5: a corner
#     below 1e-8 V of a ring cell counted empty (sweptWispTol 0: 8.6e-14);
# (ii) the normal arm at Co 0.95 (OpenFOAM Co 1.53): L1(alphaf) 0.115 at
#     step 1, the faces outside the face-neighbour candidate band keep the
#     algebraic flux and a stale face fraction (sweptConsistent: 7.8e-12, with
#     (i) 1.6e-13);
# (iii) not changed by (i), (ii): min alpha growing x1.4 per step at Co 0.8
#     on the normal arm (OpenFOAM Co 1.29; -2.5e-10 at N = 80, -7e-6 at
#     N = 160), with thousands of one-donor rank fallbacks per step;
#     hypothesis: the fallback is a donor-cell flux, unstable above OpenFOAM
#     Co 1; and L1(alphaf) 1e-12 to 6e-12 at N >= 80, hypothesis: the anchor's
#     tolerance anchorTolRel 1e-11.
# F-2 on the rotation (sweptWispSurface neighbour): accuracy within 1e-3, but
# min alpha -1.7e-5 (N = 64 exact): the neighbour's plane extended into a wisp
# of a curved interface gives it more liquid than it holds. The rule
# sweptWispSurface anchored keeps the neighbour's normal and positions the
# plane by the wisp's alpha (the PLIC of the wisp).
#
# The mass clause (corrected, an open case): Eshape / sum(alpha V) at the
# last step below 1e-12, Eshape = int |alpha - alpha_exact| dV bounding
# |M - M_exact| at whatever time the run ends (at Co 0.95, END_TIME 8e-4 is
# not a multiple of dt and the run ends at 7.6e-4; the comparison with the
# plane-clipped loop's mass deviation at 8e-4 was not valid there).
# The Courant number: the target Co is of |U| (dt = Co h); OpenFOAM's
# 0.5 sum|phi_f| dt / V = sum_k |U_k| dt / h is 1.612 Co on the normal arm,
# Co on the oblique arm; the per-axis displacement 0.8124 Co h resp. Co h.
#
# PRE-REGISTERED (2026-11-03, before the runs of this file):
# A-1 (the plane, final rule: sweptWispSurface anchored, sweptWispTol 0,
#   sweptConsistent true): run maxima of L1(alphaf) and L1(n) below 1e-12,
#   bounded (min alpha >= -1e-12, excess <= 1e-11), mass clause above, on
#   every case with OpenFOAM Co <= 1 (both arms Co 0.2 / 0.5, the oblique arm
#   0.8 / 0.95) at N = 20 / 40; at N = 80 / 160 below 1e-11 (the anchor
#   tolerance, (iii)). The normal arm at Co 0.8 / 0.95 (OpenFOAM Co > 1):
#   expected to fail boundedness from N = 80 by (iii), reported, not tuned.
# A-2 (discriminators of (iii), pg-var2): the normal arm N = 80 at Co 0.6
