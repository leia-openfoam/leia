# A-3 (the curved cases with the final rule, sphereRotation3D_hexRotFinalWispA,
#   sphereTranslation3D_hexSweptLadderWispA): bounded as the default (min
#   alpha >= -1e-10, excess <= 1e-10), conservative (mass deviation <= 1e-10
#   percent), L1(alphaf), L1(x), E_shape within 1 % of the default.
# This agent's expectation: A-1 and A-2 hold; A-3 holds on boundedness; the
# accuracy change stays below 1e-3 as with neighbour.
