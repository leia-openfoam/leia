# plicRDF + isoAdvector on the x-line (2026-11-02): the x-line partner of
# sphereRotation3D_hexFineLineDiagRDF (references and read-out there), on the
# case, N, speed, dt and window of sphereRotation3D_hexFineLineX, from the same
# initial alpha, fields every 0.0125. Measures and the pre-registered
# predictions (R-1): sphereRotation3D_hexFineLineDiagW.yaml.
#
#   sbatch --parsable -J leia-davof-sphereRotation3D_hexFineLineXRDF --export=ALL,STUDY=davof/sphereRotation3D_hexFineLineXRDF run-studies.sbatch
study_name: sphereRotation3D_hexFineLineXRDF
studies_dir: studies/davof
case: davof/sphereRotation3D
mesh: hex
mode: serial
np: 1

solver: advectorVoF
theme:  davof

setfields_app: initDavofFields
setfields_args: ""
post_solve: "python3 {REPO}/workflow/scripts/tpf_advection_metrics.py --case . --out advectorVoF.csv"

# The YAML booleans are QUOTED: they are rendered verbatim into the OpenFOAM
# dictionaries (false, not False).
axes_override:
  N_CELLS: [32, 64]
  TARGET_ADVECTIVE_CO: [0.2]
  TPF_SETFLOW_MODE: [function]
  TPF_VELOCITY_ARM: [lineX]
  TPF_SPHERE_CX: [0.25]
  TPF_AXIS_X: [0.25]
  END_TIME: [0.45]
  TPF_WRITE_INTERVAL: [0.0125]
  TPF_ROW: [plicRDF]
  TPF_ALPHA_BC: [fixedValue]
  TPF_RECON_ERROR_EVERY_STEP: ["true"]
  TPF_DAVOF_METHOD: [exactSphere]
  TPF_AFE_CONSISTENCY: ["false"]
collapse_other_axes: true

solve_mem_mb: 8000
solve_runtime: 60

export_slides: false

env_preamble: "source $HOME/OpenFOAM/OpenFOAM-v2606/etc/bashrc"
