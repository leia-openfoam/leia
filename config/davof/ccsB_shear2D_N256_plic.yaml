# CCS aligned with the published method, Stage B (2026-11-14; docs/davof/REPORT-swept.md): shear2D N 256, hex, plic rows.
# TARGET_ADVECTIVE_CO 0.2 and 0.5 as the standing studies; 0.95077 = OF Co 0.95 (the stored plicRDF case at target 1 reaches max Co 0.9992).
# sbatch -J ccsB-shear2D-N256-plic --export=ALL,STUDY=davof/ccsB_shear2D_N256_plic run-studies.sbatch
study_name: ccsB_shear2D_N256_plic
studies_dir: studies/davof
case: davof/isoShear2D
mesh: hex
mode: parallel
np: 8

solver: davofAdvectorFoam
theme:  davof

setfields_app: "initDavofFields && initVortex2D"
setfields_args: ""
post_solve: "python3 {REPO}/workflow/scripts/tpf_advection_metrics.py --case . --out advectorVoF.csv"

axes_override:
  N_CELLS: [256]
  TPF_ROW: [plicRDF]
  TARGET_ADVECTIVE_CO: [0.95077]
  TPF_REPETITION: [1]
  TPF_GRAZING_CUT: [fork]
collapse_other_axes: true

solve_mem_mb: 3000
solve_runtime: 900

export_slides: false

env_preamble: "source $HOME/OpenFOAM/OpenFOAM-v2606/etc/bashrc"
