# CCS aligned with the published method (Tomislav, 2026-11-14; docs/davof/REPORT-swept.md
# "CCS aligned with the published method"): Gate A-plane. Both rows (onePlane and pieces = the
# recommended setting), OF Co 0.2 / 0.5 / 0.8 / 0.95 / 1 (the normal arm's TARGET_ADVECTIVE_CO =
# OF Co / 1.6124; the oblique arm's = OF Co), N 20 / 40 / 80 / 160, ccsEndInterval cubic, ccsTolerance
# relative 1e-12, grazingCut openfoam.
# sbatch -J ccs-plane-normal-np8 --export=ALL,STUDY=davof/ccs_plane_normal_np8 run-studies.sbatch
study_name: ccs_plane_normal_np8
studies_dir: studies/davof
case: davof/planeTranslation3D
mesh: hex
mode: parallel
np: 8
solver: davofAdvectorFoam
theme:  davof
setfields_app: initDavofFields
setfields_args: ""
post_solve: "python3 {REPO}/workflow/scripts/tpf_advection_metrics.py --case . --out advectorVoF.csv"
axes_override:
  TPF_SURF_CELL_TOL: ["1e-8"]
  TPF_RECON_WISP_TOL: ["1e-3"]
  TPF_ENRIGHT_SETTING: [onePlane, recommended]
  TPF_GRAZING_CUT: [openfoam]
  TPF_CCS_END_INTERVAL: [cubic]
  TPF_CCS_TOLERANCE: [relative]
  TPF_POSITIONING_TOL: ["1e-12"]
  N_CELLS: [20, 40, 80, 160]
  TARGET_ADVECTIVE_CO: [0.124, 0.3101, 0.4961, 0.5892, 0.6202]
  TPF_VELOCITY_ARM: [normal]
  TPF_ROW: [davof-planeSurf-ringArea]
  TPF_VOLUME_RULE: [kromerBothe]
  TPF_ANCHOR_METHOD: [ccs]
  TPF_FLUX_INTEGRATION: [sweptFaceCells]
  TPF_SWEPT_SCALE: ["true"]
  TPF_SWEPT_FACE_UPDATE: [pieces]
  TPF_SWEPT_COPLANAR: [donorSide]
  TPF_SWEPT_CAP_SET: [final]
  TPF_PLANE_SOURCE: [anchor]
  TPF_KB_FAN: ["auto"]
  TPF_SWEPT_AXIS_PLANES: ["true"]
  TPF_SWEPT_TET_CACHE: ["true"]
  TPF_SWEPT_POINT_VELOCITY_LAZY: ["true"]
  TPF_SWEPT_PRE_TEST_COPLANAR_SIDE: ["true"]
  TPF_WRITE_PRECISION: ["17"]
  TPF_RECON_ERROR_EVERY_STEP: ["false"]
  TPF_PROFILING: ["false"]
collapse_other_axes: true
solve_mem_mb: 4000
solve_runtime: 240
export_slides: false
env_preamble: "source $HOME/OpenFOAM/OpenFOAM-v2606/etc/bashrc"
