# diag2 (2026-11-14; docs/davof/REPORT-swept.md 'Pieces path: aborts and cost'): deformation3D N 128 (64 ranks), plicRDF + OpenFOAM profiling
# sbatch -J diag2_prof_deformation3D_N128_plic --export=ALL,STUDY=davof/diag2_prof_deformation3D_N128_plic run-studies.sbatch
study_name: diag2_prof_deformation3D_N128_plic
studies_dir: studies/davof
case: davof/isoDeformation3D
mesh: hex
mode: parallel
np: 64

solver: davofAdvectorFoam
theme:  davof

setfields_app: "initDavofFields"
setfields_args: ""
post_solve: "python3 {REPO}/workflow/scripts/tpf_advection_metrics.py --case . --out advectorVoF.csv"

axes_override:
  N_CELLS: [128]
  TPF_ROW: [plicRDF]
  TARGET_ADVECTIVE_CO: [0.2, 0.95834]
  TPF_REPETITION: [1]
  END_TIME: [0.6]
  TPF_WRITE_INTERVAL: [0.15]
  TPF_AFE_WRITE_INTERVAL: [0.15]
  TPF_VFE_WRITE_INTERVAL: [0.15]
  TPF_PROFILING: ["true"]
  TPF_GRAZING_CUT: [fork]
collapse_other_axes: true

solve_mem_mb: 4000
solve_runtime: 29

export_slides: false

env_preamble: "source $HOME/OpenFOAM/OpenFOAM-v2606/etc/bashrc"
