# The consistency of the swept flux, the rotation base with the consistent
# variant (2026-11-02, fork davof-swept c635611): sphereRotation3D_hexHist
# (the solid-body rotation, one turn, exact row, N = 32, 64) with
# sweptConsistent true and sweptConsistencyLog true (serial). Submitted ONLY
# if C-1 of sphereRotation3D_hexFineLineDiagCons holds (the consistent
# diagonal X-like at both N); its prediction R-1 is in that header.
#
#   sbatch --parsable -J leia-davof-sphereRotation3D_hexHistCons --export=ALL,STUDY=davof/sphereRotation3D_hexHistCons run-studies.sbatch
study_name: sphereRotation3D_hexHistCons
studies_dir: studies/davof
case: davof/sphereRotation3D
mesh: hex
mode: serial
np: 1

solver: advectorVoF
theme:  davof

setfields_app: initDavofFields
setfields_args: ""
post_solve: "python3 {REPO}/workflow/scripts/tpf_advection_metrics.py --case . --out advectorVoF.csv"

axes_override:
  N_CELLS: [32, 64]
  TARGET_ADVECTIVE_CO: [0.2]
  TPF_ROW: [davof-planeSurf-exact]
  TPF_VELOCITY_ARM: [rotation]
  TPF_VOLUME_RULE: [kromerBothe]
  TPF_ANCHOR_METHOD: [ccs]
  TPF_FLUX_INTEGRATION: [sweptFaceCells]
  TPF_SWEPT_SCALE: ["true"]
  TPF_SWEPT_FACE_UPDATE: [pieces]
  TPF_SWEPT_COPLANAR: [donorSide]
  TPF_PLANE_SOURCE: [anchor]
  TPF_ALPHA_BC: [fixedValue]
  TPF_RECON_ERROR_EVERY_STEP: ["true"]
  TPF_DAVOF_METHOD: [exactSphere]
  TPF_AFE_CONSISTENCY: ["false"]
  TPF_SWEPT_CONSISTENCY_LOG: ["true"]
  TPF_SWEPT_CONSISTENT: ["true"]
  TPF_KB_FAN: ["auto"]
collapse_other_axes: true

solve_mem_mb: 8000
solve_runtime: 300

export_slides: false

env_preamble: "source $HOME/OpenFOAM/OpenFOAM-v2606/etc/bashrc"
