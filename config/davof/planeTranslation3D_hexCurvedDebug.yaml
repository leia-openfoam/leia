# Quadrature diagnostic on the plane (2026-10-24): one step of the volume-positioned
# ring-tensor surface with the exact normal at N = 40, Co 0.2, both arms, with the
# fork's curvedDebug on: the cell with the largest anchor residual BEFORE the anchor
# (on the exact plane state the surface encloses alpha V, so that residual is the
# ray quadrature's own error) is printed with each of its pyramids against the
# exact linear cut of the Detrixhe-Aslam tets. The plane test at 1e-11 tolerances
# sits at 4e-6 to 1e-5 in L1 with the anchor's face shift 2e-4 at the first step
# and the surface defect at 1e-14, so the quadrature, not the anchor, is off in
# some cells; this locates them. 2 one-step cases.
#
#   sbatch --parsable -J leia-davof-planeTranslation3D_hexCurvedDebug --export=ALL,STUDY=davof/planeTranslation3D_hexCurvedDebug run-studies.sbatch
study_name: planeTranslation3D_hexCurvedDebug
studies_dir: studies/davof
case: davof/planeTranslation3D
mesh: hex
mode: serial
np: 1

solver: advectorVoF
theme:  davof

setfields_app: initDavofFields
setfields_args: ""
post_solve: "python3 {REPO}/workflow/scripts/tpf_advection_metrics.py --case . --out advectorVoF.csv"

axes_override:
  N_CELLS: [40]
  TARGET_ADVECTIVE_CO: [0.2]
  TPF_ROW: [davof-paraboloidRing-exact]
  TPF_VELOCITY_ARM: [normal, oblique]
  END_TIME: [2e-5]
  TPF_CURVED_DEBUG: ["true"]
collapse_other_axes: true

solve_mem_mb: 4000
solve_runtime: 30

export_slides: false

env_preamble: "source $HOME/OpenFOAM/OpenFOAM-v2606/etc/bashrc"
