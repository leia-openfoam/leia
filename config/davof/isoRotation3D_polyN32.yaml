# The isoAdvector package's verification on the poly mesh class (fork branch
# davof-isoAdvector, 2026-11-06): the preparation of the cases of isoRotation3D at N 32 on 1
# rank(s) (rendered, meshed, initialised; a short END_TIME). The
# timed runner workflow/scripts/davof_iso/iso-time.sbatch (MESHCLASS=poly) copies them.
# Purpose and predictions: isoRotation3D_polyN32.yaml (M-1 .. M-4) and isoRotation3D_hexN32.yaml.
#
#   sbatch --parsable -J leia-davof-isoRotation3D_polyN32 --export=ALL,STUDY=davof/isoRotation3D_polyN32 run-studies.sbatch
study_name: isoRotation3D_polyN32
studies_dir: studies/davof
case: davof/isoRotation3D
mesh: poly
mode: serial
np: 1

solver: advectorVoF
theme:  davof

setfields_app: "initDavofFields"
setfields_args: ""
post_solve: "python3 {REPO}/workflow/scripts/tpf_advection_metrics.py --case . --out advectorVoF.csv"

# The YAML booleans are QUOTED: they are rendered verbatim into the OpenFOAM
# dictionaries (false, not False).
axes_override:
  N_CELLS: [32]
  TPF_ROW: [plicRDF, plicRDF-ccs, davof-ringArea, davof-ringArea-vofCutCell, isoAlpha]
  TARGET_ADVECTIVE_CO: [0.0463, 0.1157]
  TPF_DAVOF_METHOD: [quadraticFaces]
  TPF_REF_METHOD: [quadraticFaces]
  END_TIME: [0.02]
  TPF_WRITE_INTERVAL: [0.02]
  TPF_AFE_WRITE_INTERVAL: [0.02]
  TPF_VFE_WRITE_INTERVAL: [0.02]
collapse_other_axes: true

solve_mem_mb: 3000
solve_runtime: 30

export_slides: false

env_preamble: "source $HOME/OpenFOAM/OpenFOAM-v2606/etc/bashrc"
