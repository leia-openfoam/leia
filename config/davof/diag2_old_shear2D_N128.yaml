# diag2 (2026-11-14; docs/davof/REPORT-swept.md 'Pieces path: aborts and cost'): shear2D N 128, pieces, old keys
# the OLD key set of the CCS change: ccsEndInterval none, ccsTolerance absolute 1e-14, grazingCut fork
# sbatch -J diag2_old_shear2D_N128 --export=ALL,STUDY=davof/diag2_old_shear2D_N128 run-studies.sbatch
study_name: diag2_old_shear2D_N128
studies_dir: studies/davof
case: davof/isoShear2D
mesh: hex
mode: serial
np: 1

solver: davofAdvectorFoam
theme:  davof

setfields_app: "initDavofFields && initVortex2D"
setfields_args: ""
post_solve: "python3 {REPO}/workflow/scripts/tpf_advection_metrics.py --case . --out advectorVoF.csv"

axes_override:
  N_CELLS: [128]
  TPF_ROW: [davof-planeSurf-ringArea]
  TARGET_ADVECTIVE_CO: [0.2, 0.5]
  TPF_REPETITION: [1]
  TPF_GRAZING_CUT: [fork]
  TPF_CCS_END_INTERVAL: [none]
  TPF_CCS_TOLERANCE: [absolute]
  TPF_POSITIONING_TOL: ["1e-14"]
  TPF_ENRIGHT_SETTING: [recommended]
collapse_other_axes: true

solve_mem_mb: 3000
solve_runtime: 29

export_slides: false

env_preamble: "source $HOME/OpenFOAM/OpenFOAM-v2606/etc/bashrc"
