# The control of planeTranslation3D_perturbedWarped (2026-10-25, fork branch davof-warped): the
# same perturbed-hexahedra plane with the DEFAULT fan apex of the warped flux prism (vertexMean:
# the prism's top and bottom fanned about the vertex mean while the cell's face, the displaced face
# of the face fraction and the Detrixhe-Aslam tets are fanned about the mesh face centre), N = 20
# and 40, Co 0.2, both rows, both arms, face state and tensor centroid in the two combinations
# scalar + cut (the build before the keys, i.e. the dual advection as it stands on warped faces)
# and vector + anchored (everything of the Warped study but the apex) and the two mixed ones.
#
# PRE-REGISTERED (2026-10-25, before any run):
# P-W4: with vertexMean the two fans of a warped face differ by a thin lens, and the liquid the
#      prism carries differs from the liquid crossing the cell's face by the liquid of the lens at
#      the top minus that of its translate at the bottom; every combination, vector + anchored
#      included, fails the 1e-12 gate (1e-8 to 1e-4 in L1(alphaf)), so the apex is a necessary part
#      of the warped transport; the scalar + cut row shows the state of the dual advection on warped
#      faces before this branch.
# FALSIFIED IF vector + anchored passes the gate with vertexMean (the lens carries no liquid at
#      this level; the apex key would then be cosmetic).
#
# RESULT (2026-10-25, fork davof-warped 73a3f57): P-W4 holds. With vertexMean every combination
# fails: vector + anchored 2.0e-5 to 3.0e-5 in L1(alphaf) (Linf 5e-4 to 1.1e-3, L1(n) 1e-14 for
# the exact row, 2e-5 to 3e-5 for the ring row), scalar + cut 2.6e-5 to 3.5e-5 (exact) and
# 2.6e-4 to 4.1e-4 (ring), against round-off with faceCentre (planeTranslation3D_perturbedWarped).
#
#   sbatch --parsable -J leia-davof-planeTranslation3D_perturbedWarpedApex --export=ALL,STUDY=davof/planeTranslation3D_perturbedWarpedApex run-studies.sbatch
study_name: planeTranslation3D_perturbedWarpedApex
studies_dir: studies/davof
case: davof/planeTranslation3D
mesh: perturbed
mode: serial
np: 1

solver: advectorVoF
theme:  davof

setfields_app: initDavofFields
setfields_args: ""
post_solve: "python3 {REPO}/workflow/scripts/tpf_advection_metrics.py --case . --out advectorVoF.csv"

axes_override:
  N_CELLS: [20, 40]
  TARGET_ADVECTIVE_CO: [0.2]
  TPF_ROW: [davof-paraboloidRing-exact, davof-paraboloidRing-ringArea]
  TPF_VELOCITY_ARM: [normal, oblique]
  TPF_VOLUME_RULE: [kromerBothe]
  TPF_DAVOF_METHOD: [detrixheAslam]
  TPF_FACE_STATE: [scalar, vector]
  TPF_TENSOR_CENTROID: [cut, anchored]
  TPF_KB_PRISM_APEX: [vertexMean]
collapse_other_axes: true

solve_mem_mb: 12000
solve_runtime: 480

export_slides: false

env_preamble: "source $HOME/OpenFOAM/OpenFOAM-v2606/etc/bashrc"
