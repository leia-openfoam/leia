# The port acceptance, the Co 1 comparison (PORT-DESIGN 4.4, 2026-11-06): the preparation
# of the cell (LineDiag, Swept, N 32) on the leia route, rendered from sphereRotation3D_hexCmpLineDiagSweptN32.yaml with the solver and the four
# round-4 keys changed; the timed runner workflow/scripts/davof_cmp/port-cmp-time.sbatch
# copies the prepared cases and runs both routes on one exclusive node.
# Part of the timed comparison with plicRDF (2026-11-03): the preparation of
# the cases (short END_TIME). Purpose and predictions:
# sphereRotation3D_hexCmpLineXSweptN32.yaml.
#
#   sbatch --parsable -J leia-davof-sphereRotation3D_hexCmpLineDiagSweptN32 --export=ALL,STUDY=davof/sphereRotation3D_hexCmpLineDiagSweptN32 run-studies.sbatch
study_name: port_cmpLineDiagSweptN32_leia
studies_dir: studies/davof
case: davof/sphereRotation3D
mesh: hex
mode: serial
np: 1

solver: davofAdvectorFoam
theme:  davof

setfields_app: initDavofFields
setfields_args: ""
post_solve: "python3 {REPO}/workflow/scripts/tpf_advection_metrics.py --case . --out advectorVoF.csv"

# The YAML booleans are QUOTED: they are rendered verbatim into the OpenFOAM
# dictionaries (false, not False).
axes_override:
  N_CELLS: [32]
  TARGET_ADVECTIVE_CO: [0.225079079039, 1.1253953952]
  TPF_SETFLOW_MODE: [function]
  TPF_VELOCITY_ARM: [lineDiagXZ]
  TPF_SPHERE_CX: [0.25]
  TPF_SPHERE_CZ: [0.25]
  TPF_AXIS_X: [0.25]
  TPF_AXIS_Z: [0.25]
  END_TIME: [0.02]
  TPF_WRITE_INTERVAL: [0.02]
  TPF_ROW: [davof-planeSurf-ringArea, davof-planeSurf-exact]
  TPF_VOLUME_RULE: [kromerBothe]
  TPF_ANCHOR_METHOD: [ccs]
  TPF_FLUX_INTEGRATION: [sweptFaceCells]
  TPF_SWEPT_SCALE: ["true"]
  TPF_SWEPT_FACE_UPDATE: [pieces]
  TPF_SWEPT_COPLANAR: [donorSide]
  TPF_SWEPT_CAP_SET: [final]
  TPF_PLANE_SOURCE: [anchor]
  TPF_ALPHA_BC: [fixedValue]
  TPF_RECON_ERROR_EVERY_STEP: ["false"]
  TPF_DAVOF_METHOD: [exactSphere]
  TPF_AFE_CONSISTENCY: ["false"]
  TPF_KB_FAN: ["auto"]
  TPF_PROFILING: ["false"]
  TPF_AFE_WRITE_CONTROL: [onEnd]
  TPF_VFE_WRITE_CONTROL: [onEnd]
  TPF_SWEPT_WISP_SURFACE: [matched]
  TPF_SWEPT_WISP_TOL: [0]
  TPF_SWEPT_CONSISTENT: ["true"]
  TPF_SWEPT_WISP_MATCH_TOL: [1e-9]
  TPF_SWEPT_VOLUME_CORRECTION: [scale]
  TPF_SWEPT_AXIS_PLANES: ["true"]
  TPF_SWEPT_TET_CACHE: ["true"]
  TPF_SWEPT_POINT_VELOCITY_LAZY: ["true"]
  TPF_SWEPT_PRE_TEST_COPLANAR_SIDE: ["true"]
collapse_other_axes: true

solve_mem_mb: 3000
solve_runtime: 60

export_slides: false

env_preamble: "source $HOME/OpenFOAM/OpenFOAM-v2606/etc/bashrc"
