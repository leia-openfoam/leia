# The isoAdvector package's verification (fork branch davof-isoAdvector, 2026-11-06): the
# preparation of the cases of isoRotation3D at N 64 on 8 rank(s) (rendered, meshed,
# initialised, decomposed; a short END_TIME). The timed runner
# workflow/scripts/davof_iso/iso-time.sbatch copies them, sets the end time and the write
# intervals and runs the rows and repetitions. Purpose and predictions:
# isoRotation3D_hexN32.yaml.
#
#   sbatch --parsable -J leia-davof-isoRotation3D_hexN64 --export=ALL,STUDY=davof/isoRotation3D_hexN64 run-studies.sbatch
study_name: isoRotation3D_hexN64
studies_dir: studies/davof
case: davof/isoRotation3D
mesh: hex
mode: parallel
np: 8

solver: advectorVoF
theme:  davof

setfields_app: "initDavofFields"
setfields_args: ""
post_solve: "python3 {REPO}/workflow/scripts/tpf_advection_metrics.py --case . --out advectorVoF.csv"

# The YAML booleans are QUOTED: they are rendered verbatim into the OpenFOAM
# dictionaries (false, not False).
axes_override:
  N_CELLS: [64]
  TPF_ROW: [plicRDF, plicRDF-ccs, davof-ringArea, davof-ringArea-vofCutCell, isoAlpha]
  TARGET_ADVECTIVE_CO: [0.0463, 0.1157, 0.2315]
  # the preparation runs a few steps; the timed runner sets the end time and the
  # write intervals
  END_TIME: [0.02]
  TPF_WRITE_INTERVAL: [0.02]
  TPF_AFE_WRITE_INTERVAL: [0.02]
  TPF_VFE_WRITE_INTERVAL: [0.02]
collapse_other_axes: true

solve_mem_mb: 3000
solve_runtime: 30

export_slides: false

env_preamble: "source $HOME/OpenFOAM/OpenFOAM-v2606/etc/bashrc"
