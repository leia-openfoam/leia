# pointIsoAdvector (2026-11-16; docs/davof/REPORT-swept.md 'pointIsoAdvector'): shear2D N 64, row pointIso (pointIsoAdvection + plicRDF), the targets of ccsB_*_iso
# sbatch -J pointIso_shear2D_N64 --export=ALL,STUDY=davof/pointIso_shear2D_N64 run-studies.sbatch
study_name: pointIso_shear2D_N64
studies_dir: studies/davof
case: davof/isoShear2D
mesh: hex
mode: serial
np: 1

solver: davofAdvectorFoam
theme:  davof

setfields_app: "initDavofFields && initVortex2D"
setfields_args: ""
post_solve: "python3 {REPO}/workflow/scripts/tpf_advection_metrics.py --case . --out advectorVoF.csv"

axes_override:
  N_CELLS: [64]
  TPF_ROW: [pointIso]
  TARGET_ADVECTIVE_CO: [0.2, 0.5, 0.95173]
  TPF_REPETITION: [1]
  TPF_ENRIGHT_SETTING: [pointIso]
  TPF_GRAZING_CUT: [fork]
collapse_other_axes: true

solve_mem_mb: 3000
solve_runtime: 240

export_slides: false

env_preamble: "source $HOME/OpenFOAM/OpenFOAM-v2606/etc/bashrc"
