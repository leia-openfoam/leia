# D (2026-11-02, the swept-face advection in the preprint's framing; via the
# coordinating session): the translated-sphere ladder of the preprint's
# tab:tpf-sphere (sphereTranslation3D: R 0.15, U = (1 0 0), END_TIME 1 = 3.3
# diameters, the table's quadraticFaces initial state) with the swept-face
# advection (anchored plane by volume, Kromer-Bothe, ccs; sweptFaceCells with
# sweptScaleToPhi, pieces, donorSide, the cap set final, planeSource anchor),
# exact and ring normal, Co 0.1 / 0.2 / 0.5; N = 32, 64 serial
# (sphereTranslation3D_hexSweptLadder) and N = 128 on 64 ranks
# (_hexSweptLadderN128). plicRDF on the same initial state is the table's own
# row (sphereTranslation3D_hex, plicRDF, re-scored with the fixed E_shape on
# 2026-11-02). Fork davof-swept a7e6853. Scored like the table: L1(alphaf),
# L1(n), L1(x) at N = 128 with the least-squares order over 32, 64, 128, and
# the fixed E_shape (with its order).
#
# PRE-REGISTERED (2026-11-02, before the runs):
# T-0 bounded and conservative as R-0 of sphereRotation3D_hexRotFinal, every
#   case; no rank fallback at N = 128.
# T-1 at Co 0.2: L1(x) order >= 1.8 and fixed E_shape order >= 1.7, both rows.
# T-2 at Co 0.2: L1(alphaf) order >= 0.7, both rows.
# T-3 against plicRDF on the same state, N = 128, Co 0.2: the ring row's fixed
#   E_shape and L1(x) at most 1.1 times plicRDF's (2.478e-5, 1.04e-4); the
#   exact row's below plicRDF's.
# T-4 against the preprint's plane-clipped loop on the same state: the swept
#   rows' L1(alphaf) at N = 128 at or below the plane-clipped rows' (ring
#   7.72e-3 / 5.76e-3 / 2.96e-3, exact 3.84e-3 / 3.32e-3 / 3.46e-3 at Co 0.1 /
#   0.2 / 0.5) at every Co.
# Seen before writing this: the preprint's tab:tpf-sphere and its re-scored
# E_shape (2026-11-02), and sphereTranslation3D_hexSwept (the one-donor
# sweptFace flux, exactSphere state, N = 32 / 64). No sweptFaceCells run on
# this case.
#
# MEASURED (2026-11-02; jobs 55869114-15; REPORT-swept "The swept-face
# advection in the preprint's framing: A to D"): T-0 HELD (min >= -1.0e-12,
# excess <= 5.0e-11, mass <= 2.9e-12 %, no rank fallback); T-1 HELD (Co 0.2:
# L1(x) 1.93 / 1.86, E_shape 1.90 / 1.84); T-2 HELD (0.86 / 0.83); T-3 HELD
# (ring E_shape 2.443e-5 = 0.986 and L1(x) 1.024e-4 = 0.987 of plicRDF's);
# T-4 HELD at every Co (Co 0.5: 1.28e-3 / 1.62e-3 against 3.46e-3 / 2.96e-3).
#
#   sbatch --parsable -J leia-davof-sphereTranslation3D_hexSweptLadder --export=ALL,STUDY=davof/sphereTranslation3D_hexSweptLadder run-studies.sbatch
study_name: sphereTranslation3D_hexSweptLadder
studies_dir: studies/davof
case: davof/sphereTranslation3D
mesh: hex
mode: serial
np: 1

solver: advectorVoF
theme:  davof

setfields_app: initDavofFields
setfields_args: ""
post_solve: "python3 {REPO}/workflow/scripts/tpf_advection_metrics.py --case . --out advectorVoF.csv"

# The YAML booleans are QUOTED: they are rendered verbatim into the OpenFOAM
# dictionaries (false, not False).
axes_override:
  N_CELLS: [32, 64]
  TARGET_ADVECTIVE_CO: [0.1, 0.2, 0.5]
  TPF_ROW: [davof-planeSurf-exact, davof-planeSurf-ringArea]
  TPF_VOLUME_RULE: [kromerBothe]
  TPF_ANCHOR_METHOD: [ccs]
  TPF_FLUX_INTEGRATION: [sweptFaceCells]
  TPF_SWEPT_SCALE: ["true"]
  TPF_KB_FAN: ["auto"]
  TPF_AFE_CONSISTENCY: ["false"]
collapse_other_axes: true

solve_mem_mb: 12000
solve_runtime: 600

export_slides: false

env_preamble: "source $HOME/OpenFOAM/OpenFOAM-v2606/etc/bashrc"
