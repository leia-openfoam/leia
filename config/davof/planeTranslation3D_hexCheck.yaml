# The identity check of the second-round speedups on the plane (2026-10-15): the plane gate
# cases of planeTranslation3D_hex at Co 0.2, N = 20 and 40, both arms, four rows, on the fork
# after c1b3995 / 660d741 / bfe0c00 (the face update's default fallback, the wet-face list,
# extendMarkedCells). The gate at round-off is the sharpest check of the face update, and the
# own-normal row's exact amplification history is the sharpest check of bit identity.
#
# PRE-REGISTERED PREDICTION (2026-10-15): every run maximum and end value equals the hex
# study's (davof_advection_planeTranslation3D_hex.csv and its gate table) to all digits.
# FALSIFIED IF any digit differs (then bisect the three commits on the N = 20 normal arm).
#
#     sbatch --parsable -J leia-davof-planeTranslation3D_hexCheck --export=ALL,STUDY=davof/planeTranslation3D_hexCheck run-studies.sbatch
study_name: planeTranslation3D_hexCheck
studies_dir: studies/davof
case: davof/planeTranslation3D
mesh: hex
mode: serial
np: 1

solver: advectorVoF
theme:  davof

setfields_app: initDavofFields
setfields_args: ""
post_solve: "python3 {REPO}/workflow/scripts/tpf_advection_metrics.py --case . --out advectorVoF.csv"

axes_override:
  TPF_ROW: [davof-cellLocal, davof-ringArea, davof-exact, plicRDF]
  TPF_VELOCITY_ARM: [normal, oblique]
  N_CELLS: [20, 40]
  TARGET_ADVECTIVE_CO: [0.2]
  TPF_DAVOF_METHOD: [detrixheAslam]
collapse_other_axes: true

solve_mem_mb: 12000
solve_runtime: 120

export_slides: false

env_preamble: "source $HOME/OpenFOAM/OpenFOAM-v2606/etc/bashrc"
