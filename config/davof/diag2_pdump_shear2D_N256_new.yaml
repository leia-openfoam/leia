# diag2 (2026-11-14; docs/davof/REPORT-swept.md 'Pieces path: aborts and cost'): shear2D N 256 (8 ranks), NEW keys, sweptPieceDump from step 5035, END_TIME 3.03 (step 5042)
# sbatch -J diag2_pdump_shear2D_N256_new --export=ALL,STUDY=davof/diag2_pdump_shear2D_N256_new run-studies.sbatch
study_name: diag2_pdump_shear2D_N256_new
studies_dir: studies/davof
case: davof/isoShear2D
mesh: hex
mode: parallel
np: 8

solver: davofAdvectorFoam
theme:  davof

setfields_app: "initDavofFields && initVortex2D"
setfields_args: ""
post_solve: "python3 {REPO}/workflow/scripts/tpf_advection_metrics.py --case . --out advectorVoF.csv"

axes_override:
  N_CELLS: [256]
  TPF_ROW: [davof-planeSurf-ringArea]
  TARGET_ADVECTIVE_CO: [0.2]
  TPF_REPETITION: [1]
  END_TIME: [3.03]
  TPF_GRAZING_CUT: [openfoam]
  TPF_CCS_END_INTERVAL: [cubic]
  TPF_CCS_TOLERANCE: [relative]
  TPF_POSITIONING_TOL: ["1e-12"]
  TPF_ENRIGHT_SETTING: [recommendedPieceDump5035]
collapse_other_axes: true

solve_mem_mb: 3000
solve_runtime: 29

export_slides: false

env_preamble: "source $HOME/OpenFOAM/OpenFOAM-v2606/etc/bashrc"
