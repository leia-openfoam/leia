# C (2026-11-02): plicRDF + isoAdvector on the rotation of the final ladder,
# N = 128 on 64 ranks. Purpose, read-out and the pre-registered predictions (R-0 .. R-4):
# sphereRotation3D_hexRotFinal.yaml.
#
#   sbatch --parsable -J leia-davof-sphereRotation3D_hexRotRDFN128 --export=ALL,STUDY=davof/sphereRotation3D_hexRotRDFN128 run-studies.sbatch
study_name: sphereRotation3D_hexRotRDFN128
studies_dir: studies/davof
case: davof/sphereRotation3D
mesh: hex
mode: parallel
np: 64

solver: advectorVoF
theme:  davof

setfields_app: initDavofFields
setfields_args: ""
post_solve: "python3 {REPO}/workflow/scripts/tpf_advection_metrics.py --case . --out advectorVoF.csv"

# The YAML booleans are QUOTED: they are rendered verbatim into the OpenFOAM
# dictionaries (false, not False).
axes_override:
  N_CELLS: [128]
  TPF_ROW: [plicRDF]
  TARGET_ADVECTIVE_CO: [0.2]
  TPF_VELOCITY_ARM: [rotation]
  TPF_ALPHA_BC: [fixedValue]
  TPF_DAVOF_METHOD: [exactSphere]
  TPF_AFE_CONSISTENCY: ["false"]
collapse_other_axes: true

solve_mem_mb: 3000
solve_runtime: 240

export_slides: false

env_preamble: "source $HOME/OpenFOAM/OpenFOAM-v2606/etc/bashrc"
