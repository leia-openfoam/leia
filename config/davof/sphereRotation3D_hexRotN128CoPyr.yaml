# Part of the pyramid / Courant tests (2026-11-03). Purpose and predictions:
# planeTranslation3D_hexSweptPyr.yaml.
#
#   sbatch --parsable -J leia-davof-sphereRotation3D_hexRotN128CoPyr --export=ALL,STUDY=davof/sphereRotation3D_hexRotN128CoPyr run-studies.sbatch
study_name: sphereRotation3D_hexRotN128CoPyr
studies_dir: studies/davof
case: davof/sphereRotation3D
mesh: hex
mode: parallel
np: 64

solver: advectorVoF
theme:  davof

setfields_app: initDavofFields
setfields_args: ""
post_solve: "python3 {REPO}/workflow/scripts/tpf_advection_metrics.py --case . --out advectorVoF.csv"

# The YAML booleans are QUOTED: they are rendered verbatim into the OpenFOAM
# dictionaries (false, not False).
axes_override:
  N_CELLS: [128]
  TPF_ROW: [davof-planeSurf-exact, davof-planeSurf-ringArea]
  TARGET_ADVECTIVE_CO: [0.2, 0.5]
  TPF_VELOCITY_ARM: [rotation]
  TPF_ALPHA_BC: [fixedValue]
  TPF_DAVOF_METHOD: [exactSphere]
  TPF_AFE_CONSISTENCY: ["false"]
  TPF_VOLUME_RULE: [kromerBothe]
  TPF_ANCHOR_METHOD: [ccs]
  TPF_FLUX_INTEGRATION: [sweptFaceCells]
  TPF_SWEPT_SCALE: ["true"]
  TPF_SWEPT_FACE_UPDATE: [pieces]
  TPF_SWEPT_COPLANAR: [donorSide]
  TPF_SWEPT_CAP_SET: [final]
  TPF_PLANE_SOURCE: [anchor]
  TPF_KB_FAN: ["auto"]
  TPF_SWEPT_WISP_SURFACE: [matched]
  TPF_SWEPT_WISP_TOL: [0]
  TPF_SWEPT_CONSISTENT: ["true"]
  TPF_SWEPT_WISP_MATCH_TOL: [1e-9]
  TPF_SWEPT_VOLUME_CORRECTION: [pyramid]
collapse_other_axes: true

solve_mem_mb: 3000
solve_runtime: 240

export_slides: false

env_preamble: "source $HOME/OpenFOAM/OpenFOAM-v2606/etc/bashrc"
