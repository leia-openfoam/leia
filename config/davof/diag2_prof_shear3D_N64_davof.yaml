# diag2 (2026-11-14; docs/davof/REPORT-swept.md 'Pieces path: aborts and cost'): shear3D N 64 (8 ranks), pieces + phaseProfile, NEW keys
# sbatch -J diag2_prof_shear3D_N64_davof --export=ALL,STUDY=davof/diag2_prof_shear3D_N64_davof run-studies.sbatch
study_name: diag2_prof_shear3D_N64_davof
studies_dir: studies/davof
case: davof/isoShear3D
mesh: hex
mode: parallel
np: 8

solver: davofAdvectorFoam
theme:  davof

setfields_app: "initDavofFields && initShearFlow3D"
setfields_args: ""
post_solve: "python3 {REPO}/workflow/scripts/tpf_advection_metrics.py --case . --out advectorVoF.csv"

axes_override:
  N_CELLS: [64]
  TPF_ROW: [davof-planeSurf-ringArea]
  TARGET_ADVECTIVE_CO: [0.2]
  TPF_REPETITION: [1]
  TPF_PROFILING: ["true"]
  TPF_GRAZING_CUT: [openfoam]
  TPF_CCS_END_INTERVAL: [cubic]
  TPF_CCS_TOLERANCE: [relative]
  TPF_POSITIONING_TOL: ["1e-12"]
  TPF_ENRIGHT_SETTING: [recommendedProfile]
collapse_other_axes: true

solve_mem_mb: 4000
solve_runtime: 600

export_slides: false

env_preamble: "source $HOME/OpenFOAM/OpenFOAM-v2606/etc/bashrc"
