# The OLD keys (fork, ccsEndInterval none, ccsTolerance absolute 1e-14) on the two pieces cases of
# oblique N 160 that sat at L1(alpha_f) 1.0e-12 .. 1.8e-12 before any CCS change (post hoc revision 1).
# CCS aligned with the published method (Tomislav, 2026-11-14; docs/davof/REPORT-swept.md
# "CCS aligned with the published method"): Gate A-plane. Both rows (onePlane and pieces = the
# recommended setting), OF Co 0.2 / 0.5 / 0.8 / 0.95 / 1 (the normal arm's TARGET_ADVECTIVE_CO =
# OF Co / 1.6124; the oblique arm's = OF Co), N 20 / 40 / 80 / 160, ccsEndInterval cubic, ccsTolerance
# relative 1e-12, grazingCut openfoam.
# sbatch -J ccs-plane-oblique-np1 --export=ALL,STUDY=davof/ccs_oldkeys_oblique_np1 run-studies.sbatch
study_name: ccs_oldkeys_oblique_np1
studies_dir: studies/davof
case: davof/planeTranslation3D
mesh: hex
mode: serial
np: 1
solver: davofAdvectorFoam
theme:  davof
setfields_app: initDavofFields
setfields_args: ""
post_solve: "python3 {REPO}/workflow/scripts/tpf_advection_metrics.py --case . --out advectorVoF.csv"
axes_override:
  TPF_SURF_CELL_TOL: ["1e-8"]
  TPF_RECON_WISP_TOL: ["1e-3"]
  TPF_ENRIGHT_SETTING: [recommended]
  TPF_GRAZING_CUT: [fork]
  TPF_CCS_END_INTERVAL: [none]
  TPF_CCS_TOLERANCE: [absolute]
  TPF_POSITIONING_TOL: ["1e-14"]
  N_CELLS: [160]
  TARGET_ADVECTIVE_CO: [0.95, 1.0]
  TPF_VELOCITY_ARM: [oblique]
  TPF_ROW: [davof-planeSurf-ringArea]
  TPF_VOLUME_RULE: [kromerBothe]
  TPF_ANCHOR_METHOD: [ccs]
  TPF_FLUX_INTEGRATION: [sweptFaceCells]
  TPF_SWEPT_SCALE: ["true"]
  TPF_SWEPT_FACE_UPDATE: [pieces]
  TPF_SWEPT_COPLANAR: [donorSide]
  TPF_SWEPT_CAP_SET: [final]
  TPF_PLANE_SOURCE: [anchor]
  TPF_KB_FAN: ["auto"]
  TPF_SWEPT_AXIS_PLANES: ["true"]
  TPF_SWEPT_TET_CACHE: ["true"]
  TPF_SWEPT_POINT_VELOCITY_LAZY: ["true"]
  TPF_SWEPT_PRE_TEST_COPLANAR_SIDE: ["true"]
  TPF_WRITE_PRECISION: ["17"]
  TPF_RECON_ERROR_EVERY_STEP: ["false"]
  TPF_PROFILING: ["false"]
collapse_other_axes: true
solve_mem_mb: 16000
solve_runtime: 240
export_slides: false
env_preamble: "source $HOME/OpenFOAM/OpenFOAM-v2606/etc/bashrc"
