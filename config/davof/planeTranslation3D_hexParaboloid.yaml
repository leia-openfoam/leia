# The plane test of the volume-anchored ring-tensor surface with its own volume
# flux (variant 3 of 2026-10-23, rows davof-paraboloidRing-*; fork
# isoAdvectionCurved.C, clippingSurface paraboloid, fitDof none, fitAnchor volume): the
# translated plane of cases/davof/planeTranslation3D (the Detrixhe-Aslam state,
# exact for a plane) carried over 0.2 L along its normal and along (1 0 0),
# N = 20 / 40 / 80 / 160, Co 0.2 and 0.5, with the own normal, the ring normal
# and the exact normal framing the surface. On a plane the ring tensor is
# zero to round-off, the volume anchor returns the plane's offset, the prism
# quadrature integrates a half-space exactly, and the pre-image cut is the
# plane's: the gate of the paraboloid path. 3 x 4 x 2 x 2 = 48 serial cases.
#
# PRE-REGISTERED (2026-10-23): P-PP1 every row stays at round-off (run maxima
# of L1(alphaf) and L1(n) below 1e-12) on both arms at every N and Co, the
# exact and the ring normal included, and the own normal as well, because the
# fit reproduces the exact plane fractions so that no sliver mismatch arises;
# the anchor converges in every cell and the surface defect is at round-off. FALSIFIED by any row above 1e-10: on the own-normal
# arm the sliver amplification of the plane loop (which the exact fractions of
# the plane state should not feed), on the others a defect of the fit or the
# flux.
#
# RESULT of the split-rule run (2026-10-24, 44 of 48 cases, kept aside as
# *.splitRule-*): the exact-normal and ring-normal rows at round-off (run
# maxima of L1(alphaf) below 8e-14, of L1(n) below 2e-13) on both arms at
# every N and Co; the own-normal row drifts as in the plane loop (3e-8 at
# N = 20, Co 0.5 on the normal arm, 8.5e-2 with 23 anchor failures at N = 40,
# Co 0.5, 1e-9 at N = 80), so P-PP1 is falsified for the own normal in its
# stated direction: the exact plane fractions do not prevent the sliver
# amplification, because the loop's fractions are the transported ones, not
# the exact ones, from the second step on. Its four unfinished cases were
# own-normal cases at N = 80 and 160 whose wild surfaces made the split
# quadrature cost hours per step.
# VOLUME RULE (2026-10-24): kromerBothe on the final binary (the zero-flux
# convention, the tie-break, the capped fallback); on a plane both rules are
# exact and the Kromer-Bothe rule is 50 times cheaper.
#
#   sbatch --parsable -J leia-davof-planeTranslation3D_hexParaboloid --export=ALL,STUDY=davof/planeTranslation3D_hexParaboloid run-studies.sbatch
study_name: planeTranslation3D_hexParaboloid
studies_dir: studies/davof
case: davof/planeTranslation3D
mesh: hex
mode: serial
np: 1

solver: advectorVoF
theme:  davof

setfields_app: initDavofFields
setfields_args: ""
post_solve: "python3 {REPO}/workflow/scripts/tpf_advection_metrics.py --case . --out advectorVoF.csv"

axes_override:
  N_CELLS: [20, 40, 80, 160]
  TARGET_ADVECTIVE_CO: [0.2, 0.5]
  TPF_ROW: [davof-paraboloidRing-cellLocal, davof-paraboloidRing-ringArea, davof-paraboloidRing-exact]
  TPF_VELOCITY_ARM: [normal, oblique]
  TPF_VOLUME_RULE: [kromerBothe]
collapse_other_axes: true

solve_mem_mb: 12000
solve_runtime: 720

export_slides: false

env_preamble: "source $HOME/OpenFOAM/OpenFOAM-v2606/etc/bashrc"
