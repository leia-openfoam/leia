# DAVOF static recovery on a PLANE, mesh class PERTURBED HEXAHEDRA, on the
# ladder N = 20/40/80/160 of the sphere and ellipsoid tests (2026-10-12).
#
# The exact-solution geometry of cases/davof/planeNormal3D (templated as
# cases/davof/planeNormal3DLadder) on the workflow's `mesh: perturbed`:
# blockMesh, then leiaPerturbMesh with its defaults, every mesh point
# displaced by up to alpha = 0.1 h in each direction with the deterministic
# seed 0 (leiaPerturbMesh.C: `-alpha` default 0.1, `-seed` default 0; the
# ladder is bit-reproducible without a change to the mesh rule). The faces
# WARP, so the scalar face fraction loses the plane (STATUS 10.12) and the fan
# sums of davofState::mTri are the DAVOF normal and position: both
# surface-based states (detrixheAslam, quadraticFaces) must be at round-off
# at every N, with the one-ring curvature (normalsOnly) of the plane at
# round-off too; the geometricVoF cross-check shows its errors. The gate with
# the explicit -expectExact check is cases/davof/planeNormal3D/Allrun_perturbed;
# this ladder is the second block of the three-mesh plane table
# (tables/davof_normal_proposal_planeNormal3D_meshes.tex).
#
# PRE-REGISTERED PREDICTIONS (2026-10-12, before any run):
# P11 (plane, every mesh class): normal, position and curvature at round-off
#   (1e-12) for both states with the fan sums.
# P12 (perturbed 0.1 h and polyhedral): the quadratic-face normal converges at
#   second order with a larger constant than on the hexahedral mesh; the
#   Detrixhe-Aslam normal at first order; the position at second order for
#   both; the one-ring curvature converges (order between 1 and 2) with a
#   smaller constant on polyhedra, where the point-neighbour ring is larger.
# P13: plicRDF stays at order about 1.1 on every mesh class; gradAlpha does
#   not converge; isoAlpha 0.5 to 0.7.
#
#   make studies-one STUDY=davof/planeNormal3D_perturbed PROFILE=profiles/local
#   snakemake --workflow-profile profiles/local --jobs 1 --configfile config/davof/planeNormal3D_perturbed.yaml
# Lichtenberg:
#   sbatch --parsable -J leia-davof-planeNormal3D_perturbed --export=ALL,STUDY=davof/planeNormal3D_perturbed run-studies.sbatch
study_name: planeNormal3D_perturbed
studies_dir: studies/davof
case: davof/planeNormal3DLadder
mesh: perturbed
mode: serial
np: 1

solver: leiaTestDavofNormal
theme:  davof

setfields_args: "-alphaName alpha.water"

axes_override:
  N_CELLS: [20, 40, 80, 160]
  DAVOF_ALPHA_SOURCE: [detrixheAslam, quadraticFaces]
  DAVOF_CURV_MODEL_1: [normalsOnly]
  DAVOF_CURV_MODEL_2: [none]
  DAVOF_CROSS_CHECK: [geometricVoF]
  DAVOF_WISP_TOL: [1e-3]
collapse_other_axes: true

export_slides: false

env_preamble: "source $HOME/OpenFOAM/OpenFOAM-v2606/etc/bashrc"
