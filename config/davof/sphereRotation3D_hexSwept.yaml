# The value test of the semi-Lagrangian swept-face flux (fork branch
# davof-swept, 2026-10-28, fluxIntegration sweptFace): a non-uniform velocity.
# The sphere of cases/davof/sphereRotation3D (R = 0.15 at (0.5 0.5 0.5))
# turns once about the axis parallel to y through (0.75 . 0.5), omega = 2 pi,
# END_TIME 1 (the sphere returns to its start; the velocity from the fork's
# setFlow block, the exact normal and areaFractionError follow the turn by
# omega and axisPoint), with the plane clipping surface (rows
# davof-planeSurf-exact, davof-planeSurf-ringArea), fluxIntegration prism
# (the pre-image is the face translated by the displacement of its centre)
# against sweptFace (the vertices and the centre traced backward by the
# midpoint rule, the swept volume clipped by the donor's plane), N = 32 / 64,
# Co 0.2 at the sphere's far point (REFERENCE_SPEED 2.5; 400 / 800 steps).
# 2 x 2 x 2 = 8 serial cases.
#
# PRE-REGISTERED (2026-10-28, before the run). P-S3: with sweptFace the loop
# is bounded (min(alpha) above -1e-10, max(alpha) below 1 + 1e-10 at every
# step) and conservative (Emass at round-off, below 1e-12), and the
# face-fraction error at the end of the turn, L1(alphaf) against the exact
# state of the sphere back at its start, is below the prism's for the same
# normal and N (the prism's pre-image ignores the turn of the face over the
# step: an error of the order of the angular displacement per step times the
# face size, omega dt h / 2 per face, which the traced vertices remove to
# second order). Stated the other way: the prism's error is first order in
# the rotation per step and the swept-face's is second order, so the gap
# widens with N at fixed Co. FALSIFIED by a sweptFace row above the prism's
# at the end of the turn at either N, by an abort, or by an out-of-donor
# count that grows beyond the lateral faces' share (the one-donor
# assumption: the traced points cross into the lateral neighbours by at most
# Co h sin(theta), the same as under an oblique translation). The intermediate
# Eshape of volumeFractionError is against the initial sphere and is not read;
# the exact-normal row is the control (the normal error is not transported).
#
# MEASURED (2026-10-28, cluster, fork d33eafb; 4 of 8 cases completed, the
# four N = 64 cases aborted; tables davof_advection_sphereRotation3D_hexSwept*):
# P-S3 FALSIFIED in both parts. (1) The end error: at N = 32 the sweptFace
# row ends ABOVE the prism's, L1(alphaf) 2.384e-2 against 2.328e-2 with the
# exact normal (2.4 % higher) and 4.275e-2 against 4.233e-2 with the ring
# normal (1.0 % higher); the per-step relative difference of the two fluxes
# is 1e-3 to 2e-2 from the first step on, without a trend. The traced
# pre-image does not lower the error of this loop: every swept face's
# pre-image leaves the donor cell (out of donor 3240 of 3240 faces in every
# step at N = 32, 12912 of 12912 at N = 64), so the one-donor clipping, which
# both fluxes share, is the binding assumption under rotation, not the shape
# of the pre-image. (2) Boundedness: at N = 64 every case, prism and
# sweptFace, exact and ring normal, aborted on the interface-cell guard (ten
# times the initial count) at steps 565 / 390 (exact, prism / sweptFace) and
# 268 / 270 (ring), with min(alpha) -0.18 to -0.26: the plane-surface loop
# itself (clippingSurface plane, the volume anchor) is not bounded under this
# rotation at N = 64 with either flux. At N = 32 both fluxes stay bounded
# (min alpha -1e-14) but the mass deviation of the solver's sum(alpha V) is
# -2.2e-3 to -3.3e-3 % at the end of the turn for both fluxes (Emass 3e-7 to
# 1.3e-6; the uniform translation gives 1e-13 %): not at round-off, the
# same for prism and sweptFace, cause not investigated. The exact-normal
# row's normal error L1(n) is 3.571e-3 for both fluxes (the normal is not
# transported). Zero sign flips; the closure residual 6e-18 to 3.7e-17.
# Cost: sweptFace 1.12 to 1.24 times the prism's step time at N = 32, 0.93
# at N = 64 (the diverging cases).
#
#   sbatch --parsable -J leia-davof-sphereRotation3D_hexSwept --export=ALL,STUDY=davof/sphereRotation3D_hexSwept run-studies.sbatch
study_name: sphereRotation3D_hexSwept
studies_dir: studies/davof
case: davof/sphereRotation3D
mesh: hex
mode: serial
np: 1

solver: advectorVoF
theme:  davof

setfields_app: initDavofFields
setfields_args: ""
post_solve: "python3 {REPO}/workflow/scripts/tpf_advection_metrics.py --case . --out advectorVoF.csv"

# The YAML booleans are QUOTED: they are rendered verbatim into the OpenFOAM
# dictionaries (false, not False).
axes_override:
  N_CELLS: [32, 64]
  TARGET_ADVECTIVE_CO: [0.2]
  TPF_ROW: [davof-planeSurf-exact, davof-planeSurf-ringArea]
  TPF_VELOCITY_ARM: [rotation]
  TPF_VOLUME_RULE: [kromerBothe]
  TPF_ANCHOR_METHOD: [ccs]
  TPF_FLUX_INTEGRATION: [prism, sweptFace]
  TPF_DAVOF_METHOD: [exactSphere]
  TPF_AFE_CONSISTENCY: ["false"]
  TPF_KB_FAN: ["auto"]
collapse_other_axes: true

solve_mem_mb: 12000
solve_runtime: 1440

export_slides: false

env_preamble: "source $HOME/OpenFOAM/OpenFOAM-v2606/etc/bashrc"
