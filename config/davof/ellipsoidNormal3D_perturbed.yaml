# DAVOF static recovery on the ELLIPSOID, mesh class PERTURBED HEXAHEDRA
# (2026-10-12).
#
# The ellipsoid gate of ellipsoidNormal3D.yaml (half-axes 1.0/0.8/0.6 mm,
# centre the sphere gate's literal, 4 mm box, N = 20/40/80/160) on the
# workflow's `mesh: perturbed`: blockMesh, then leiaPerturbMesh with its
# defaults, every mesh point displaced by up to alpha = 0.1 h in each
# direction with the deterministic seed 0 (leiaPerturbMesh.C: `-alpha` default
# 0.1, `-seed` default 0; the ladder is therefore bit-reproducible without a
# change to the mesh rule). The faces are WARPED, so the fan sums of
# davofState::mTri are the DAVOF normal and position of every state (STATUS
# 10.12). Two states, quadraticFaces (q = 2) and detrixheAslam (q = 1); the two
# curvature models of the hex ladder, normalsOnly (the headline: the ring's
# normals decide the second derivatives) and hermite (the naive fit); the
# geometricVoF cross-check (plicRDF, gradAlpha, isoAlpha) on the identical
# alpha. Norms as in ellipsoidNormal3D.yaml; h = DOMAIN_LENGTH/N in the order
# tables. The mesh class is read from case_params.json ("mesh") by
# make_davof_normal_table.py, which also writes the combined three-mesh table
# tables/davof_normal_proposal_ellipsoidNormal3D_meshes.tex.
#
# PRE-REGISTERED PREDICTIONS (2026-10-12, before any run):
# P11 (plane, every mesh class): normal, position and curvature at round-off
#   (1e-12) for both states with the fan sums.
# P12 (perturbed 0.1 h and polyhedral): the quadratic-face normal converges at
#   second order with a larger constant than on the hexahedral mesh; the
#   Detrixhe-Aslam normal at first order; the position at second order for
#   both; the one-ring curvature converges (order between 1 and 2) with a
#   smaller constant on polyhedra, where the point-neighbour ring is larger.
# P13: plicRDF stays at order about 1.1 on every mesh class; gradAlpha does
#   not converge; isoAlpha 0.5 to 0.7.
#
# Laptop: --jobs 1 (the N = 160 case with the curvature models needs 9 GB).
#   make studies-one STUDY=davof/ellipsoidNormal3D_perturbed PROFILE=profiles/local
#   snakemake --workflow-profile profiles/local --jobs 1 --configfile config/davof/ellipsoidNormal3D_perturbed.yaml
# Lichtenberg:
#   sbatch --parsable -J leia-davof-ellipsoidNormal3D_perturbed --export=ALL,STUDY=davof/ellipsoidNormal3D_perturbed run-studies.sbatch
study_name: ellipsoidNormal3D_perturbed
studies_dir: studies/davof
case: davof/ellipsoidNormal3D
mesh: perturbed
# The N = 160 solve with the curvature model exceeds the 4000 MB Slurm default (OOM-killed 2026-10-12).
solve_mem_mb: 12000
mode: serial
np: 1

solver: leiaTestDavofNormal
theme:  davof

# leiaSetFields initialises psi + alpha.water; the app compares its own
# alpha.davof with that field (MAX_ALPHA_DIFF_DA).
setfields_args: "-alphaName alpha.water"

axes_override:
  N_CELLS: [20, 40, 80, 160]
  DAVOF_ALPHA_SOURCE: [quadraticFaces, detrixheAslam]
  DAVOF_CURV_MODEL_1: [normalsOnly]
  DAVOF_CURV_MODEL_2: [hermite]
  DAVOF_CROSS_CHECK: [geometricVoF]
  DAVOF_WISP_TOL: [1e-3]
collapse_other_axes: true

export_slides: false

env_preamble: "source $HOME/OpenFOAM/OpenFOAM-v2606/etc/bashrc"
