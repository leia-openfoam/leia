# The plane gate with the CCS plane positioning, second build (2026-11-04):
# planeTranslation3D_hexSweptWispM9Ccs with the fork's CCS step proper (the
# cubic through the two CONSECUTIVE iterates, extrapolated; the first build
# took the cubic through the bracket ends only, which the one-sided Newton
# iterates never completed, 3.8 cuts per cell), and the target clamped to
# [0, V] (a round-off wisp of alpha -3e-15 ran to maxIter before). The same
# cases, tokens, gate and predictions P-1, P-2 as planeTranslation3D_hexSweptWispM9Ccs.
#
#   sbatch --parsable -J leia-davof-planeTranslation3D_hexSweptWispM9Ccs2 --export=ALL,LEIA_TPF_DIR=<the v2 clone>,STUDY=davof/planeTranslation3D_hexSweptWispM9Ccs2 run-studies.sbatch
study_name: planeTranslation3D_hexSweptWispM9Ccs2
studies_dir: studies/davof
case: davof/planeTranslation3D
mesh: hex
mode: serial
np: 1

solver: advectorVoF
theme:  davof

setfields_app: initDavofFields
setfields_args: ""
post_solve: "python3 {REPO}/workflow/scripts/tpf_advection_metrics.py --case . --out advectorVoF.csv"

# The YAML booleans are QUOTED: they are rendered verbatim into the OpenFOAM
# dictionaries (false, not False).
axes_override:
  N_CELLS: [20, 40, 80, 160]
  TARGET_ADVECTIVE_CO: [0.2, 0.5, 0.8, 0.95]
  TPF_ROW: [davof-planeSurf-exact, davof-planeSurf-ringArea]
  TPF_VELOCITY_ARM: [normal, oblique]
  TPF_VOLUME_RULE: [kromerBothe]
  TPF_ANCHOR_METHOD: [ccs]
  TPF_FLUX_INTEGRATION: [sweptFaceCells]
  TPF_SWEPT_SCALE: ["true"]
  TPF_SWEPT_WISP_SURFACE: [matched]
  TPF_SWEPT_WISP_TOL: [0]
  TPF_SWEPT_CONSISTENT: ["true"]
  TPF_SWEPT_WISP_MATCH_TOL: [1e-9]
  TPF_POSITIONING: [ccs]
  TPF_POSITIONING_TOL: [1e-14]
collapse_other_axes: true

solve_mem_mb: 16000
solve_runtime: 720

export_slides: false

env_preamble: "source $HOME/OpenFOAM/OpenFOAM-v2606/etc/bashrc"
