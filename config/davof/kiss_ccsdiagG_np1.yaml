# KISS round 3c (extra, a key value only): the same diagnostic with grazingCut openfoam (the cell cut's no-cut threshold ROOTVSMALL instead of the fork's 10*SMALL = 1e-14 m^2 on the cut polygon's area): the normal arm at OF Co 1, N 40/80/160, np1.
# OF Co 1, N 80 / 160, np1, surfCellTol {1e-8, 0} x wispTol {1e-3, 1e-7, 0}; the cells that hit maxIter or got
# no plane, with alpha, |m_c|/V^(2/3), |n|, the exit code. sbatch -J kiss-ccsdiag --export=ALL,STUDY=davof/kiss_ccsdiag_np1 run-studies.sbatch
study_name: kiss_ccsdiagG_np1
studies_dir: studies/davof
case: davof/planeTranslation3D
mesh: hex
mode: serial
np: 1
solver: davofAdvectorFoam
theme:  davof
setfields_app: initDavofFields
setfields_args: ""
post_solve: "python3 {REPO}/workflow/scripts/tpf_advection_metrics.py --case . --out advectorVoF.csv"
axes_override:
  TPF_SURF_CELL_TOL: ["1e-8", "0"]
  TPF_RECON_WISP_TOL: ["1e-3", "1e-7", "1e-9"]
  TPF_ENRIGHT_SETTING: [onePlane]
  TPF_GRAZING_CUT: [openfoam]
  N_CELLS: [40, 80, 160]
  TARGET_ADVECTIVE_CO: [0.6202]
  TPF_VELOCITY_ARM: [normal]
  TPF_ROW: [davof-planeSurf-ringArea]
  TPF_VOLUME_RULE: [kromerBothe]
  TPF_ANCHOR_METHOD: [ccs]
  TPF_FLUX_INTEGRATION: [sweptFaceCells]
  TPF_SWEPT_SCALE: ["true"]
  TPF_SWEPT_FACE_UPDATE: [pieces]
  TPF_SWEPT_COPLANAR: [donorSide]
  TPF_SWEPT_CAP_SET: [final]
  TPF_PLANE_SOURCE: [anchor]
  TPF_KB_FAN: ["auto"]
  TPF_SWEPT_AXIS_PLANES: ["true"]
  TPF_SWEPT_TET_CACHE: ["true"]
  TPF_SWEPT_POINT_VELOCITY_LAZY: ["true"]
  TPF_SWEPT_PRE_TEST_COPLANAR_SIDE: ["true"]
  TPF_WRITE_PRECISION: ["17"]
  TPF_RECON_ERROR_EVERY_STEP: ["false"]
  TPF_PROFILING: ["false"]
collapse_other_axes: true
solve_mem_mb: 16000
solve_runtime: 240
export_slides: false
env_preamble: "source $HOME/OpenFOAM/OpenFOAM-v2606/etc/bashrc"
