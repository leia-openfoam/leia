# The curved flux in parallel (2026-10-24; fork 955362b: the surfaces exchanged
# per processor face, a processor face computed on one side and copied by
# syncProcPatches): the two smokes of the volume rules repeated on four
# processors (scotch decomposition), N = 32, Co 0.2, the exact state, 160
# steps, rows davof-paraboloidRing-exact (variant 3; the splitQuadrature rule
# is its serial reference in sphereTranslation3D_hexRuleKromerBothe case
# 00000) and davof-exactSurface-exact (the control; the exactSphere rule's
# serial reference in sphereTranslation3D_hexRuleExactSphere case 00001),
# both rules on both rows (the exactSphere rule on the paraboloid row and
# the split rule on the exact row are fallbacks or the reference itself,
# kept for the product). 2 x 2 = 4 cases, np 4.
#
# PREDICTIONS (before the run): P-PAR1 the per-step L1(alphaf), the
# interface-cell counts, the minimum of alpha and the mass of every case
# agree with the serial reference to round-off at every step (the processor
# faces take the upwind cell's surface as the internal faces do; the second
# ring across the boundary sees the same face neighbours). FALSIFIED by a
# relative difference above 1e-10 in L1(alphaf) at any step: a defect of
# the exchange or of the computing-side rule. P-PAR2 no fatal error and no
# "skipped" faces beyond the serial count.
#
# RUNS 1 to 5 (2026-10-23/24, split quadrature): every case to the end,
# conservative and bounded; the control at round-off against serial; the
# variant 3 row 1e-4 to 1e-3 of L1(alphaf) apart from the third step on after
# 2.8e-10 at the first, through three exchange defects fixed on the way (a
# zero-flux face computed on both sides, the second ring seeing only the local
# neighbours, the owner convention after decomposition) and one that remains
# with the split quadrature: its value in a prism that contains the silhouette
# depends on the sweep direction (the self-test of 2026-10-24), and the fan of
# a processor face is traversed in reversed order on the non-owner side, so
# the two sides integrate the same prism to values 5e-6 of its volume apart.
# The serial round-off floor of the loop, from two serial runs whose sphere
# centre differs by 1e-13 (hexNoise): 1.3e-10 at step 1, 2e-6 at step 2, then
# 1e-9 to 2e-7. RUN 6: the variant 3 row with the kromerBothe rule, np 4,
# against the serial ladder case (sphereTranslation3D_hexParaboloid 00004, the
# same binary); PREDICTION P-PAR3: agreement within the serial round-off floor
# (below 1e-5 at every step). 1 case.
#
#   sbatch --parsable -J leia-davof-sphereTranslation3D_hexParallel --export=ALL,STUDY=davof/sphereTranslation3D_hexParallel run-studies.sbatch
study_name: sphereTranslation3D_hexParallel
studies_dir: studies/davof
case: davof/sphereTranslation3D
mesh: hex
mode: parallel
np: 4

solver: advectorVoF
theme:  davof

setfields_app: initDavofFields
setfields_args: ""
post_solve: "python3 {REPO}/workflow/scripts/tpf_advection_metrics.py --case . --out advectorVoF.csv"

axes_override:
  N_CELLS: [32]
  TARGET_ADVECTIVE_CO: [0.2]
  TPF_ROW: [davof-paraboloidRing-exact]
  TPF_VOLUME_RULE: [kromerBothe]
  TPF_DAVOF_METHOD: [exactSphere]
  TPF_AFE_CONSISTENCY: ["false"]
collapse_other_axes: true

solve_mem_mb: 4000
solve_runtime: 360

export_slides: false

env_preamble: "source $HOME/OpenFOAM/OpenFOAM-v2606/etc/bashrc"
