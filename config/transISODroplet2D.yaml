# Translating droplet with the iso-value-agnostic geometric surface-tension model
# (isoCurvature; interface = alpha.water iso 0.5). Companion to oscISODroplet2D on
# the inflow/outflow channel (U0=0.05 m/s). Fixed per-resolution capillary dt;
# quad reconstruction; curvatureExtension fvm.
#
#   snakemake --workflow-profile profiles/local --configfile config/transISODroplet2D.yaml
study_name: transISODroplet2D
case: transISODroplet2D
mesh: hex
mode: serial
np: 1

solver: leiaSemiLagrangianLevelSetTwoPhaseFoam
theme:  semi-lagrangian-level-set

setfields_args: "-alphaName alpha.water"

axes_override:
  N_CELLS: [32, 64, 128]
  SL_RECONSTRUCTION: [uncachedQuadraticWeightedLeastSquares]

export_slides: false

env_preamble: "source $HOME/OpenFOAM/OpenFOAM-v2512/etc/bashrc"
