# Translating droplet with the CONSERVATIVE INTEGRAL surface-tension model
# (integralSurfaceTension). Companion to oscISTDroplet2D. Same inflow/outflow
# channel (U0=0.05 m/s) as translatingDroplet2D but with the balanced-force CST
# curvature in place of divGradPsiSnGradAlpha. Reconstruction fixed to
# uncachedQuadratic; fixed per-resolution capillary time step.
#
#   snakemake --workflow-profile profiles/local --configfile config/transISTDroplet2D.yaml
study_name: transISTDroplet2D
case: transISTDroplet2D
mesh: hex
mode: serial
np: 1

solver: leiaSemiLagrangianLevelSetTwoPhaseFoam
theme:  semi-lagrangian-level-set

setfields_args: "-alphaName alpha.water"

axes_override:
  N_CELLS: [32, 64, 128]
  SL_RECONSTRUCTION: [uncachedQuadraticWeightedLeastSquares]
  VELOCITY_EXTENSION: [steadyUpwind]
  TRAJECTORY_VELOCITY: [input]
  MASS_FLUX: [rhoLENT]
  MASS_FLUX_FACE_INTERPOLATION: [central]

export_slides: false

env_preamble: "source $HOME/OpenFOAM/OpenFOAM-v2512/etc/bashrc"
