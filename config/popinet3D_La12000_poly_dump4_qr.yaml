# HYPOTHESIS TEST (2026-09-05): the reconstruction warns of near-degenerate stencils on
# cfMesh's near-wall polyhedra and the worst corrupted cells sit 0.01-0.03 from the side
# walls; the normal-equations quadratic fit can return huge coefficients on such stencils
# while passing the rank check. Same case, SL_FIT householderQR (the warning's own
# suggestion). PASS = phase volume constant to 1e-7 over the four steps and Courant ~0.1;
# a blow-up as before exonerates the fit's conditioning.
study_name: popinet3D_La12000_poly_dump4_qr
case: popinetTranslating3D
mesh: poly
mode: parallel
np: 4
solver: leiaSemiLagrangianLevelSetTwoPhaseFoam
theme:  method-comparison
setfields_args: "-alphaName alpha.water"
axes_override:
  SL_FIT: [householderQR]
  N_CELLS: [64]
  MAX_CELL_SIZE: [0.019685]
  END_TIME: [0.001024]
  WRITE_INTERVAL: [0.000255996]
  POPINET_NX: [128]
  POPINET_XLEN: [2]
  DOMAIN_LENGTH: [1]
  CAPILLARY_REF_LENGTH: [1]
  CAPILLARY_DT_COEFF: [0.13107]
  DROPLET_RADIUS: [0.2]
  DROPLET_OFFSET_X: [0]
  TRANSLATION_SPEED: [1]
  SIGMA: [1]
  POPINET_RHO: [1]
  POPINET_NU: [5.773502692e-03]
  SURFACE_FILE: [box2x1x1.stl]
  MOMENTUM_DIV_SCHEME: ["upwind"]
  MASS_FLUX: ["rhoLENT"]
  MASS_FLUX_BOUND_RHO: ["true"]
  VOLUME_CORRECTION: ["noVolumeCorrection"]
  MOMENTUM_DDT_SCHEME: ["backward"]
  RHO_DDT_SCHEME: ["backward"]
  CURVATURE_EXTENSION: ["none"]
  SURFACE_TENSION_FORCE: ["reconstructedCurvature"]
  FACE_CURVATURE_SOURCE: [model]
  PSI_FILTER: [none]
  PHASE_INDICATOR: [detrixheAslam]
  SL_TRACE_VELOCITY: ["projectedFlux"]
  SL_RECONSTRUCTION: [uncachedQuadraticWeightedLeastSquares]
  SL_FOOT_INTEGRATOR: ["taylor"]
collapse_other_axes: true
export_slides: false
mpi_launcher: "mpirun -np {np}"
env_preamble: "source $HOME/OpenFOAM/OpenFOAM-v2512/etc/bashrc; [ -f $HOME/.leia_env ] && . $HOME/.leia_env || true"
