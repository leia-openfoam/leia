# 4-RANK SMOKE (P1) of the polyRefined mesh: the production solver on the graded cfMesh
# mesh (150 362 cells, hanging-node-free but graded polyhedra) for 458 steps to t = 0.003 on
# FOUR ranks, before the full study goes to the cluster. PASS = COMPLETED per
# foam_log_state.sh with 458 steps and a metrics CSV whose L1/L2 parasitic velocity is of
# the order of the uniform twin's at the same time (7e-6 / 3e-5 m/s at t = 0.003).
# POLYHEDRAL STATIC REFINEMENT -- twin of config/polyDroplet3D_r13p8.yaml (uniform pMesh,
# maxCellSize 1.0e-4, 572k cells, MEASURED R/h = 13.84, N_CELLS 84).
#
# Driver workflow/scripts/leiaRefinePolyMesh.py: pMesh at MAX_CELL_SIZE 2.0e-4 (pass 0),
# then REFINE_LEVELS = 1 pass of [0/ := 0.org; leiaSetFields; psi = 0 iso-surface as
# STL; pMesh with surfaceMeshRefinement { additionalRefinementLevels 1;
# refinementThickness 6 x 1.0e-4 }], then leiaSetFields on the final mesh. cfMesh has no
# in-place refiner, so the criterion is geometric and the mesh is regenerated. MEASURED on
# the R/h = 10 smoke mesh (2026-09-04): a cellSize request of half the base produced cells
# TWO octree levels finer (2.98e-5 for 7.5e-5 asked, 6x the cells), hence the integer
# level; and cfMesh grades beyond the thickness (11.8 complete fine layers for 6 asked,
# 1.78x the coarse cell count at one level).
#
# N_CELLS PIN (P0, MEASURED 2026-09-04). The driver built the mesh: 88 929 -> 150 362 cells
# (3.8x fewer than the twin's 572 039), interface cells at 7.937e-5 m, 5.9 complete fine
# layers at the worst point, and printed N_CELLS_suggested 76. The SAME tool on the uniform
# twin gives its interface cells at 7.937005e-5 -- IDENTICAL to seven digits (same octree
# level, same root cube). The twin's N_CELLS 84 came from h_eff = (V/N)^(1/3) = 7.228e-5,
# an average pulled down by cfMesh's boundary refinement (cells of HALF the size in the
# outer 36-72 fine cells: the polyhedral 'uniform' rungs carry a half-size boundary layer),
# so at the INTERFACE the twin is R/h = 12.6, not 13.84, and its dt is 10 % conservative.
# For a like-for-like P2 (equal dt, equal 3813 steps) this arm runs at the twin's N_CELLS 84
# and declares the 10 % conservative pin deviation with REFINE_ALLOW_PIN_MISMATCH -- the
# band check still reports it (refinedBand.csv: pinRelError 0.10, N_CELLS_suggested 76).
# P1 = the 4-rank smoke (config/polyDroplet3Drefined_r13p8_smoke4.yaml); P2 = the G3
# equivalence tolerances against polyDroplet3D_r13p8 at matched N_CELLS, t and step count.
study_name: polyDroplet3Drefined_r13p8_smoke4
case: stationaryDroplet3D
mesh: polyRefined
mode: parallel
np: 4
solver: leiaSemiLagrangianLevelSetTwoPhaseFoam
theme:  semi-lagrangian-level-set
setfields_args: "-alphaName alpha.water"
axes_override:
  DOMAIN_LENGTH: [0.006]
  MAX_CELL_SIZE: [2.0e-4]
  REFINE_LEVELS: [1]
  REFINE_BAND_CELLS: [6]
  N_CELLS: [84]
  REFINE_ALLOW_PIN_MISMATCH: ["true"]
  END_TIME: [0.003]
  WRITE_INTERVAL: [0.003]
  SURFACE_TENSION_FORCE: [reconstructedCurvature]
  CURVATURE_EXTENSION: [cellCentreInverse]
  FACE_CURVATURE_SOURCE: [model]
  PSI_FILTER: [none]
  VOLUME_CORRECTION: [noVolumeCorrection]
  MOMENTUM_DDT_SCHEME: [backward]
  RHO_DDT_SCHEME: [backward]
  MOMENTUM_DIV_SCHEME: [upwind]
  MASS_FLUX: [rhoLENT]
  MASS_FLUX_BOUND_RHO: ["true"]
  PHASE_INDICATOR: [detrixheAslam]
  SL_TRACE_VELOCITY: [projectedFlux]
  SL_RECONSTRUCTION: [uncachedQuadraticWeightedLeastSquares]
  SL_FOOT_INTEGRATOR: [taylor]
collapse_other_axes: true
export_slides: false
mpi_launcher: "mpirun -np {np}"
env_preamble: "source $HOME/OpenFOAM/OpenFOAM-v2512/etc/bashrc; [ -f $HOME/.leia_env ] && . $HOME/.leia_env || true"
