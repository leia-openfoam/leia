# ============================================================================
# RE-RUN of ONE case of the gate ghostCellRefinedBox3D.yaml: N = 256, ghost cells (2026-11-13)
#
# WHY. In the gate run of 2026-11-13 the solver of this case was killed for lack of memory in
# the first step (SLURM job 56265553, OUT_OF_MEMORY, 4.9 GB per rank against the 4 GB of the
# profile; mesh of 10.2e6 cells on 8 ranks). That is a launch failure, not a result. The
# original scheme needs 2.7 GB per rank on the same mesh.
#
# This file changes ONLY the memory per rank (solve_mem_mb). The case, the mesh recipe and
# every token are those of ghostCellRefinedBox3D.yaml, and the pre-registered read-out is the
# one in that header (G1, G2, FALSIFIED IF, the note on the fourth rung). No new criterion.
# ============================================================================
study_name: ghostCellRefinedBoxN256Ghost3D
case: 3Dtranslation
mesh: hexRefined
mode: parallel
np: 8
solver: leiaSemiLagrangeLevelSetFoam
theme: semi-lagrangian-level-set
solve_runtime: 7200
# 4.9 GB per rank at start-up on the 10.2e6-cell mesh (MEASURED, job 56265553).
solve_mem_mb: 12000
# cases/3Dtranslation names its volume fraction `alpha`, not `alpha.water`. The refinement
# driver derives the field name from THIS string (leia_refine.alpha_name_from), and its
# fallback is alpha.water, so band_check looks for a field that does not exist unless the
# name is stated here.
setfields_args: "-alphaName alpha"
axes_override:
  # The domain is [0,2] x [0,1] x [0,1]; the sphere starts at (0.5 0.5 0.5) with radius 0.15
  # and travels to x = 1.5 at U = 1, T = 1. The box spans x in [0.8, 1.2] and the full cross
  # section, so the sphere meets a coarse -> fine transition at x = 0.8 and a fine -> coarse
  # one at x = 1.2, and starts and ends well clear of both.
  REFINE_SOURCE: ["box"]
  REFINE_LEVELS: ['1']
  REFINE_BOX_MIN: ["(0.8 -0.1 -0.1)"]
  REFINE_BOX_MAX: ["(1.2 1.1 1.1)"]
  N_CELLS: ['256']
  CFL: ['0.5']
  END_TIME: ['1.0']
  OSCILLATION: ['off']
  END_REFERENCE: ['translate']
  ADVECTION: [semiLagrangian]
  PHASE_INDICATOR: [detrixheAslam]
  PROFILE: [signedDistance]
  # The one variable: the reconstruction. Everything else is the production transport.
  SL_SCHEME: [pointValue]
  SL_RECONSTRUCTION: [ghostCellQuadraticWeightedLeastSquares]
  SL_VALUE_BOUND: ["none"]
  SL_LIMITER: ["none"]
  SL_FOOT_INTEGRATOR: ["taylor"]
  SL_STENCIL: ["point"]
  SL_CLIP: ["false"]
  SL_TRACE_VELOCITY: [projectedFlux]
  SL_SOURCE: [none]
  FLUX_PROJECTION: ["none"]
  SDPLS_SOURCE: [noSource]
  SOURCE_SCHEME: [explicit]
collapse_other_axes: true
export_slides: false
