# ============================================================================
# GATE: does an error appear when the interface crosses a 2:1 refinement transition? (2026-10-13)
#
# WHY. The author's question of 2026-10-13: can the semi-Lagrangian level set run on locally
# adaptive HEXAHEDRAL meshes that admit a polyhedral cell here and there, without that cell
# destroying the solution? The transition cells of a refined hex mesh ARE polyhedra, so the
# question is already answerable with the mesh workflow/scripts/leiaRefineHexMesh.py builds.
#
# A sphere is translated at U = (1 0 0) through a FIXED box of static refinement, so it
# crosses two 2:1 transitions, coarse -> fine -> coarse. The interface-tracking refinement
# sources (`interface`, `ball`) cannot produce that: they follow the interface, so it never
# crosses anything. `REFINE_SOURCE box` is added for this gate.
#
# THE PRIOR IS SHARPER THAN IT LOOKS, and it is why the gate is worth running.
# METHOD.md 8.1 records Lambda_max 1.0265 and 1.0222 AT 2:1 REFINEMENT TRANSITIONS, against
# 1.0527 on plain blockMesh hex -- the transition cells have a LOWER amplification bound than
# uniform hexahedra. And docs/analysis-amplification-sl/ms.tex derives rho = 1 exactly for the
# uniform interior operator at every Courant number, locating the measured growth at the
# boundary instead. So the fit is NOT expected to be the problem at a transition.
#
# PRE-REGISTERED READ-OUT (2026-10-13, before the run):
#   R1 (the fit is not the mechanism): no error concentration appears at either transition.
#      The refined run tracks the uniform-FINE control to within the mesh-noise floor, and
#      the largest psi error in the band sits where it sits on the uniform meshes -- at the
#      interface, not at the refinement boundary.
#   R2 (something else is the mechanism): the error concentrates in the transition band. Then
#      the FLUX RECONSTRUCTION is the first suspect, not the fit: the transition cells are
#      polyhedra, fvc::reconstruct is biased on a cell with one large face against four small
#      ones, and because |grad psi| = 1 a departure-point error of delta becomes a level-set
#      error of delta with no attenuation. The discriminator is then FLUX_PROJECTION helmholtz
#      against none on the SAME mesh, and max|div(phi)| of the prescribed flux, which the
#      kinematic solvers print at start (STATUS 11.25).
#   FALSIFIED IF the refined arm diverges or loses the phase where both uniform controls
#      complete. That would make locally adaptive hex unusable for this method as it stands,
#      which is the answer the author asked for either way.
#
# CONTROLS, in the same matrix, because a refined arm alone measures nothing:
#   - uniform COARSE at the base resolution (what the mesh is away from the box)
#   - uniform FINE at the refined resolution (what the mesh is inside the box)
#   Both at the same time-step law, so the comparison is not a dt sweep in disguise.
#
# THREE RESOLUTIONS, per the rule "Touch advection, run a mesh convergence study -- before
# stating anything": N_CELLS 32/64/128 with REFINE_LEVELS 1, i.e. base 16/32/64.
#
# METRICS, reported together and never alone (step 6 of the research loop): the shape and
# volume error against the EXACT translated sphere (END_REFERENCE translate writes
# psiEnd/alphaEnd), the band gradient error, E_BOUND_ALPHA, and WHERE the largest psi error
# sits relative to the refinement boundary. No L_inf in any verdict.
#
# RUN IT. The coarsest rung is the mandatory 4-rank laptop gate; the ladder goes to
# Lichtenberg with every job id in .my_jobs.
#   make studies-one-file CFG=config/gates/refinedBoxTranslation3D.yaml
# ============================================================================
study_name: refinedBoxTranslation3D
case: 3Dtranslation
mesh: hexRefined
mode: parallel
np: 8
solver: leiaSemiLagrangeLevelSetFoam
theme: semi-lagrangian-level-set
solve_runtime: 7200
# cases/3Dtranslation names its volume fraction `alpha`, not `alpha.water`. The refinement
# driver derives the field name from THIS string (leia_refine.alpha_name_from), and its
# fallback is alpha.water, so band_check looks for a field that does not exist unless the
# name is stated here.
setfields_args: "-alphaName alpha"
axes_override:
  # The domain is [0,2] x [0,1] x [0,1]; the sphere starts at (0.5 0.5 0.5) with radius 0.15
  # and travels to x = 1.5 at U = 1, T = 1. The box spans x in [0.8, 1.2] and the full cross
  # section, so the sphere meets a coarse -> fine transition at x = 0.8 and a fine -> coarse
  # one at x = 1.2, and starts and ends well clear of both.
  REFINE_SOURCE: ["box"]
  REFINE_LEVELS: ['1']
  REFINE_BOX_MIN: ["(0.8 -0.1 -0.1)"]
  REFINE_BOX_MAX: ["(1.2 1.1 1.1)"]
  N_CELLS: ['32', '64', '128']
  CFL: ['0.5']
  END_TIME: ['1.0']
  OSCILLATION: ['off']
  END_REFERENCE: ['translate']
  ADVECTION: [semiLagrangian]
  PHASE_INDICATOR: [detrixheAslam]
  PROFILE: [signedDistance]
  # Production transport, unchanged: the author asked to keep the stencil we have and see
  # first results, so no reconstruction or stencil axis is swept here.
  SL_SCHEME: [pointValue]
  SL_RECONSTRUCTION: [uncachedQuadraticWeightedLeastSquares]
  SL_VALUE_BOUND: ["none"]
  SL_LIMITER: ["none"]
  SL_FOOT_INTEGRATOR: ["taylor"]
  SL_STENCIL: ["point"]
  SL_CLIP: ["false"]
  SL_TRACE_VELOCITY: [projectedFlux]
  SL_SOURCE: [none]
  FLUX_PROJECTION: ["none"]
  SDPLS_SOURCE: [noSource]
  SOURCE_SCHEME: [explicit]
collapse_other_axes: true
export_slides: false
