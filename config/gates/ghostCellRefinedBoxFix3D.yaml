# ============================================================================
# GATE RE-RUN after the fix of the decomposition dependence of the ghost-cell class
# (branch fix/ghost-decomposition, 2026-11-17).
#
# The ghost arm of config/gates/ghostCellRefinedBox3D.yaml, all four rungs, np 8, with the
# memory of config/gates/ghostCellRefinedBoxN256Ghost3D.yaml (solve_mem_mb 12000). Case, mesh
# recipe, time step law and horizon are those of the gate. The original class and the
# uniform control are not run again: the fix changes only the file of the ghost class, and
# their tables are docs/semi-lagrangian-level-set/sl-level-set-article/data/tables/
# ghostCellRefined{Box3D,BoxUniform3D}_errors.csv.
#
# What changed in the scheme: (1) a ghost position is used only if a coarser stencil cell
# contains it, so no ghost datum lies outside the domain (73122 -> 72200 at N = 64);
# (2) a physical patch face of another rank is a boundary-face datum (parallel runs only).
# The gate results of STATUS 11.35 ran on 8 ranks with defect (2) and are superseded by
# this study.
#
# PRE-REGISTERED READ-OUT (2026-11-17, before the run). The criteria are those of the gate.
#   G2 PASSES if every rung completes, the L1 shape error and the relative volume error at
#      T = 1 are at most 2 times those of the uniform N/2 control at every rung, and the
#      shape order fitted over the four rungs is at least 1.5.
#   FALSIFIED if a rung diverges, or a criterion of G2 fails.
#   PREDICTION: the sphere stays 0.35 from the boundary patches, so the L1 shape error
#      changes by less than 1 % against STATUS 11.35 at every rung (5.695e-3, 2.287e-3,
#      3.488e-4, 1.122e-4). A larger change does not fail the gate; it is reported.
#   RESULT 2026-11-17 (driver job 56530725, STATUS 11.38): every rung completed. L1 shape
#   error 5.692e-3, 2.287e-3, 3.488e-4, 1.122e-4; ratio to the uniform N/2 control 0.89,
#   0.83, 0.61, 0.82. Relative volume error 1.349e-1, 3.213e-2, 4.529e-3, 7.370e-4; ratio
#   0.60, 0.92, 1.27, 0.91. Fitted shape order 1.97. G2 PASSES. The PREDICTION holds: the
#   shape error changes by 0.05 % at N = 32 and by less than 0.01 % at the other rungs.
# ============================================================================
study_name: ghostCellRefinedBoxFix3D
case: 3Dtranslation
mesh: hexRefined
mode: parallel
np: 8
solver: leiaSemiLagrangeLevelSetFoam
theme: semi-lagrangian-level-set
solve_runtime: 7200
# 4.9 GB per rank at start-up on the 10.2e6-cell mesh (MEASURED, job 56265553).
solve_mem_mb: 12000
# cases/3Dtranslation names its volume fraction `alpha`, not `alpha.water`. The refinement
# driver derives the field name from THIS string (leia_refine.alpha_name_from), and its
# fallback is alpha.water, so band_check looks for a field that does not exist unless the
# name is stated here.
setfields_args: "-alphaName alpha"
axes_override:
  # The domain is [0,2] x [0,1] x [0,1]; the sphere starts at (0.5 0.5 0.5) with radius 0.15
  # and travels to x = 1.5 at U = 1, T = 1. The box spans x in [0.8, 1.2] and the full cross
  # section, so the sphere meets a coarse -> fine transition at x = 0.8 and a fine -> coarse
  # one at x = 1.2, and starts and ends well clear of both.
  REFINE_SOURCE: ["box"]
  REFINE_LEVELS: ['1']
  REFINE_BOX_MIN: ["(0.8 -0.1 -0.1)"]
  REFINE_BOX_MAX: ["(1.2 1.1 1.1)"]
  N_CELLS: ['32', '64', '128', '256']
  CFL: ['0.5']
  END_TIME: ['1.0']
  OSCILLATION: ['off']
  END_REFERENCE: ['translate']
  ADVECTION: [semiLagrangian]
  PHASE_INDICATOR: [detrixheAslam]
  PROFILE: [signedDistance]
  # The one variable: the reconstruction. Everything else is the production transport.
  SL_SCHEME: [pointValue]
  SL_RECONSTRUCTION: [ghostCellQuadraticWeightedLeastSquares]
  SL_VALUE_BOUND: ["none"]
  SL_LIMITER: ["none"]
  SL_FOOT_INTEGRATOR: ["taylor"]
  SL_STENCIL: ["point"]
  SL_CLIP: ["false"]
  SL_TRACE_VELOCITY: [projectedFlux]
  SL_SOURCE: [none]
  FLUX_PROJECTION: ["none"]
  SDPLS_SOURCE: [noSource]
  SOURCE_SCHEME: [explicit]
collapse_other_axes: true
export_slides: false
