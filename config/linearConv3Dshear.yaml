# quadraticTaylor (quadratic Taylor + clip) 3D shear convergence, CFL 0.5 -- the LINEAR
# semi-Lagrangian line, run as an INDEPENDENT METHOD next to the quadratic line.
# Same ladder as config/uncachedConv3Dshear.yaml (N=128 = 4.2M cells; the linear
# fit is memory-light -- no cached per-cell pseudo-inverse -- so the hex ceiling
# is set by the fields, not the reconstruction).
# Results agglomerate into docs/linear-semi-lagrangian-level-set/ (theme key).
#
#   snakemake --workflow-profile profiles/local --configfile config/linearConv3Dshear.yaml --resources tasks=12
study_name: linearConv3Dshear
case: 3Dshear
mesh: hex
mode: parallel
np: 8

solver: leiaSemiLagrangeLevelSetFoam
theme: linear-semi-lagrangian-level-set

axes_override:
  END_TIME: [3.0]
  N_CELLS:  [32, 50, 80, 128]           # cbrt(4) ladder, cells x4/level
  CFL:      [0.1, 0.2, 0.4, 0.8]        # CFL sweep (clip removes the shear-hex fine-mesh limit)
  SL_RECONSTRUCTION: [quadraticTaylor]
  # clipToStencilBounds: the fix for the shear-hex steepening runaway (forbids
  # the LSQ value overshoot). Hex ran clip=false before -> destabilized at N=128.
  SL_CLIP: ["true"]   # quoted so it renders lowercase (OpenFOAM Switch)
  PHASE_INDICATOR: [detrixheAslam]
  DIV: [linear]
collapse_other_axes: true

export_slides: true   # publication study: auto-refresh theme figures + deck on completion

mpi_launcher: "mpirun -np {np}"
env_preamble: "source $HOME/OpenFOAM/OpenFOAM-v2512/etc/bashrc"
