# Convergence study: classical reversed single (shear) vortex, BULK test.
# >>> FAST DEFAULT suite (N <= 128, 6 models, 72 cases): ~5 minutes measured
# >>> on a 24-thread laptop (2026-07-07). <<<
#
# The 2Dvortex case advects a circle (R=0.15, centred at (0.5,0.75)) in the unit
# box with the reversing single-vortex field (shear2D, oscillation on); run to
# the period T (tau defaults to endTime) so the interface returns to its initial
# shape. Sweep T, mesh spacing h, and the interface-normal velocity-extension
# model so the results section shows a separate convergence diagram per model.
#
#   snakemake --workflow-profile profiles/local --configfile config/bulkVortex.yaml
#
# Cost scales 8x per resolution level in 2D (4x cells x 2x CFL time steps), so
# the N=256 level lives in a SEPARATE opt-in config -- bulkVortexHighRes.yaml
# (~1 h; wall time floored by the single T=8/N=256 case, ~12k time steps).
# This fast suite keeps its figures in the study dir (export_slides: false);
# the reveal deck is regenerated only by the deliberate high-res run.
#
# Post-processing writes studies/<study>/<study>_errors.csv with columns
# velocityExtension, T, h (=1/N_CELLS), gradientError (L2 of ||grad psi|-1|),
# shapeError (E_GEOM_ALPHA), volumeError (E_VOL_ALPHA_REL) and one convergence
# triptych per velocity-extension model.

study_name: bulkVortexConvergence
case: 2Dvortex
mesh: hex
mode: parallel      # each leiaLevelSetFoam runs on np cores (scotch decomposition)
np: 4               # prescribed cores per simulation

axes_override:
  END_TIME: [0.5, 2, 4, 8]                              # T = period = end time
  N_CELLS:  [32, 64, 128]                               # fast default; 256 -> bulkVortexHighRes.yaml
  VELOCITY_EXTENSION: [none, anisotropicDiffusion, pseudoTime,
                       steadyUpwind, closestPoint, meshWave]
  PHASE_INDICATOR: [detrixheAslam]                      # fixed: analytic 2D-robust indicator
collapse_other_axes: true                               # everything else -> first value

export_slides: false  # smoke/regression tool: never clobber the deck's high-res figures

mpi_launcher: "mpirun -np {np}"
env_preamble: "source $HOME/OpenFOAM/OpenFOAM-v2512/etc/bashrc"
