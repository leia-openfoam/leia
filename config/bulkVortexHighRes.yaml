# Convergence study: classical reversed single (shear) vortex, BULK test.
# >>> HIGH-RESOLUTION opt-in suite (adds N=256): ~30 min measured on a
# >>> 24-thread laptop (2026-07-06). Run deliberately, not as the daily smoke
# >>> test. <<<
#
# Same sweep as bulkVortex.yaml plus one resolution level. Cost scales 8x per
# level in 2D (4x cells x 2x CFL time steps); the wall-time floor is the single
# heaviest case (T=8, N=256: ~12k time steps) -- no scheduler can shrink it
# below that. For more levels use profiles/slurm on a cluster.
#
#   snakemake --workflow-profile profiles/local --configfile config/bulkVortexHighRes.yaml
#
# This is the run that regenerates the reveal deck (export_slides: true): the
# per-model convergence triptychs, the alpha / |grad psi|-1 field atlas (rows =
# 4 resolutions) and the standalone doc/slides/index.html are rebuilt by its
# report step. Results land in studies/bulkVortexHighRes (its own study dir --
# never mix grids of different axes in one study dir: the case indices of the
# cartesian product would remap and stale cases would be silently reused).

study_name: bulkVortexHighRes
case: 2Dvortex
mesh: hex
mode: parallel      # each leiaLevelSetFoam runs on np cores (scotch decomposition)
np: 4               # prescribed cores per simulation

axes_override:
  END_TIME: [0.5, 2, 4, 8]                              # T = period = end time
  N_CELLS:  [32, 64, 128, 256]                          # + the deep-convergence level
  VELOCITY_EXTENSION: [none, anisotropicDiffusion, pseudoTime]
  PHASE_INDICATOR: [detrixheAslam]                      # fixed: analytic 2D-robust indicator
collapse_other_axes: true                               # everything else -> first value

export_slides: true   # the deliberate deck-regeneration run

mpi_launcher: "mpirun -np {np}"
env_preamble: "source $HOME/OpenFOAM/OpenFOAM-v2506/etc/bashrc"
