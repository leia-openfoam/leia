# POLYHEDRAL 3D STATIONARY DROPLET -- resolution rung R/h = 18.91  (MEASURED), ~1.46M cells
#
# WHY THIS SUPERSEDES polyDroplet3Dr10p0/12p7/15p8. Those labels describe a mesh that
# cfMesh does not produce. Their 166777-cell mesh came from GMSH (log.gmshToFoam), while
# the workflow's "mesh: poly" route runs pMesh, and the two give completely different
# meshes for the same token. Measured here by meshing the actual case at five sizes and
# reading checkMesh:
#
#     maxCellSize     cells      h_eff = (V/N)^(1/3)    R/h     h_eff/maxCellSize
#       3.0e-4       31,479          1.900e-4           5.26         0.633
#       2.0e-4       88,929          1.344e-4           7.44         0.672
#       1.5e-4      190,243          1.043e-4           9.59         0.695
#       1.0e-4      572,039          7.228e-5          13.84         0.723
#       7.0e-5    1,460,011          5.289e-5          18.91         0.756
#
# So maxCellSize IS monotone but cells come out 0.63-0.76 times it -- it is an upper bound
# and cfMesh refines below it near the boundary. Resolution must therefore be quoted from
# the BUILT mesh, never from the token. On that basis the old "r10p0" rung was really
# R/h = 9.17, BELOW this repository's own R/h >= 10 floor, so its results were never
# admissible. Every rung here is measured and above the floor.
#
# The mesh is uniform in the sense that matters: a single maxCellSize, no boundary layers,
# no local or object refinement in meshDict, and non-orthogonality max ~61.5 essentially
# independent of resolution (61.7 / 61.2 / 61.9 / 61.8 / 61.5 across the five sizes), so
# mesh quality is not confounded with h.
#
# VISCOSITY MODEL: the default alg_lin, selected by the 36-arm hex ladder on the
# translating droplet (config/mufGrid2D_*) as the only one of six with a positive
# convergence order in all three metrics at both viscosity jumps. The method banner now
# prints "viscosity face model" so every log records which of the six actually ran.
#
# N_CELLS is the dt handle, not a mesh handle: the capillary law is
# dt = CAPILLARY_DT_COEFF/nRef^1.5 with nRef = CAPILLARY_REF_LENGTH*N_CELLS/DOMAIN_LENGTH,
# so N_CELLS is set to DOMAIN_LENGTH/h_eff from the MEASURED h_eff, rounded UP so the step
# is conservative rather than optimistic.
#
# PRE-REGISTERED. The stationary droplet has an exact solution: u = 0 with the Young-Laplace
# jump. On hex the currents decay to a settled floor; the historical polyhedral record is
# that all rungs blew up within ~20 steps, but that was the gmsh mesh, the old divDevRhoReff
# assembly and a pre-alg_lin face viscosity. A 4-rank smoke test on the current code
# (config/polySmoke3D) completed 75 steps without blow-up, so the question is now open
# rather than settled. Read L2 and L1 of |u| (never L_inf), the Laplace pressure jump, the
# phase-volume error and the shape error, and whether they converge under refinement.
# INTERFACE RESOLUTION, MEASURED 2026-09-04 (workflow/scripts/check_refined_band.py --mode poly on the
# built mesh, median size of the 0 < alpha < 1 cells): 5.556e-5 m, i.e. R/h = 18.0 AT THE INTERFACE,
# not the 18.91 quoted from h_eff = (V/N)^(1/3) = 5.289e-5. The average is pulled down by cfMesh's
# boundary refinement -- the size-vs-distance profile shows the outermost bin at 0.67 -- so the
# 'uniform' polyhedral mesh carries a finer boundary layer. All three rungs sit at EXACTLY
# 2^(-1/3) x maxCellSize (the dual cell holds half an octree box), so the ladder's h RATIOS and
# therefore its fitted orders are unchanged; the quoted R/h moves, and the N_CELLS pin 114
# (interface-honest value 108) makes the capillary dt 5.3 % conservative. The rung is kept as run.
study_name: polyDroplet3D_r18p9
case: stationaryDroplet3D
mesh: poly
mode: parallel
np: 32
solver: leiaSemiLagrangianLevelSetTwoPhaseFoam
theme:  method-comparison
setfields_args: "-alphaName alpha.water"
solve_runtime: 1380
axes_override:
  DOMAIN_LENGTH: [0.006]
  MAX_CELL_SIZE: [7.0e-5]
  N_CELLS: [114]
  SURFACE_TENSION_FORCE: [reconstructedCurvature]
  CURVATURE_EXTENSION: [cellCentreInverse]
  FACE_CURVATURE_SOURCE: [model]
  PSI_FILTER: [none]
  VOLUME_CORRECTION: [noVolumeCorrection]
  MOMENTUM_DDT_SCHEME: [backward]
  RHO_DDT_SCHEME: [backward]
  MOMENTUM_DIV_SCHEME: [upwind]
  MASS_FLUX: [rhoLENT]
  MASS_FLUX_BOUND_RHO: ["true"]
  PHASE_INDICATOR: [detrixheAslam]
  SL_TRACE_VELOCITY: [projectedFlux]
  SL_RECONSTRUCTION: [uncachedQuadraticWeightedLeastSquares]
  SL_FOOT_INTEGRATOR: [taylor]
  END_TIME: [0.025]
  WRITE_INTERVAL: [0.0125]
collapse_other_axes: true
export_slides: false
mpi_launcher: "mpirun -np {np}"
env_preamble: "source $HOME/OpenFOAM/OpenFOAM-v2512/etc/bashrc; [ -f $HOME/.leia_env ] && . $HOME/.leia_env || true"
