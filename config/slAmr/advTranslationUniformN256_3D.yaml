# ============================================================================
# AMR LINE, ADVECTION LADDER A1: 3D TRANSLATION, ONE WAY (2026-11-23, STATUS 11.44,
# docs/plan-sl-amr-preprint.md, study A1). Two studies, one variable: the mesh.
#   advTranslationUniform3D  uniform cubes, N = 64, 128, 256 (the control)
#   advTranslationAmr3D      base N = 16, 32, 64 with two refinement levels (blastAMR,
#                            band of 6 finest cells, buffer 2), finest h = 1/64, 1/128, 1/256
# Matched: case, T = 1, CFL 0.5 (time-step law dt = CFL h_fine/|u|), reconstruction
# cubicLatticeQuadraticWeightedLeastSquares, phase indicator, no source, no bound, no
# limiter. The rescaling is OFF in both (its arm is a separate study after its gate).
# The uniform study has SL_MESH_TRANSFER none (no mesh change occurs).
#
# PRE-REGISTERED READ-OUT (before any run). Metrics at t = T: E_GEOM_ALPHA_REL (shape,
# L1), |E_VOL_ALPHA_REL| (volume), E_NARROW_L1_GRAD_PSI and E_NARROW_L2_GRAD_PSI (band
# gradient). Orders over each rung pair. No L_inf value is judged.
#   PREDICTION (HYPOTHESIS; the only measurement is the smoke at T = 0.1):
#   P1  every case completes.
#   P2  uniform: the order of the shape error is at least 1.8 over both rung pairs.
#   P3  AMR: the shape error is at most 1.5 times the uniform one at equal finest h, at
#       every rung, and its order is within 0.3 of the uniform order.
#   P4  AMR: |volume error| is at most 2 times the uniform one at every rung.
#   P5  AMR: the band gradient errors (L1, L2) are at most 1.5 times the uniform ones.
#   P6  AMR: the cell count at t = T is below 15 % of the uniform count at the finest
#       rung. The wall clock and the rank count are reported, not judged.
#   FALSIFIED (the AMR line does not keep the accuracy of the uniform mesh) if the AMR
#   shape error exceeds 1.5 times the uniform one at the finest rung, or if its order
#   over the last rung pair is below 1.5.
#   If P2 fails, the control is at fault and no AMR verdict is drawn.
# RANKS. The domain is [0,2] x [0,1] x [0,1], so N = 256 has 33.5e6 cells. This file runs
# N = 64 and 128 on 48 ranks; advTranslationUniformN256_3D runs N = 256 on 96 ranks
# (memory: 10.2e6 cells did not fit on 8 ranks with 4 GB each on 2026-11-13).
#
# RESULT 2026-11-23 (binaries 5d54032f; drivers 57097112, 57102282 uniform, 57097094 AMR).
#   Relative errors at t = 1, finest h = 1/64, 1/128, 1/256:
#     uniform  shape 4.05e-2, 9.64e-3, 2.31e-3 (orders 2.07, 2.06);
#              band gradient L1 5.5e-2, 6.9e-3, 2.3e-3; volume 3.56e-3, 8.09e-4, 1.04e-4
#     AMR      shape 4.82e-2, 1.18e-2, 1.80e-2 (orders 2.03, -0.61);
#              band gradient L1 8.0e-2, 5.2e-2, 7.4e-2
#   P1 holds. P2 holds. P3 FAILS at the finest rung (ratio 7.8). P5 FAILS (ratios 1.4,
#   7.6, 32). P4 and the volume part are NOT JUDGED: the AMR volume error is 1.0e-1,
#   2.6e-2, 6.3e-3 at t = 0, so its reference volume belongs to the unrefined mesh (a
#   measurement defect). P6: 956804 cells at the end of the finest AMR rung against
#   33.5e6 (2.9 %), wall clock 1173 s on 16 ranks against 954 s on 96 ranks.
#   VERDICT: FALSIFIED as pre-registered. The band-gradient error of the AMR runs grows
#   from t = 0.1; the smallest |grad psi| in the band is 0.81 and 0.71 on the finer rungs
#   (uniform 0.95, 0.99). At t = 0.9985, finest h = 1/128, the error |psi - distance|/h
#   on the finest level is 0.11 (leading) and 0.05 (trailing) in the interface layer,
#   0.33 in layers 6 to 8 and 0.60 in the coarse cells ahead; no coarser cell is nearer
#   than 7.8 layers. The error enters at the leading edge of the band.
# ============================================================================
study_name: advTranslationUniformN256_3D
case: 3Dtranslation
mesh: hex
mode: parallel
np: 96
solver: leiaSemiLagrangeLevelSetFoam
theme: sl-amr
solve_runtime: 480
setfields_args: -alphaName alpha
axes_override:
  N_CELLS:
  - '256'
  CFL:
  - '0.5'
  END_TIME:
  - '1.0'
  OSCILLATION:
  - 'off'
  END_REFERENCE:
  - translate
  ADVECTION:
  - semiLagrangian
  PHASE_INDICATOR:
  - detrixheAslam
  PROFILE:
  - signedDistance
  SL_SCHEME:
  - pointValue
  SL_RECONSTRUCTION:
  - cubicLatticeQuadraticWeightedLeastSquares
  SL_VALUE_BOUND:
  - none
  SL_LIMITER:
  - none
  SL_FOOT_INTEGRATOR:
  - taylor
  SL_STENCIL:
  - point
  SL_CLIP:
  - 'false'
  SL_TRACE_VELOCITY:
  - projectedFlux
  SL_SOURCE:
  - none
  FLUX_PROJECTION:
  - none
  SDPLS_SOURCE:
  - noSource
  SOURCE_SCHEME:
  - explicit
  DYNAMIC_MESH:
  - staticMesh
  SL_MESH_TRANSFER:
  - none
  PURGE_WRITE:
  - '2'
  REPORT_WRITE_ONLY:
  - 'false'
collapse_other_axes: true
export_slides: false
keep_fields: last
studies_dir: studies/slAmr
