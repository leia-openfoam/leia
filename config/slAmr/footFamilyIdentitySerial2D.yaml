# ============================================================================
# SERIAL BIT-IDENTITY GATE of two inert infrastructure commits (2026-11-26):
#   c604fa73  the foot integrator as the RTS family slFootIntegrator;
#   ba2b579e  slReconstruction::advanceBoundary, a no-op hook called by pointValueScheme.
# WHY SERIAL. The parallel gate (footFamilyIdentity2D/3D) was not decided: the scotch
# decomposition is not reproducible between two runs on the FE host. A serial run has no
# decomposition.
# The study runs twice on the FE host in one Apptainer image: BEFORE = binaries of 49325615,
# AFTER = binaries of ba2b579e (both changes). Same config, same profile.
# PRE-REGISTERED READ-OUT (before the run):
#   S1  every arm of both runs completes;
#   S2  every metric CSV (leiaSemiLagrangeLevelSetFoam.csv, gradPsiError.csv) of AFTER
#       equals BEFORE: compare_metrics_csv.py --tol 0 --skip ELAPSED_CPU_TIME,ELAPSED_CLOCK_TIME.
#   FALSIFIED (a change is not inert) if any column differs.
#
# RESULT (MEASURED 2026-11-26, FE host; before = binaries of 49325615, after = faecb31c,
# which contains c604fa73 and ba2b579e). 2D: 8 arms (N = 32 to 256, taylor and rk2); 3D:
# 4 arms (N = 32 and 64, taylor and rk2). S1 PASS: every arm of both runs completes.
# S2 PASS: both CSVs of every arm are bit-identical (largest relative difference 0 in
# every column except the timing columns). Both infrastructure commits are inert.
# ============================================================================
study_name: footFamilyIdentitySerial2D
case: 2Dtranslation
mesh: hex
mode: serial
np: 1
solver: leiaSemiLagrangeLevelSetFoam
solve_runtime: 3600
axes_override:
  SL_VALUE_BOUND: ["none"]
  SL_CONE_L_MODE: ["unity"]
  SL_CONE_INADMISSIBLE: ["cellOnly"]
  SL_CONE_L: [1]
  SL_LIMITER: ["none"]
  SL_RECONSTRUCTION: [uncachedQuadraticWeightedLeastSquares]
  SL_FOOT_INTEGRATOR: ["taylor", "rk2"]
  SL_STENCIL: ["point"]
  SL_CLIP: ["false"]
  SL_CLIP_REGION: ["all"]
  SL_CLIP_KEEP_EXTREMA: ["false"]
  PHASE_INDICATOR: [detrixheAslam]
  N_CELLS: [32, 64, 128, 256]
  CFL: [0.5]
  END_TIME: [0.5]
collapse_other_axes: true
export_slides: false
studies_dir: studies/slAmr
