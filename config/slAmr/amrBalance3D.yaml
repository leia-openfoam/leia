# ============================================================================
# AMR LINE, LOAD BALANCING TEST (2026-11-23, branch feature/slls-amr, STATUS 11.44)
# The case of amrSmokeTranslation3D on 4 ranks with DYNAMIC_MESH blastAMRbalanceTest:
# allowableImbalance 0.02 in place of 0.2 (a test instrument), so that blastAMR
# redistributes the mesh in this small case. The smoke did not redistribute (largest
# imbalance 15.3 %).
#
# PRE-REGISTERED READ-OUT (before the run).
#   PASS if the solver completes, the log shows at least one redistribution, and every
#   metric agrees with amrDecompNp4_3D (the same case without a redistribution) within
#   1e-9 relative, with the same cell counts.
#   FALSIFIED by a crash after a redistribution, or by a metric difference above 1e-9.
#
# CORRECTION 2026-11-23: "the smoke did not redistribute" above is wrong. The smoke log
#   has 5 redistributions: 3 in the initial adaptation (imbalance 62.1, 46.6 and 20.4 %)
#   and 2 in the time loop (20.7 and 22.4 %). The first reading took only the last value.
#
# RESULT 2026-11-23 (driver 57091290, binaries 5d54032f, 4 ranks).
#   NOT A PASS AS WRITTEN, for the reason of amrDecompNp4_3D. The solver completes (56
#   steps). The log has 15 redistributions (amrDecompNp4_3D: 5); the imbalance stays below
#   7.9 % after the initial adaptation. The cell counts are equal at every mesh change.
#   gradPsiError.csv and the shape error are IDENTICAL to amrDecompNp4_3D (difference 0).
#   The volume error differs by 6.2e-8 relative in the one row where it crosses zero
#   (absolute 1.0e-17); every other row is below 1e-9.
# ============================================================================
axes_override:
  ADVECTION:
  - semiLagrangian
  CFL:
  - '0.5'
  DYNAMIC_MESH:
  - blastAMRbalanceTest
  END_REFERENCE:
  - translate
  END_TIME:
  - '0.1'
  FLUX_PROJECTION:
  - none
  N_CELLS:
  - '16'
  OSCILLATION:
  - 'off'
  PHASE_INDICATOR:
  - detrixheAslam
  PROFILE:
  - signedDistance
  PURGE_WRITE:
  - '2'
  REPORT_WRITE_ONLY:
  - 'false'
  SDPLS_SOURCE:
  - noSource
  SL_CLIP:
  - 'false'
  SL_FOOT_INTEGRATOR:
  - taylor
  SL_LIMITER:
  - none
  SL_MESH_TRANSFER:
  - quadraticFit
  SL_RECONSTRUCTION:
  - cubicLatticeQuadraticWeightedLeastSquares
  SL_SCHEME:
  - pointValue
  SL_SOURCE:
  - none
  SL_STENCIL:
  - point
  SL_TRACE_VELOCITY:
  - projectedFlux
  SL_VALUE_BOUND:
  - none
  SOURCE_SCHEME:
  - explicit
case: 3Dtranslation
collapse_other_axes: true
export_slides: false
keep_fields: processors
mesh: hex
mode: parallel
np: 4
setfields_args: -alphaName alpha
solve_runtime: 20
solver: leiaSemiLagrangeLevelSetFoam
studies_dir: studies/slAmr
study_name: amrBalance3D
theme: sl-amr
