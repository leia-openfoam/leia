# ============================================================================
# WALL TENSOR ON THE ROTATION NEAR THE WALLS (2026-11-26; stage A of the boundary
# treatment). quadSphereRotationUniformDt3D with SL_RECONSTRUCTION cubicLatticeWallTensor;
# nothing else changes (uniform N = 128, np 48, exact inflow data, taylor foot,
# dt = 2 pi/1600, 2 pi/3200, 2 pi/6400).
# BASELINE (MEASURED 2026-11-25, quadSphereRotationUniformDt3D): E = 7.27e-4 / 7.90e-4 /
# 2.70e-3 (interface cells, L1, in h), not falling with dt; mean error in the wall cells
# 9.3e-3 h at dt = 2 pi/1600; the source is the linear fallback fit of 32,256 wall cells.
# DERIVED: with the wall source removed, the leading error is the truncation of the taylor
# foot, about 5e-4 h at dt = 2 pi/1600, falling with dt^2.
# PRE-REGISTERED READ-OUT (before the run).
#   R1  every case completes; the log reports 0 wall cells with the base fit.
#   R2  the mean error in the wall cells (distance < h) falls at least 10 times against
#       the baseline at dt = 2 pi/1600 (to <= 9.3e-4 h).
#   R3  E falls with dt: E(dt)/E(dt/2) >= 3 and E(dt/2)/E(dt/4) >= 3.
#   FALSIFIED if the wall-cell error falls less than 3 times, or E does not fall with dt.
#
# RESULT, FIRST RUN (MEASURED 2026-11-26, FE host, binaries of a146ac82, np 48): every wall
# cell uses the tensor interpolant. E = 1.72e-3 / 4.11e-3 / 7.99e-3 (L1, h) at dt / dt/2 /
# dt/4; mean wall-cell error 1.96e-2 / 2.00e-2 / 2.12e-2 h; max 0.21 h at the wall y = 1
# near z = 0.5, where the wall changes from inflow to outflow. R2 FAIL (the wall error is
# 2.1 times WORSE than the baseline), R3 FAIL (E rises as dt falls). FALSIFIED.
# DIAGNOSIS (DERIVED from the code, not yet tested): the velocity of a boundary point is
# u_c + grad(u)_c . dx with the Gauss gradient of the trace velocity reconstruct(phi), whose
# patch values are the adjacent cell values (extrapolatedCalculated). That gradient is
# wrong by O(|grad u|) in every wall cell, so a boundary point moves with an O(h |grad u|)
# velocity error: an O(h dt) foot error per step, O(h) after a fixed time, for any dt.
# SECOND RUN, pre-registered before it (2026-11-26): the velocity of a boundary point and
# its gradient from the cell values of the tensor stencil only (one-sided difference
# normal to a wall, central difference along it; exact for a linear velocity). The same
# read-out R1 to R3 applies.
#
# RESULT, SECOND RUN (MEASURED 2026-11-26, FE host, binaries of 4435f37c, np 48). Every wall
# cell uses the tensor interpolant.
#   dt          E (L1 / L2, h)        wall cells mean / max   all cells mean
#   2 pi/1600   2.63e-4 / 3.05e-4     1.74e-3 / 9.96e-3       8.75e-4
#   2 pi/3200   7.66e-5 / 9.57e-5     8.45e-4 / 5.07e-3       3.30e-4
#   2 pi/6400   4.65e-5 / 5.95e-5     4.32e-4 / 2.54e-3       1.63e-4
#   Baseline (quadSphereRotationUniformDt3D): E 7.27e-4 / 7.90e-4 / 2.70e-3, wall 9.3e-3.
#   R1 PASS. R2 FAIL: the wall-cell error falls 5.3 times, not 10 (not falsified: the
#   threshold of falsification was 3). R3 FAIL: ratios 3.43 and 1.65. E is 2.8 times lower
#   than the baseline at dt and 58 times lower at dt/4, and it now falls with dt.
#   The wall-cell error falls with order 1 in dt (1.74e-3, 8.45e-4, 4.32e-4); the largest
#   error sits in edge and corner cells.
#   HYPOTHESIS (not tested): the remaining first-order source is the taylor foot of the
#   wall CELLS: its dt^2 term reads the Gauss gradient of the trace velocity, which is
#   biased by O(|grad u|) in wall cells; an O(1) error in a dt^2 term per step is O(dt)
#   after a fixed time.
# ============================================================================
study_name: wallTensorRotationDt3D
case: 3DsphereRotation
mesh: hex
mode: parallel
np: 48
solver: leiaSemiLagrangeLevelSetFoam
theme: sl-amr
solve_runtime: 480
setfields_args: -alphaName alpha
axes_override:
  BC:
  - rigidMotionProfile
  SL_STENCIL_BOUNDARY_FACES:
  - inflowOnly
  ADJUST_TIME_STEP:
  - 'no'
  DELTA_T:
  - '0.003926990816987241'
  - '0.001963495408493621'
  - '0.0009817477042468104'
  N_CELLS:
  - '128'
  CFL:
  - '0.5'
  END_TIME:
  - '6.283185307179586'
  OSCILLATION:
  - 'off'
  END_REFERENCE:
  - none
  ADVECTION:
  - semiLagrangian
  PHASE_INDICATOR:
  - detrixheAslam
  PROFILE:
  - quadraticSphere
  SL_SCHEME:
  - pointValue
  SL_RECONSTRUCTION:
  - cubicLatticeWallTensor
  SL_VALUE_BOUND:
  - none
  SL_LIMITER:
  - none
  SL_FOOT_INTEGRATOR:
  - taylor
  SL_STENCIL:
  - point
  SL_CLIP:
  - 'false'
  SL_TRACE_VELOCITY:
  - projectedFlux
  SL_SOURCE:
  - none
  FLUX_PROJECTION:
  - none
  SDPLS_SOURCE:
  - noSource
  SOURCE_SCHEME:
  - explicit
  DYNAMIC_MESH:
  - staticMesh
  SL_MESH_TRANSFER:
  - none
  PURGE_WRITE:
  - '2'
  REPORT_WRITE_ONLY:
  - 'false'
collapse_other_axes: true
export_slides: false
keep_fields: last
studies_dir: studies/slAmr
