# quadraticTaylor (quadratic Taylor + clip) 3D deformation convergence, CFL 0.5 -- the
# LINEAR semi-Lagrangian line, run as an INDEPENDENT METHOD next to the quadratic
# line. Same ladder as config/uncachedConv3Ddeformation.yaml (finest 160^3 = 4.1M
# cells uses deformation's spare headroom over shear).
# Results agglomerate into docs/linear-semi-lagrangian-level-set/ (theme key).
#
#   snakemake --workflow-profile profiles/local --configfile config/linearConv3Ddeformation.yaml --resources tasks=12
study_name: linearConv3Ddeformation
case: 3Ddeformation
mesh: hex
mode: parallel
np: 8

solver: leiaSemiLagrangeLevelSetFoam
theme: linear-semi-lagrangian-level-set

axes_override:
  END_TIME: [3.0]
  N_CELLS:  [32, 50, 80, 128, 160]      # cbrt(4) ladder + headroom finest, cells x4/level
  CFL:      [0.1, 0.2, 0.4, 0.8]        # CFL sweep (clip on for consistency across the line)
  SL_RECONSTRUCTION: [quadraticTaylor]
  # clipToStencilBounds on for the whole linear line (deformation-hex was stable
  # without it, but clip is now the standard stable configuration).
  SL_CLIP: ["true"]   # quoted so it renders lowercase (OpenFOAM Switch)
  PHASE_INDICATOR: [detrixheAslam]
  DIV: [linear]
collapse_other_axes: true

export_slides: true   # publication study: auto-refresh theme figures + deck on completion

mpi_launcher: "mpirun -np {np}"
env_preamble: "source $HOME/OpenFOAM/OpenFOAM-v2506/etc/bashrc"
