# NON-ORTHOGONAL CORRECTOR SWEEP on the polyhedral Popinet-3D smoke (2026-09-05): the smoke4
# config VERBATIM (same axes_override, solver, launcher) plus ONE axis. The cfMesh N = 64 mesh
# has non-orthogonality max 54.4 deg (average 4.2), skewness 1.7 and 8 concave corner cells,
# and every run so far used nNonOrthogonalCorrectors 1 (hardcoded until today). The polyhedral
# runs carry a CONSTANT velocity defect max|u'| = 0.0945 U from step 20 (hex twin 0.0134 U),
# located: the 8 inlet-corner boundary cells (the concave ones), and all 84 cells above 0.03 U
# are boundary cells. An under-corrected pressure Laplacian on 50-deg cells looks exactly like
# that. PRE-REGISTERED: if the max|u'| plateau and L1/L2 |u'| fall with the corrector count,
# polyhedral cases need >= 3 correctors (cost from clockPerSimTime) and the stationary rungs
# are re-examined; if unchanged, the defect is in the boundary treatment, not the Laplacian.
study_name: popinet3D_La12000_poly_smoke_nonOrth
case: popinetTranslating3D
mesh: poly
mode: parallel
np: 32
solver: leiaSemiLagrangianLevelSetTwoPhaseFoam
theme:  method-comparison
setfields_args: "-alphaName alpha.water"
axes_override:
  N_CELLS: [64]
  MAX_CELL_SIZE: [0.019685]
  END_TIME: [0.02]
  WRITE_INTERVAL: [0.02]
  POPINET_NX: [128]
  POPINET_XLEN: [2]
  DOMAIN_LENGTH: [1]
  CAPILLARY_REF_LENGTH: [1]
  CAPILLARY_DT_COEFF: [0.13107]
  DROPLET_RADIUS: [0.2]
  DROPLET_OFFSET_X: [0]
  TRANSLATION_SPEED: [1]
  SIGMA: [1]
  POPINET_RHO: [1]
  POPINET_NU: [5.773502692e-03]
  SURFACE_FILE: [box2x1x1.stl]
  MOMENTUM_DIV_SCHEME: ["upwind"]
  MASS_FLUX: ["rhoLENT"]
  MASS_FLUX_BOUND_RHO: ["true"]
  VOLUME_CORRECTION: ["noVolumeCorrection"]
  MOMENTUM_DDT_SCHEME: ["backward"]
  RHO_DDT_SCHEME: ["backward"]
  CURVATURE_EXTENSION: ["none"]
  SURFACE_TENSION_FORCE: ["reconstructedCurvature"]
  FACE_CURVATURE_SOURCE: [model]
  PSI_FILTER: [none]
  PHASE_INDICATOR: [detrixheAslam]
  SL_TRACE_VELOCITY: ["projectedFlux"]
  SL_RECONSTRUCTION: [uncachedQuadraticWeightedLeastSquares]
  SL_FOOT_INTEGRATOR: ["taylor"]
  N_NON_ORTH_CORRECTORS: [1, 3, 6]
collapse_other_axes: true
export_slides: false
mpi_launcher: "mpirun -np {np}"
env_preamble: "source $HOME/OpenFOAM/OpenFOAM-v2512/etc/bashrc; [ -f $HOME/.leia_env ] && . $HOME/.leia_env || true"
