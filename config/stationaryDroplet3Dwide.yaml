# THE 3D LADDER: 4 resolutions, R/h >= 10 at the coarsest, cell count doubling
# per level -- on a TRUNCATED UNIFORM box (L = 4R = 4e-3 m), not the 0.01 m one.
#
#   N_L    h [m]      R/h    cells    ratio   N_ref    dt [s]     steps   core-h
#    40  1.0000e-04  10.00    64000     --    100.0  1.0861e-05    9207      3.3
#    51  7.8431e-05  12.75   132651   2.073   127.5  7.5440e-06   13255      9.7
#    64  6.2500e-05  16.00   262144   1.976   160.0  5.3665e-06   18634     27.0
#    80  5.0000e-05  20.00   512000   1.953   200.0  3.8399e-06   26042     73.7
#                                                            total       114 core-h
#
# The SAME FOUR CELL SIZES on the 0.01 m box are 1e6/2e6/4.1e6/8e6 cells and
# 1776 core-h: 15.6x more, for identical h, identical dt, identical step counts
# and -- if the domain-size control certifies it -- identical metrics. N_ref is
# the reference-equivalent cell count 0.01/h that materialize uses for the
# capillary step, so each arm here runs at exactly the dt its h deserves.
#
# WHY TRUNCATION AND NOT OCTREE REFINEMENT. Two levels of 2:1 refinement on the
# 0.01 m box would give ~7.8x fewer cells than uniform, i.e. still 3x MORE than
# this, and it would put hanging-node faces in the mesh. Those cost the two
# properties this campaign's result rests on: w = 1/2 at every face (the
# potential-form identity kappa*grad(alpha) = grad(kappa*alpha) - alpha*grad(kappa)
# is exact only there) and exact absorption of a uniform kappa error by the
# pressure solve (measured: constant kappa leaves an m=2 perturbation frozen at
# 1.0000 over 3200 steps). On a truncated UNIFORM mesh both hold by construction,
# with no gate to run and no caveat to write into the paper.
#
# WHY NOT COARSER, WHY NOT FINER. R/h >= 10 forbids a coarser coarse end (and
# the filter's band+1-ring support needs R/h >~ 6 -- the 3D N=32 failures at
# R/h = 3.2 were support starvation, not convergence). Each further level costs
# 2^1.5 = 2.83x. So the price of the R/h floor with cell doubling is a SHORT
# LEVER: h spans only a factor 2 across these four points, an error ratio of 4
# end to end, and a 10% endpoint perturbation moves a fitted order by ~0.14.
# Treat the fitted 3D order as INDICATIVE; the 2D ladder (h x8, error ratio 64)
# carries the order claim. Extending to N_L = 101/127/160 widens h to x4 and
# costs 2468 core-h -- a separate decision, deliberately not bundled here.
#
# np = 16 matches the existing 3D arms (N = 32, 64), so the new ladder is
# comparable to them and no decomposition difference enters the fit.
#
# PREDICTIONS (recorded before the run).
#   a. All four reach t = 0.1. The two existing 3D points are BELOW the filter's
#      support requirement (R/h = 3.2 died at t = 0.055; R/h = 6.4 reached 0.1),
#      so this is the first 3D ladder entirely inside the working regime.
#   b. The h-trend is monotone DOWN in max|U|, volume and shape. The unfiltered
#      3D pair already inverted the finer-blows-first trend (0.0613 -> 0.0786);
#      if the filtered ladder is non-monotone here while 2D was monotone, the
#      difference is dimensional and that is exactly what this case was built
#      to find out.
#   c. min|grad psi| stays above 0.96 at every level (3D N=64 gave 0.964).
#   d. Failure mode: if the coarsest level (R/h = 10) is the one that dies, the
#      working requirement is stricter in 3D than the R/h >~ 6 measured in 2D,
#      and the whole ladder has to move up -- expensive, but it would be a
#      finding about the filter's support and not about the delivery.
#   Report volume AND shape error, never a single metric.
study_name: stationaryDroplet3Dwide
case: stationaryDroplet3D
mesh: hex
mode: parallel
np: 16

solver: leiaSemiLagrangianLevelSetTwoPhaseFoam
theme:  method-comparison

setfields_args: "-alphaName alpha.water"

axes_override:
  DOMAIN_LENGTH: [0.004]
  N_CELLS: [40, 51, 64, 80]
  CURVATURE_EXTENSION: [cellCentreInverse]
  FACE_CURVATURE_SOURCE: [model]
  PSI_FILTER: [biharmonicBand]
  PSI_FILTER_THETA: [0.2]

# largest arm: 512000 cells x 26042 steps at np16 ~ 4.6 h from the measured 3D
# rate (1.99e-5 core-s per cell-step, N=64 3D at np16).
solve_runtime: 420
export_slides: false

env_preamble: "source $HOME/OpenFOAM/OpenFOAM-v2512/etc/bashrc"
