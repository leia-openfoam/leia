# SI UNITS (2026-09-08). This study runs Popinet's benchmark in real units at his own
# dimensionless groups: D = 1 mm, rho = 1000 kg/m^3 and nu = 1e-6 m^2/s in BOTH phases,
# sigma = 0.012 N/m, U = 0.0692820323 m/s, box 5 x 2.5 (x 2.5) mm, T_U = D/U = 0.01443375673 s.
# That gives La = sigma D/(rho nu^2) = 12000, We = rho U^2 D/sigma = 0.4, Re = 69.28, and
# density and viscosity ratios of 1 -- so every number Popinet reports still applies.
# Sentences below that use his units (D = 0.4, U = 1, sigma = 1, the unit square, 0.13107)
# describe the SAME case: multiply a length by 2.5e-3 m, a velocity by 0.0692820323 m/s and
# a time by 0.03608439182 s. Verify with:
#     python3 workflow/scripts/popinet_si.py check <this file>
#
# KINEMATICS-BEFORE-DYNAMICS CONTROL (2026-09-07): the 0.0195 feature-edge polyhedral r12p8 case with
# SIGMA 0 -- a PASSIVE level set in a uniform stream (equal densities and viscosities, no surface
# tension), everything else identical (same mesh, dt, BCs, stencil `include`). On three pMesh
# variants the far-field level set near the OUTLET developed a growing alternating mode and a
# fake zero set (steps 865 / 267 / 508) BEFORE any velocity anomaly (0.0195 mesh: fake zero set
# at step 508, first velocity spike at 530, outlet-corner |u'| = 3e-8 at t = 0.02), and the
# coupling then destroyed the run. PRE-REGISTERED: if the zero-set error jumps here too, the
# instability is the semi-Lagrangian transport alone on cfMesh's small asymmetric boundary cells
# (scheme-level fix needed: a monotone clip away from the band, or an interpolating
# reconstruction); if the passive level set stays clean to T = 0.4, the growth needs the
# capillary coupling and the boundary cells only seed it.
study_name: popinet3D_La12000_poly_r12p8_mcs0195_sigma0
case: popinetTranslating3D
mesh: poly
mode: parallel
np: 32
solver: leiaSemiLagrangianLevelSetTwoPhaseFoam
theme:  method-comparison
setfields_args: "-alphaName alpha.water"
solve_runtime: 300
axes_override:
  N_CELLS: [64]
  MAX_CELL_SIZE: [4.875e-05]
  REFINE_ALLOW_PIN_MISMATCH: ["true"]
  END_TIME: [0.01443375673]
  WRITE_INTERVAL: [0.007216878365]
  POPINET_NX: [128]
  POPINET_XLEN: [2]
  DOMAIN_LENGTH: [0.0025]
  CAPILLARY_REF_LENGTH: [0.0025]
  CAPILLARY_DT_COEFF: [0.004729265146]
  DROPLET_RADIUS: [0.0005]
  DROPLET_OFFSET_X: [0]
  TRANSLATION_SPEED: [0.0692820323]
  SIGMA: [0]
  POPINET_RHO: [1000]
  POPINET_NU: [1.0e-06]
  SURFACE_FILE: [box5x2p5x2p5mm.fms]
  MOMENTUM_DIV_SCHEME: ["upwind"]
  MASS_FLUX: ["rhoLENT"]
  MASS_FLUX_BOUND_RHO: ["true"]
  VOLUME_CORRECTION: ["noVolumeCorrection"]
  MOMENTUM_DDT_SCHEME: ["backward"]
  RHO_DDT_SCHEME: ["backward"]
  CURVATURE_EXTENSION: ["none"]
  SURFACE_TENSION_FORCE: ["reconstructedCurvature"]
  FACE_CURVATURE_SOURCE: [model]
  PSI_FILTER: [none]
  PHASE_INDICATOR: [detrixheAslam]
  SL_TRACE_VELOCITY: ["projectedFlux"]
  SL_RECONSTRUCTION: [uncachedQuadraticWeightedLeastSquares]
  SL_FOOT_INTEGRATOR: ["taylor"]
collapse_other_axes: true
export_slides: false
mpi_launcher: "mpirun -np {np}"
env_preamble: "source $HOME/OpenFOAM/OpenFOAM-v2512/etc/bashrc; [ -f $HOME/.leia_env ] && . $HOME/.leia_env || true"
