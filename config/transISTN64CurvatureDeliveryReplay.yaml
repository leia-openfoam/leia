# Curvature-delivery replay gate.
#
# The baseline is a quiet, genuinely advected N=64 translating droplet using
# exact constant curvature.  Its uncached-quadratic-SL/Detrixhe-Aslam snapshots
# are replayed from U=(0.05,0,0) for one complete PIMPLE timestep with the
# interface frozen.  The decision observable is only the resulting maximum
# cell-centred |U-Utrans|.
study_name: transISTN64CurvatureDeliveryReplay
case: transISTDroplet2D
mesh: hex
mode: serial
np: 1
solver: leiaSemiLagrangianLevelSetTwoPhaseFoam
theme: semi-lagrangian-level-set
collapse_other_axes: true
axes_override:
  N_CELLS: [64]
  END_TIME: [0.05002]
  WRITE_INTERVAL: [0.005]
  SL_RECONSTRUCTION: [uncachedQuadraticWeightedLeastSquares]
  TIME_STEP_CONTROL: [capillary]
  VELOCITY_EXTENSION: [none]
  TRAJECTORY_VELOCITY: [input]
  MASS_FLUX: [rhoLENT]
  MASS_FLUX_FACE_INTERPOLATION: [central]
  SURFACE_TENSION_FORCE: [constantCurvatureSurfaceTension]
  SURFACE_TENSION_CURVATURE_SOURCE: [field]
  SURFACE_TENSION_CURVATURE: [1000]
  SURFACE_TENSION_SIGN: [-1]
  SURFACE_TENSION_GEOMETRIC_METHOD: [conormalCSF]
  SURFACE_TENSION_SIGMA: [0.07274]
  CURVATURE_EXTENSION: [none]
  CURVATURE_EXTENSION_RELAX: [1]
  CURVATURE_FACE_INTERPOLATION: [arithmetic]
  CURVATURE_FORCE_WEIGHT: [alpha]
  CURVATURE_FIT_HALF_WIDTH: [3]
  CURVATURE_REGULARIZATION_OPERATOR: [helmholtz]
  CURVATURE_TANGENTIAL_REGULARIZATION: [1]
  CURVATURE_REGULARIZATION_ITERATIONS: [30]

replay:
  snapshots: [0.0, 0.01, 0.025, 0.05]
  variants:
    - id: exactConstant
      surface_tension_force: constantCurvatureSurfaceTension
      curvature_extension: none
      face_interpolation: arithmetic
    - id: interfaceMean
      surface_tension_force: reconstructedCurvature
      curvature_extension: interfaceMean
      face_interpolation: arithmetic
    - id: quadraticCellCentre
      surface_tension_force: reconstructedCurvature
      curvature_extension: none
      face_interpolation: arithmetic
    - id: closestPointNewton
      surface_tension_force: reconstructedCurvature
      curvature_extension: closestPointNewton
      face_interpolation: arithmetic
    - id: footPointHeightFunction
      surface_tension_force: reconstructedCurvature
      curvature_extension: footPointHeightFunction
      face_interpolation: arithmetic
    - id: connectedInterface_h3_l1
      surface_tension_force: reconstructedCurvature
      curvature_extension: connectedInterface
      face_interpolation: connectedInterface
      fit_half_width: 3
      regularization_operator: helmholtz
      tangential_regularization: 1
      regularization_iterations: 30
    - id: connectedInterface_h4_l4
      surface_tension_force: reconstructedCurvature
      curvature_extension: connectedInterface
      face_interpolation: connectedInterface
      fit_half_width: 4
      regularization_operator: helmholtz
      tangential_regularization: 4
      regularization_iterations: 60
    - id: connectedInterface_h5_l16
      surface_tension_force: reconstructedCurvature
      curvature_extension: connectedInterface
      face_interpolation: connectedInterface
      fit_half_width: 5
      regularization_operator: helmholtz
      tangential_regularization: 16
      regularization_iterations: 120
    - id: connectedInterface_h3_bi20
      surface_tension_force: reconstructedCurvature
      curvature_extension: connectedInterface
      face_interpolation: connectedInterface
      face_curvature_source: registered
      fit_half_width: 3
      regularization_operator: biharmonic
      tangential_regularization: 0.05
      regularization_iterations: 20
    - id: connectedInterface_h3_bi50
      surface_tension_force: reconstructedCurvature
      curvature_extension: connectedInterface
      face_interpolation: connectedInterface
      face_curvature_source: registered
      fit_half_width: 3
      regularization_operator: biharmonic
      tangential_regularization: 0.05
      regularization_iterations: 50
    - id: connectedInterface_h4_bi10
      surface_tension_force: reconstructedCurvature
      curvature_extension: connectedInterface
      face_interpolation: connectedInterface
      face_curvature_source: registered
      fit_half_width: 4
      regularization_operator: biharmonic
      tangential_regularization: 0.05
      regularization_iterations: 10
    - id: connectedInterface_h4_bi20
      surface_tension_force: reconstructedCurvature
      curvature_extension: connectedInterface
      face_interpolation: connectedInterface
      face_curvature_source: registered
      fit_half_width: 4
      regularization_operator: biharmonic
      tangential_regularization: 0.05
      regularization_iterations: 20
    - id: connectedInterface_h4_l16_preserve_m2_m4
      surface_tension_force: reconstructedCurvature
      curvature_extension: connectedInterface
      face_interpolation: connectedInterface
      face_curvature_source: registered
      fit_half_width: 4
      regularization_operator: helmholtzPreserveModes
      tangential_regularization: 16
      regularization_iterations: 120
      preserve_modes_through: 4
    - id: quadraticKang
      surface_tension_force: reconstructedCurvature
      curvature_extension: none
      face_interpolation: interfaceWeighted
    - id: fvmKang
      surface_tension_force: correctionKang
      curvature_extension: fvm
      face_interpolation: interfaceWeighted

    # Shared face-curvature service matrix. Every scalar-curvature CSF family
    # consumes the identical h3/biharmonic-20 kappaInterfaceFace field and
    # returns integrated G_sigma,f. Their native estimator/interpolation path
    # is bypassed; only the model-specific localisation remains.
    - id: sharedFace_divGradPsi
      surface_tension_force: divGradPsiSnGradAlpha
      curvature_extension: connectedInterface
      face_interpolation: arithmetic
      face_curvature_source: registered
      fit_half_width: 3
      regularization_operator: biharmonic
      tangential_regularization: 0.05
      regularization_iterations: 20
    - id: sharedFace_traceGradPsi
      surface_tension_force: traceGradGradPsiSnGradAlpha
      curvature_extension: connectedInterface
      face_interpolation: arithmetic
      face_curvature_source: registered
      fit_half_width: 3
      regularization_operator: biharmonic
      tangential_regularization: 0.05
      regularization_iterations: 20
    - id: sharedFace_traceGeoNormal
      surface_tension_force: traceGradGeoNormalSnGradAlpha
      curvature_extension: connectedInterface
      face_interpolation: arithmetic
      face_curvature_source: registered
      fit_half_width: 3
      regularization_operator: biharmonic
      tangential_regularization: 0.05
      regularization_iterations: 20
    - id: sharedFace_Kang
      surface_tension_force: correctionKang
      curvature_extension: connectedInterface
      face_interpolation: interfaceWeighted
      face_curvature_source: registered
      fit_half_width: 3
      regularization_operator: biharmonic
      tangential_regularization: 0.05
      regularization_iterations: 20
    - id: sharedFace_alphaCSF
      surface_tension_force: divGradAlphaSnGradAlpha
      curvature_extension: connectedInterface
      face_interpolation: arithmetic
      face_curvature_source: registered
      fit_half_width: 3
      regularization_operator: biharmonic
      tangential_regularization: 0.05
      regularization_iterations: 20
    - id: sharedFace_isoCSF
      surface_tension_force: isoCurvature
      curvature_extension: connectedInterface
      face_interpolation: arithmetic
      face_curvature_source: registered
      fit_half_width: 3
      regularization_operator: biharmonic
      tangential_regularization: 0.05
      regularization_iterations: 20

export_slides: false
publication_table: docs/method-comparison/method-comparison-article/data/tables/transISTN64CurvatureDeliveryReplay.csv
env_preamble: "source $HOME/OpenFOAM/OpenFOAM-v2506/etc/bashrc"
