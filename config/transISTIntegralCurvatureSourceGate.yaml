# Integral-force curvature-source split. Both cases retain identical interface
# crossings, tangent reconstruction, stress deposition and pressure coupling;
# only the curvature in the crossing pressure-jump correction changes.
study_name: transISTIntegralCurvatureSourceGate
case: transISTDroplet2D
mesh: hex
mode: serial
np: 1
solver: leiaSemiLagrangianLevelSetTwoPhaseFoam
theme: semi-lagrangian-level-set
setfields_args: "-alphaName alpha.water"
axes_override:
  N_CELLS: [32]
  END_TIME: [0.05]
  SL_RECONSTRUCTION: [uncachedQuadraticWeightedLeastSquares]
  TIME_STEP_CONTROL: [capillary]
  VELOCITY_EXTENSION: [none]
  TRAJECTORY_VELOCITY: [input]
  MASS_FLUX: [rhoLENT]
  MASS_FLUX_FACE_INTERPOLATION: [central]
  SURFACE_TENSION_FORCE: [integralSurfaceTension]
  SURFACE_TENSION_CURVATURE_SOURCE: [field, constant]
  SURFACE_TENSION_CURVATURE: [1000]
  SURFACE_TENSION_SIGMA: [0.07274]
export_slides: false
env_preamble: "source $HOME/OpenFOAM/OpenFOAM-v2506/etc/bashrc"
