# Zero-force temporal/remap-frequency ablation at N=32.  The fixed timestep is
# derived from dt=Co*h/U0 instead of the irrelevant capillary restriction.
study_name: transISTKinematicTimeStepGate
case: transISTDroplet2D
mesh: hex
mode: serial
np: 1
solver: leiaSemiLagrangianLevelSetTwoPhaseFoam
theme: semi-lagrangian-level-set
setfields_args: "-alphaName alpha.water"
axes_override:
  N_CELLS: [32]
  END_TIME: [0.05]
  TIME_STEP_CONTROL: [advective]
  TARGET_ADVECTIVE_CO: [0.01, 0.05, 0.1, 0.25, 0.5]
  DOMAIN_LENGTH: [0.01]
  REFERENCE_SPEED: [0.05]
  MAX_CO: [0.5]
  SL_RECONSTRUCTION: [uncachedQuadraticWeightedLeastSquares]
  VELOCITY_EXTENSION: [none]
  TRAJECTORY_VELOCITY: [input]
  MASS_FLUX: [rhoLENT]
  MASS_FLUX_FACE_INTERPOLATION: [central]
  SURFACE_TENSION_FORCE: [constantCurvatureSurfaceTension]
  SURFACE_TENSION_CURVATURE: [1000]
  SURFACE_TENSION_SIGMA: [0]
export_slides: false
env_preamble: "source $HOME/OpenFOAM/OpenFOAM-v2506/etc/bashrc"
