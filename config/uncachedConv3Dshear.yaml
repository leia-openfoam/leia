# uncachedQuadraticWeightedLeastSquares 3D shear convergence, CFL 0.5.
# Uniform refinement ladder N = 32,50,80,128 (ratio r = cbrt(4) per direction ->
# cells x4 per level; unit cube so cells = N^3). N=128 = 2.10M cells
# (~9.2 GB, the memory ceiling on this 15 GB box; the next uniform step N=160 =
# 8.2M ~18 GB OOMs, so shear caps at 128). Least-squares order over the ladder.
#
#   snakemake --workflow-profile profiles/local --configfile config/uncachedConv3Dshear.yaml --resources tasks=12
study_name: uncachedConv3Dshear
case: 3Dshear
mesh: hex
mode: parallel
np: 8

solver: leiaSemiLagrangeLevelSetFoam

axes_override:
  END_TIME: [3.0]
  N_CELLS:  [32, 50, 80, 128]           # cbrt(4) ladder, cells x4/level
  CFL:      [0.5]
  SL_RECONSTRUCTION: [uncachedQuadraticWeightedLeastSquares]
  PHASE_INDICATOR: [detrixheAslam]
  DIV: [linear]
collapse_other_axes: true

export_slides: true   # publication study: auto-refresh theme figures + deck on completion

mpi_launcher: "mpirun -np {np}"
env_preamble: "source $HOME/OpenFOAM/OpenFOAM-v2512/etc/bashrc"
