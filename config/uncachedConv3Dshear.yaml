# uncachedQuadraticWeightedLeastSquares 3D shear convergence (N=32/64/128, CFL 0.5).
# N=128 = 4.2M cells (~50 min at np=8 on this box).
#
#   snakemake --workflow-profile profiles/local --configfile config/uncachedConv3Dshear.yaml --resources tasks=8
study_name: uncachedConv3Dshear
case: 3Dshear
mesh: hex
mode: parallel
np: 8

solver: leiaSemiLagrangeLevelSetFoam

axes_override:
  END_TIME: [3.0]
  N_CELLS:  [32, 64, 128]
  CFL:      [0.5]
  SL_RECONSTRUCTION: [uncachedQuadraticWeightedLeastSquares]
  PHASE_INDICATOR: [detrixheAslam]
  DIV: [linear]
collapse_other_axes: true

export_slides: false

mpi_launcher: "mpirun -np {np}"
env_preamble: "source $HOME/OpenFOAM/OpenFOAM-v2506/etc/bashrc"
