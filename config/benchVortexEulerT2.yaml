# Decision benchmark (one method line, T = 2): reversed 2D vortex,
# 32^2..128^2 tier (256/512 added after tier-1 verification). Metrics:
# shape/volume/gradient at t = T; volume + gradient at t = T/2 (maximal
# stretching -- no shape reference there); ELAPSED_CLOCK_TIME wall clock.
# Reporting gated to write times in EVERY line (fair wall-clock).
#
#   snakemake --workflow-profile profiles/local --configfile config/benchVortexEulerT2.yaml

study_name: benchVortexEulerT2
case: 2Dvortex
mesh: hex
mode: parallel
np: 4

solver: leiaLevelSetFoam
theme: method-comparison

axes_override:
  END_TIME: [2]
  N_CELLS:  [32, 64, 128, 256, 512]
  CFL:      [0.5]
  REPORT_WRITE_ONLY: ["true"]
  PHASE_INDICATOR: [detrixheAslam]
  REDISTANCER: [noRedistancing]
  ADVECTION: [eulerian]
  VELOCITY_EXTENSION: [none]
  SDPLS_SOURCE: [noSource, R, beta]
  # BOTH linearizations. Every SDPLS row ever published from this study used
  # strictNegativeSpLinearImplicit alone -- the variant whose explicit (Sc)
  # branch carried a reversed sign until 2026-08, so it DOUBLED the gradient
  # drift wherever f_nl > 0 instead of cancelling it. simpleLinearImplicit
  # (Sc == 0) was never affected and is therefore the reference arm; the two
  # must now agree to the time-integration order. The `noSource` rows are
  # identical across both and serve as a free consistency check.
  SOURCE_SCHEME: [simpleLinearImplicit, strictNegativeSpLinearImplicit]
collapse_other_axes: true

export_slides: false

mpi_launcher: "mpirun -np {np}"
env_preamble: "source $HOME/OpenFOAM/OpenFOAM-v2512/etc/bashrc"
