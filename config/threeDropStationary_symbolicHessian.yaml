# STATIONARY droplet (REFERENCE_SPEED 0) on uniform hex meshes, N = 64 and 128,
# with ONE curvature model: symbolicHessian -- kappa taken symbolically from the
# gradient + Hessian of the per-cell quadratic LSQ fit of psi at the cell centre,
# then arithmetically interpolated to faces (curvatureExtension type none, so the
# connectedInterface-only tokens below are inert).
# Copied from config/transISTN64ConnectedModePreserving.yaml; only the curvature
# delivery, N ladder, reference speed and output cadence differ.
study_name: threeDropStationary_symbolicHessian
case: transISTDroplet2D
mesh: hex
mode: serial
np: 1
solver: leiaSemiLagrangianLevelSetTwoPhaseFoam
theme: semi-lagrangian-level-set
setfields_args: "-alphaName alpha.water"
collapse_other_axes: true
axes_override:
  N_CELLS: [64, 128]
  END_TIME: [0.05]
  WRITE_INTERVAL: [0.005]
  REFERENCE_SPEED: [0]
  SL_RECONSTRUCTION: [uncachedQuadraticWeightedLeastSquares]
  TIME_STEP_CONTROL: [capillary]
  VELOCITY_EXTENSION: [none]
  TRAJECTORY_VELOCITY: [input]
  MASS_FLUX: [rhoLENT]
  MASS_FLUX_FACE_INTERPOLATION: [central]
  SURFACE_TENSION_FORCE: [reconstructedCurvature]
  SURFACE_TENSION_CURVATURE_SOURCE: [field]
  SURFACE_TENSION_CURVATURE: [1000]
  SURFACE_TENSION_SIGN: [-1]
  SURFACE_TENSION_GEOMETRIC_METHOD: [conormalCSF]
  SURFACE_TENSION_SIGMA: [0.07274]
  # --- symbolicHessian curvature delivery -------------------------------------
  CURVATURE_EXTENSION: [none]
  CURVATURE_FACE_INTERPOLATION: [arithmetic]
  CURVATURE_FACE_SOURCE: [model]
  # ---------------------------------------------------------------------------
  CURVATURE_EXTENSION_RELAX: [1]
  CURVATURE_FORCE_WEIGHT: [alpha]

export_slides: false
env_preamble: "source $HOME/OpenFOAM/OpenFOAM-v2512/etc/bashrc"
