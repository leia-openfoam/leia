# CANDIDATE CS1 (the combined source of Bothe and Soga; re-opened by the author 2026-10-13):
#   F = a + lambda (1 - q) in D_t psi = psi F after the SL step, in the band |psi|/q <= 3h:
#   a = n.D.n (GC_STRAIN_WEIGHT full, the SDPLS strain term), lambda (1 - q) = GC_LAW linearQ with
#   lambda = GC_MU = GC_M_MU/T_REF per arm (M_mu = 1), q one-sided (GC_Q_SCHEME upwindFit, gate
#   E2.1, STATUS 11.26), no velocity extension. Controls: CS0s (a alone), CS0r (lambda (1 - q) alone).
# WHY a carries the zero set: for psi_t + u.grad psi = a psi, D_t |grad psi| = psi n.grad a
#   (docs/knowledge-base/concepts/combined-source-note.md); on the zero set |grad psi| is kept
#   exactly, and lambda (1 - q) removes the drift psi n.grad a off it and the discretisation errors.
# PRE-REGISTERED READ-OUT (2026-10-13, before any run; the shear-arm target uses the form of HL1q,
#   the same metric, the same rung and the same ratio):
#   exact1D (1Dstretch, u = alpha x, alpha = 1, T = 1): a = alpha is uniform, so the closed form is
#     q = 1 for all t; prediction: the band mean q at T in [0.95, 1.05] at every rung (the baseline:
#     exp(-1) = 0.368). FALSIFIED if outside [0.9, 1.1] at the finest rung.
#   shear (2Dvortex, reversed, gradient at T/2): prediction: the gradient band error at the finest
#     rung at most 0.8 x the baseline (the target below), and no regression of the shape (T) and the
#     volume (T/2, T) beyond the gate tolerance, with the orders kept. FALSIFIED if the shape order at
#     T falls below the baseline order minus the gate's order tolerance (the failure mode of the first
#     campaign: S1 order 0.06, HL1q 0.02).
#   The coupled arms run only after both kinematic arms pass (on Lichtenberg).
