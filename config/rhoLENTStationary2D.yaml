# CAN rhoLENT BE ADOPTED WITHOUT DAMAGING THE CASE THAT ALREADY WORKS?
#
# WHY THIS EXISTS. rhoLENT + massFlux.boundRho + matched BDF2 is now the best
# configuration measured on the TRANSLATING droplet: full horizon at N=128 with a
# phase-volume error of 0.0024, 22x below the next best
# (config/matchedBDF2Translating2D), and rhoLENT ahead of geometricFaceDensity on
# free-stream preservation at both rungs (config/translatingClearOutlet2D). Before any
# of that is proposed as a shared default it has to be shown NOT to damage the
# stationary droplet, which is the case this campaign has spent months making clean
# and which the shared ladder currently reproduces to four digits.
#
# The consistency argument predicts rhoLENT should be NEUTRAL here. The spurious
# momentum source it removes is U0 times the discrete mass residual, and U0 = 0 for a
# stationary droplet, so the term it fixes is identically zero. Any DIFFERENCE this
# study finds is therefore a side effect of rhoLENT -- the auxiliary equation, the
# end-of-step reset, or the clip -- and not a benefit of consistency. That makes it a
# clean regression test: the prediction is "no change", and a change is a defect.
#
# ONE VARIABLE: MASS_FLUX. Everything else is the shared method configuration, pinned
# explicitly so the study does not change meaning if a default moves again. Matched
# BDF2 on both ddt keys, boundRho on (inert for geometricFaceDensity, which solves no
# density equation), mass-residual diagnostic on so both models report what their
# momentum equation inherits.
#
# PRE-REGISTERED READ-OUT.
#   * REPRODUCTION CONTROL: the geometricFaceDensity arms must reproduce the shared
#     ladder's unabsorbed capillary residual -- 2.369e-05 / 3.145e-06 / 8.534e-07 at
#     N=32/64/128 under curvatureExtension none, from config/stationaryLadder2Dshared.
#     If they do not, a default moved and nothing here is believed.
#   * PASS: rhoLENT is within a small factor of geometricFaceDensity at every rung on
#     the capillary residual, volume and shape, and reaches the horizon at all three.
#     Neutral is the success criterion; rhoLENT is not expected to help here and a
#     large improvement would be as suspicious as a large regression.
#   * FAIL: rhoLENT degrades any rung materially, or fails to complete one. Then it
#     cannot be a shared default and stays a per-case selection for moving-interface
#     problems -- which is still a real result, just a narrower one.
#   * The mass residual is the instrument that says whether the mechanism is engaged
#     at all: it should be ~1e-10 for rhoLENT and ~1e-01 for geometricFaceDensity even
#     here, because geometricFaceDensity solves no density equation regardless of
#     whether the interface moves.
#   * Report the whole vector: capillary residual, volume, shape, |grad psi|, clip.
#
# ============================== RESULT, 2026-09-02 ==============================
# RAN: Lichtenberg, 4 ranks/arm. All 6 arms COMPLETED the full horizon.
#
#  N    massFlux              relL2 2ndHalf  volErr      shapeL2     massResRel  clipL1
#  32   geometricFaceDensity   2.3693e-05    6.885e-04   3.216e-06   5.072e-01   0
#  32   rhoLENT                2.3939e-05    6.656e-04   3.268e-06   3.195e-08   2.13e-12
#  64   geometricFaceDensity   3.1449e-06    1.529e-04   3.719e-06   3.955e-02   0
#  64   rhoLENT                2.4505e-06    1.676e-04   2.375e-06   9.829e-09   2.56e-12
#  128  geometricFaceDensity   8.5341e-07    1.286e-05   2.255e-07   5.590e-01   0
#  128  rhoLENT                8.5436e-07    1.289e-05   2.262e-07   2.437e-05   2.86e-12
#
# REPRODUCTION CONTROL PASSES TO FIVE DIGITS: the geometricFaceDensity arms give
# 2.3693e-05 / 3.1449e-06 / 8.5341e-07 against the shared ladder's 2.369e-05 /
# 3.145e-06 / 8.534e-07 (config/stationaryLadder2Dshared). Nothing has moved.
#
# PASS. rhoLENT is NEUTRAL-TO-BETTER, which was the pre-registered success criterion:
# +1.0% at N=32, -22% (better) at N=64, +0.1% at N=128 on the unabsorbed capillary
# residual, with volume and shape matching to three digits and all six arms reaching
# the horizon. The clip is ~2e-12 -- nothing. rhoLENT does not damage the case this
# campaign spent months making clean, so it is safe to adopt.
#
# AND THE LAST COLUMN IS THE MECHANISM, SHOWN DIRECTLY. geometricFaceDensity carries a
# mass residual of 0.04 to 0.56 RELATIVE on the STATIONARY droplet -- as large as on
# the translating one -- and it does no harm here. That is exactly what the argument
# predicts: the spurious momentum source is U0 times the residual, so at U0 = 0 an
# arbitrarily bad mass residual is invisible. The same residual is what wrecks the
# translating case. This is the cleanest single piece of evidence for the mechanism in
# the whole campaign, because it holds the residual roughly FIXED and varies only U0.
#
# RECOMMENDATION, NOT ACTED ON HERE. The evidence now supports rhoLENT as the shared
# MASS_FLUX default: neutral on stationary (this study), ahead on translating free-
# stream preservation at both rungs (config/translatingClearOutlet2D), and the best
# configuration measured anywhere on the translating case is rhoLENT + boundRho +
# matched BDF2 (config/matchedBDF2Translating2D, phase-volume error 0.0024). Flipping
# it is a one-line change to MASS_FLUX in cases/default.parameter, but it would make
# every ladder run before it incomparable, so it is left as an explicit decision rather
# than taken unilaterally at the end of a long night.
# ================================================================================
study_name: rhoLENTStationary2D
case: stationaryDroplet2D
mesh: hex
mode: parallel
np: 4
solver: leiaSemiLagrangianLevelSetTwoPhaseFoam
theme:  method-comparison
setfields_args: "-alphaName alpha.water"
solve_runtime: 240
axes_override:
  N_CELLS: [32, 64, 128]
  MASS_FLUX: ["geometricFaceDensity", "rhoLENT"]
  MOMENTUM_DDT_SCHEME: ["backward"]
  RHO_DDT_SCHEME: ["backward"]
  MASS_FLUX_BOUND_RHO: ["true"]
  MASS_RESIDUAL_DIAGNOSTIC: ["true"]
  CURVATURE_EXTENSION: ["none"]
  SURFACE_TENSION_FORCE: ["reconstructedCurvature"]
  FACE_CURVATURE_SOURCE: [model]
  PSI_FILTER: [none]
  PHASE_INDICATOR: [detrixheAslam]
  SL_TRACE_VELOCITY: ["projectedFlux"]
  SL_RECONSTRUCTION: [uncachedQuadraticWeightedLeastSquares]
  SL_FOOT_INTEGRATOR: ["taylor"]
collapse_other_axes: true
export_slides: false
mpi_launcher: "mpirun -np {np}"
env_preamble: "source $HOME/OpenFOAM/OpenFOAM-v2512/etc/bashrc; [ -f $HOME/.leia_env ] && . $HOME/.leia_env || true"
