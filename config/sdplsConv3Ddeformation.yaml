# SDPLS convergence study on the reversed 3D (LeVeque) deformation flow -- the
# hardest advection benchmark of the suite (thin stretched sheet at t = T/2),
# and therefore the case where the t = T/2 band-gradient column is most
# informative.
#
# WHY. See config/sdplsConv3Dshear.yaml. Same arm matrix, same pins, so the two
# 3D cases and the 2D ladders are read on identical footing. Copied from
# config/3DdeformationGRL.yaml with the redistancer axis replaced by the SDPLS
# arm matrix; the sibling lines already scored on this case are
# bench3Ddeformation (semi-Lagrangian, np 12) and 3DdeformationGRL (np 8).
#
# Case: unit cube [0,1]^3 meshed (N N N), deformation3D with oscillation on
# (reverses at T = END_TIME, so exact(T) = initial); interface sphere r = 0.15 @
# (0.35,0.35,0.35). 128^3 = 2.10M cells, 203^3 = 8.37M.
#
#   snakemake --workflow-profile profiles/slurm --configfile config/sdplsConv3Ddeformation.yaml -n
#   snakemake --workflow-profile profiles/slurm --configfile config/sdplsConv3Ddeformation.yaml

study_name: sdplsConv3Ddeformation
case: 3Ddeformation
mesh: hex
mode: parallel
np: 16

solver: leiaLevelSetFoam
theme: sdpls-level-set

axes_override:
  END_TIME: [3.0]
  # Cell-doubling ladder, cells x2 per level -- see config/sdplsConv3Dshear.yaml.
  N_CELLS:  [64, 81, 102, 128, 161, 203]
  CFL:      [0.5]
  REPORT_WRITE_ONLY: ["true"]
  ADVECTION: [eulerian]
  REDISTANCER: [noRedistancing]
  PHASE_INDICATOR: [detrixheAslam]

  # --- the SDPLS arm matrix ---------------------------------------------- #
  SDPLS_SOURCE: [noSource, R, beta]
  SOURCE_SCHEME: [simpleLinearImplicit, strictNegativeSpLinearImplicit]

  # --- pins, each for a measured reason (see sdplsConv3Dshear.yaml) -------- #
  MOLLIFIER: [none]
  GRAD_PSI: [fvc]
  # No DIV pin -- div(phi,psi) is hardcoded in the case template and there is no
  # @!DIV!@ token; see config/sdplsConv3Dshear.yaml.
  # This template DOES expose the narrow band. Pin signChange to match 2D:
  # `distance` is broken (it tests signed psi, not |psi|, so its "band" contains
  # the whole negative-psi bulk and does not shrink with h) and `neighbours` has
  # no processor-boundary exchange, so the measured cell set depends on np.
  NARROWBAND: [signChange]
  # NON-REVERSING STRESS TEST. With `oscillation on` the flow reverses and
  # int a dt = 0 over the period, so at t=T the sourceless drift cancels by
  # time-reversal symmetry -- measured: the baseline beats R by 477x there,
  # purely because the exact solution at t=T is "undo everything". A reversed
  # flow read at t=T rewards inaction and cannot justify a source term. Off, the
  # vortex is steady: strain is sustained, nothing cancels, and t=T is a real
  # measurement of whether the source holds the signed-distance property.
  # NOTE: shape error is NOT meaningful here -- E_GEOM_ALPHA compares against the
  # INITIAL alpha, and the interface never returns. aggregate.py blanks it in the
  # curated table for oscillation=off rows and records `oscillation` alongside.
  # Volume error (conservation) and the gradient error (intrinsic) stay valid.
  OSCILLATION: [off]
collapse_other_axes: true

# Publish: this is a PRIMARY study of the sdpls theme. `export_slides:
# false` gates the whole theme-figures block (89 of 117 configs set it,
# meaning "secondary study, do not publish"), which is why the sdpls
# figures directory was empty. The theme's figures are ours alone, so
# nothing of another method line can be overwritten.
export_slides: true

mpi_launcher: "mpirun -np {np}"
env_preamble: "source $HOME/OpenFOAM/OpenFOAM-v2512/etc/bashrc"
