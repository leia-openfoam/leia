# SDPLS convergence study on the reversed 3D shear flow -- the 3D companion to
# config/benchVortexEulerT2.yaml, and the first 3D SDPLS measurement in the repo.
#
# WHY. Every SDPLS number published before 2026-08 came from a source whose
# explicit (Sc) branch carried a reversed sign, and from a single 2D case. This
# study puts the corrected source on the SAME 3D advection benchmark the other
# method lines are already scored on -- bench3Dshear (semi-Lagrangian, np 12)
# and 3DshearGRL (redistanced line, np 8) -- so the arms are directly
# comparable. Copied from config/3DshearGRL.yaml with the redistancer axis
# replaced by the SDPLS arm matrix.
#
# Case: unit cube [0,1]^3 meshed (N N N) -> N^3 cubic cells (h = 1/N); shear3D
# with oscillation on reverses at T = END_TIME, so exact(T) = initial and the
# t = T band gradient is a PURE RESIDUAL METER (the sourceless drift cancels by
# time-reversal symmetry). Report t = T/2 as well: that is where the interface
# is maximally stretched and where the source is actually asked to do something.
# Interface: sphere r = 0.15 @ (0.35,0.75,0.25).
#
#   snakemake --workflow-profile profiles/slurm --configfile config/sdplsConv3Dshear.yaml -n
#   snakemake --workflow-profile profiles/slurm --configfile config/sdplsConv3Dshear.yaml

study_name: sdplsConv3Dshear
case: 3Dshear
mesh: hex
mode: parallel
np: 16

solver: leiaLevelSetFoam
theme: sdpls-level-set

axes_override:
  END_TIME: [3.0]                  # T = period = end time (reversible)
  # CELL-DOUBLING ladder N_{k+1} = N_k * 2^(1/3): cells x2 per level, not x8.
  # 0.26M / 0.53M / 1.06M / 2.10M / 4.17M / 8.37M cells (ratios 2.03, 2.00,
  # 1.98, 1.99, 2.01). Six usable points for roughly the work of the old
  # 32/64/128 ladder's top rung, and the least-squares order fit in
  # make_convergence_table.py gets strictly better conditioned. This is the 3D
  # analogue of the sqrt(2) ladder the 2D configs already use.
  N_CELLS:  [64, 81, 102, 128, 161, 203]
  CFL:      [0.5]                  # matches bench3Dshear; the SDPLS residual is
                                   # CFL-independent to 3-4 digits (sdplsStability)
  REPORT_WRITE_ONLY: ["true"]      # fair wall clock, as in every bench* line
  ADVECTION: [eulerian]
  REDISTANCER: [noRedistancing]
  PHASE_INDICATOR: [detrixheAslam]

  # --- the SDPLS arm matrix ---------------------------------------------- #
  SDPLS_SOURCE: [noSource, R, beta]
  # BOTH linearizations: simpleLinearImplicit is the reference arm (Sc == 0, so
  # it was never touched by the sign defect); strictNegativeSpLinearImplicit is
  # the corrected variant that every published row used. They must now agree.
  SOURCE_SCHEME: [simpleLinearImplicit, strictNegativeSpLinearImplicit]

  # --- pins, each for a measured reason ----------------------------------- #
  # The 3D templates DO carry a mollifier block (2D does not), and its w2
  # default (1e-3) is smaller than the configured w1 (0.05), which the squared
  # difference in mollifier1.C silently reinterprets as a ~0.099 outer width.
  # Enabling the mollifier is a separate question; leaving it on here would
  # confound the sign-fix measurement and break comparability with the 2D
  # ladders, which have no mollifier at all.
  MOLLIFIER: [none]
  # narrowLS fatals with detrixheAslam: it looks up a registered `nc` field that
  # only geometricPhaseIndicator provides.
  GRAD_PSI: [fvc]
  # NO DIV pin: 3Dshear/system/fvSchemes.template hardcodes
  #   div(phi,psi) Gauss linearUpwind grad(psi)
  # with grad(psi) = cellLimited leastSquares 1, and carries no @!DIV!@ token at
  # all, so a DIV axis here would silently control nothing. `make
  # check-discretization` reads the RENDERED fvSchemes and is the gate.
  # (3Dshear hardcodes narrowBand type signChange; there is no NARROWBAND token
  #  in its template, unlike 3Ddeformation.)
  # REVERSED, AND READ AT TWO INSTANTS. The cancellation that makes a reversed
  # flow untrustworthy corrupts exactly ONE column, not the whole run:
  #
  #   t = T/2  maximal ACCUMULATED deformation. cos(pi t/tau) is positive
  #            throughout the first half, so int_0^{T/2} a dt is at its MAXIMUM
  #            and nothing has cancelled. Gradient AND volume error are honest
  #            here. (The instantaneous strain a is ~0 at this instant because
  #            the flow is turning around -- that makes T/2 the wrong place to
  #            read `a` itself, which is a different question.)
  #   t = T    the interface has returned to its start, so the SHAPE error is
  #            defined -- this is the only configuration that can supply one,
  #            since E_GEOM_ALPHA compares against the INITIAL alpha. Volume
  #            conservation is still valid. The t=T GRADIENT error is NOT: it
  #            cancels by time-reversal symmetry and the sourceless baseline
  #            beats R by 477x purely because "undo everything" is the exact
  #            answer. make_convergence_table.py suppresses that column on
  #            oscillation=on rows (REVERSED_INVALID) and keeps the rest.
  #
  # Verified by control: the reversed t=T/2 orders agree in sign and ranking
  # with the same case run NON-REVERSING to t=T (R +1.228 vs +0.74, no source
  # -0.094 vs -0.26, beta +0.087 vs -0.04), while the reversed t=T gradient
  # column disagrees with both. sdplsConv2Dvortex is kept as that control.
  # QUOTED: YAML 1.1 parses bare `on`/`off` as booleans, which materialize
  # stringifies as "True"/"False" -- and OpenFOAM's Switch rejects those
  # ("Expected true/false, on/off... found False"). Every existing config
  # quotes these for the same reason (REPORT_WRITE_ONLY: ["true"]).
  OSCILLATION: ["on"]
collapse_other_axes: true

# Publish: this is a PRIMARY study of the sdpls theme. `export_slides:
# false` gates the whole theme-figures block (89 of 117 configs set it,
# meaning "secondary study, do not publish"), which is why the sdpls
# figures directory was empty. The theme's figures are ours alone, so
# nothing of another method line can be overwritten.
export_slides: true

mpi_launcher: "mpirun -np {np}"
env_preamble: "source $HOME/OpenFOAM/OpenFOAM-v2512/etc/bashrc"
