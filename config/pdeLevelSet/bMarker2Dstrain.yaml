# PDE LEVEL SET, STEP B ROUND 1: the marker test (plan section 6; manuscript of D. Bothe, T. Maric and
# K. Soga, 2026-11-15, section 5). Case markerTest2D: the graded circle psi0 = g(z)(|z| - R), R = 0.15,
# centre (0.5013, 0.4987), g = 1 + 0.3 (z0^2 - z1^2)/(|z|^2 + 0.01^2), so q0 = |grad psi0| = g goes
# from 0.70 to 1.30 along the circle, known pointwise. The linear flow v = G (x - x0) + b. No source
# (no feedback), no redistancing, the Eulerian material form, CFL 0.5 (dt ~ h), T = 0.5.
# Read-out: interfaceMarkers.csv (libleiaCore): 720 markers moved with v by RK4; WITHOUT feedback q is
# constant along them for the extension velocity u(Y), so E_Q = q_h(Y_l(t)) - q0_l is the target;
# E_POS = psi_h(Y_l)/q0_l is the interface position error. L1 and L2 means, never L_inf.
# Arms: none (raw velocity, the baseline), projectionBlend (distance first, w1 4 h, w2 8 h: the model's
# own extension u(Y); for a LINEAR flow its Taylor sample is exact, so it is the oracle of the
# sampling and only Y_h is computed), closestPoint (newton step, layer band, extendThroughFade).
# DERIVATION (before the run): on the interface the extension equals v and grad(u_e) n = 0 for both
# u(Y) and u(Pi), so dq/dt = -q n.grad(u_e).n = 0 at the markers; for the raw velocity
# dq/dt = -q n.G.n, so q_l(T) = q0_l exp(-T n.G.n) to first order along the marker path.
# THIS STUDY: pure strain, G = diag(1, -1), b = 0 (stagnation point at the centre): the circle becomes
# an ellipse with semi-axes 0.15 e^{0.5} = 0.247 and 0.15 e^{-0.5} = 0.091 at T (R/h = 11.6 on the
# short axis at N 128).
# PRE-REGISTERED (2026-11-18, before any run). N 128, 256, 512; read at t = T/2 and T:
#   B3 baseline (none): E_Q_L1(T) does not converge (order <= 0.3 on both pairs) and E_Q_L1(T) >= 0.05
#      at every N (the exact q changes by the factor exp(-T n.G.n), up to e^{0.5} = 1.65).
#   B4 projectionBlend and closestPoint: E_Q_L1 order >= 1.5 at T/2 and T, and E_Q_L1(T) at N 512
#      <= 0.1 times the baseline.
#   B2s E_POS_L1 order >= 1.5 at T/2 and T in all three arms (the position does not depend on the
#      extension at the interface).
#   B5 and B6 as in bMarker2Dtranslation.
# FALSIFIED: B4 below order 1 for projectionBlend: the model'"'"'s own extension, exact in its sample for a
# linear flow, does not keep q on the markers; the defect is then Y_h or the transport of a
# non-solenoidal extension velocity, and step D must not start.
# HOW IT COULD PASS FOR THE WRONG REASON: the extension not active (check that projectionBlend and
# closestPoint differ from the baseline in E_Q at T by more than a factor 10).
study_name: bMarker2Dstrain
case: markerTest2D
mesh: hex
solver: leiaLevelSetFoam
theme: pde-level-set
studies_dir: studies/pdeLevelSet
solve_runtime: 240
collapse_other_axes: true
export_slides: false
mpi_launcher: "mpirun -np {np}"
env_preamble: "source $HOME/OpenFOAM/OpenFOAM-v2606/etc/bashrc"
mode: serial
np: 1
axes_override:
  N_CELLS: [128, 256, 512]
  VELOCITY_EXTENSION: [none, projectionBlend, closestPoint]
  PB_DISTANCE: [first]
  PB_W1: [4]
  PB_W2: [8]
  CP_STEP: [newton]
  FADE_MODE: [layer]
  VE_FADE_PLACEMENT: [extendThroughFade]
  VE_FLUX_FORM: [correction]
  ANCHOR_LAYERS: [0]
  ADVECTION: [eulerian]
  SDPLS_SOURCE: [noSource]
  REDISTANCER: [noRedistancing]
  PHASE_INDICATOR: [detrixheAslam]
  REPORT_WRITE_ONLY: ["false"]
