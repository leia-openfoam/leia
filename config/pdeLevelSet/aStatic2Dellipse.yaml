# PDE LEVEL SET, STEP A proper (2): the extension against u(Pi(x)) on an ellipse (the curvature
# varies along the interface; signedDistanceEllipse gives the exact distance and closest point).
# Semi-axes 0.18 x 0.12, centre (0.5013, 0.7487) off the mesh vertices; the smallest radius of
# curvature b^2/a = 0.08, so N >= 128 for R/h >= 10: N 128, 256, 512. shear2D at t = 0, serial,
# extendThroughFade, correction flux form. Inputs distance and scaledDistance (quadratic is defined for
# the circle only).
# PRE-REGISTERED (2026-11-14, before any run). Orders over N 128-256-512, L1:
#   E1 closestPoint/newton, layer band, both inputs: E_EXT_L1_2H, E_EXT_L1_4H, E_FLUX_L1_1H..4H
#      order >= 1.8.
#   E2 closestPoint/distance equals newton to 2 % on the distance input.
#   E3 meshWave: order 0.8 to 1.3.
# FALSIFIED: E1 below 1.5: the extension loses its order where the curvature varies.
study_name: aStatic2Dellipse
case: 2Dvortex
mesh: hex
mode: serial
np: 1
solver: leiaTestVelocityExtension
solve_runtime: 60
theme: pde-level-set
studies_dir: studies/pdeLevelSet
collapse_other_axes: true
export_slides: false
mpi_launcher: "mpirun -np {np}"
env_preamble: "source $HOME/OpenFOAM/OpenFOAM-v2606/etc/bashrc"
axes_override:
  N_CELLS: [128, 256, 512]
  SURFACE_TYPE: [signedDistanceEllipse]
  SURFACE_X0: [0.5013]
  SURFACE_Y0: [0.7487]
  SURFACE_A: [0.18]
  SURFACE_B: [0.12]
  VE_TEST_INPUT: [distance, scaledDistance]
  VELOCITY_EXTENSION: [closestPoint, meshWave]
  CP_STEP: [distance, newton]
  FADE_MODE: [levelSet, layer]
  END_TIME: [1]
  VE_FADE_PLACEMENT: [extendThroughFade]
  VE_FLUX_FORM: [correction]
  ANCHOR_LAYERS: [0]
  PHASE_INDICATOR: [detrixheAslam]
