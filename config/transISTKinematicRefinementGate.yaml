# Zero-force spatial convergence at fixed physical time and fixed advective
# Co=0.5, selected from transISTKinematicTimeStepGate.  Two Taylor velocities
# are retained to confirm that their coarse-grid equivalence persists.
study_name: transISTKinematicRefinementGate
case: transISTDroplet2D
mesh: hex
mode: serial
np: 1
solver: leiaSemiLagrangianLevelSetTwoPhaseFoam
theme: semi-lagrangian-level-set
setfields_args: "-alphaName alpha.water"
axes_override:
  N_CELLS: [32, 64, 128]
  END_TIME: [0.05]
  TIME_STEP_CONTROL: [advective]
  TARGET_ADVECTIVE_CO: [0.5]
  DOMAIN_LENGTH: [0.01]
  REFERENCE_SPEED: [0.05]
  MAX_CO: [0.5]
  SL_RECONSTRUCTION: [uncachedQuadraticWeightedLeastSquares]
  VELOCITY_EXTENSION: [none]
  TRAJECTORY_VELOCITY: [input, normalProjection]
  MASS_FLUX: [rhoLENT]
  MASS_FLUX_FACE_INTERPOLATION: [central]
  SURFACE_TENSION_FORCE: [constantCurvatureSurfaceTension]
  SURFACE_TENSION_CURVATURE: [1000]
  SURFACE_TENSION_SIGMA: [0]
export_slides: false
env_preamble: "source $HOME/OpenFOAM/OpenFOAM-v2512/etc/bashrc"
