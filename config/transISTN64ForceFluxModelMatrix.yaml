# Controlled N=64 laboratory-frame translating-droplet comparison of every
# production surface-tension model. Only SURFACE_TENSION_FORCE varies. Every
# case uses the same quadratic semi-Lagrangian transport, rhoLENT mass flux,
# capillary timestep law, PIMPLE settings and pressure tolerances, and reports
# max_c |U_c - (0.05,0,0)| through maxMagUPrime.
study_name: transISTN64ForceFluxModelMatrix
case: transISTDroplet2D
mesh: hex
mode: serial
np: 1
solver: leiaSemiLagrangianLevelSetTwoPhaseFoam
theme: semi-lagrangian-level-set
setfields_args: "-alphaName alpha.water"
axes_override:
  N_CELLS: [64]
  END_TIME: [0.05]
  SL_RECONSTRUCTION: [uncachedQuadraticWeightedLeastSquares]
  TIME_STEP_CONTROL: [capillary]
  VELOCITY_EXTENSION: [none]
  TRAJECTORY_VELOCITY: [input]
  MASS_FLUX: [rhoLENT]
  MASS_FLUX_FACE_INTERPOLATION: [central]
  SURFACE_TENSION_FORCE:
    - constantCurvatureSurfaceTension
    - reconstructedCurvature
    - divGradPsiSnGradAlpha
    - traceGradGradPsiSnGradAlpha
    - traceGradGeoNormalSnGradAlpha
    - correctionKang
    - divGradAlphaSnGradAlpha
    - integralSurfaceTension
    - integralConormalSurfaceTension
    - isoCurvature
  SURFACE_TENSION_CURVATURE_SOURCE: [field]
  SURFACE_TENSION_CURVATURE: [1000]
  SURFACE_TENSION_SIGN: [-1]
  SURFACE_TENSION_GEOMETRIC_METHOD: [conormalCSF]
  SURFACE_TENSION_SIGMA: [0.07274]
export_slides: false
env_preamble: "source $HOME/OpenFOAM/OpenFOAM-v2512/etc/bashrc"
