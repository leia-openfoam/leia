# Curvature-free structured integral-force diagnostic. This removes only the
# paper-specific sigma*kappa pressure-jump correction; all crossing, tangent,
# stress-divergence and collocated face-delivery code remains active.
study_name: transISTIntegralNoCurvatureGate
case: transISTDroplet2D
mesh: hex
mode: serial
np: 1
solver: leiaSemiLagrangianLevelSetTwoPhaseFoam
theme: semi-lagrangian-level-set
setfields_args: "-alphaName alpha.water"
axes_override:
  N_CELLS: [32]
  END_TIME: [0.05]
  SL_RECONSTRUCTION: [uncachedQuadraticWeightedLeastSquares]
  TIME_STEP_CONTROL: [capillary]
  VELOCITY_EXTENSION: [none]
  TRAJECTORY_VELOCITY: [input]
  MASS_FLUX: [rhoLENT]
  MASS_FLUX_FACE_INTERPOLATION: [central]
  SURFACE_TENSION_FORCE: [integralSurfaceTension]
  SURFACE_TENSION_CURVATURE_SOURCE: [none]
  SURFACE_TENSION_CURVATURE: [1000]
  SURFACE_TENSION_SIGMA: [0.07274]
export_slides: false
env_preamble: "source $HOME/OpenFOAM/OpenFOAM-v2512/etc/bashrc"
