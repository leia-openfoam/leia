# Manufactured connected-curvature mode-transfer gate.
#
# The production connected-interface implementation is evaluated on
#   r(theta) = R [1 + epsilon cos(m theta)], m=2,3,4,
# at N=32,64,128 on uniform and deterministically perturbed meshes. N=32 is a
# deliberately under-resolved trend/topology point; quantitative advancement
# limits apply at N>=64. The two perturbed meshes are deterministic but not
# nested realizations, so their samplewise error is not required to decrease
# monotonically; the same absolute transfer/phase/error limits apply at both.
study_name: curvatureModeTransferGate
case: transISTDroplet2D
epsilon: 0.02
radius: 0.001
center: [0.005, 0.005, 0.0]
resolutions: [32, 64, 128]
mesh_variants: [uniform, perturbed]
perturbation_alpha: 0.1
perturbation_seed: 0
modes: [2, 3, 4]

quantitative_gate:
  minimum_resolution: 64
  amplitude_transfer_min: 0.8
  amplitude_transfer_max: 1.2
  maximum_phase_error_deg: 10.0
  maximum_relative_L2: 0.25
  require_refinement_nonincrease: false

candidates:
  - id: h3_helmholtz_l1
    fit_half_width: 3
    regularization_operator: helmholtz
    tangential_regularization: 1
    regularization_iterations: 30
  - id: h4_helmholtz_l4
    fit_half_width: 4
    regularization_operator: helmholtz
    tangential_regularization: 4
    regularization_iterations: 60
  - id: h5_helmholtz_l16
    fit_half_width: 5
    regularization_operator: helmholtz
    tangential_regularization: 16
    regularization_iterations: 120
  - id: h3_biharmonic_20
    fit_half_width: 3
    regularization_operator: biharmonic
    tangential_regularization: 0.05
    regularization_iterations: 20
  - id: h3_biharmonic_50
    fit_half_width: 3
    regularization_operator: biharmonic
    tangential_regularization: 0.05
    regularization_iterations: 50
  - id: h4_biharmonic_10
    fit_half_width: 4
    regularization_operator: biharmonic
    tangential_regularization: 0.05
    regularization_iterations: 10
  - id: h4_biharmonic_20
    fit_half_width: 4
    regularization_operator: biharmonic
    tangential_regularization: 0.05
    regularization_iterations: 20
  - id: h4_helmholtz_l16_preserve_m2_m4
    fit_half_width: 4
    regularization_operator: helmholtzPreserveModes
    tangential_regularization: 16
    regularization_iterations: 120
    preserve_modes_through: 4

publication_table: docs/method-comparison/method-comparison-article/data/tables/curvatureModeTransferGate.csv
publication_summary: docs/method-comparison/method-comparison-article/data/tables/curvatureModeTransferGateSummary.csv
env_preamble: "source $HOME/OpenFOAM/OpenFOAM-v2512/etc/bashrc"
