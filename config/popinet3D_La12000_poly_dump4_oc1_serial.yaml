# DECOMPOSITION TEST (2026-09-05): the four-step polyhedral dump with ONE outer corrector
# run on ONE rank. After one SL step on four ranks, 98 cfMesh boundary-layer cells are wrong
# by up to 1.4 h while every interior cell is within U dt, and the error grows ~15x per step.
# If the serial run is clean, the defect is decomposition-dependent -- the cell-point-cell
# stencil of small boundary polyhedra across processor patches -- and a defect by this
# repository's rule regardless of whether both runs complete.
study_name: popinet3D_La12000_poly_dump4_oc1_serial
case: popinetTranslating3D
mesh: poly
mode: serial
np: 1
solver: leiaSemiLagrangianLevelSetTwoPhaseFoam
theme:  method-comparison
setfields_args: "-alphaName alpha.water"
axes_override:
  N_OUTER_CORRECTORS: [1]
  N_CELLS: [64]
  MAX_CELL_SIZE: [0.019685]
  END_TIME: [0.001024]
  WRITE_INTERVAL: [0.000255996]
  POPINET_NX: [128]
  POPINET_XLEN: [2]
  DOMAIN_LENGTH: [1]
  CAPILLARY_REF_LENGTH: [1]
  CAPILLARY_DT_COEFF: [0.13107]
  DROPLET_RADIUS: [0.2]
  DROPLET_OFFSET_X: [0]
  TRANSLATION_SPEED: [1]
  SIGMA: [1]
  POPINET_RHO: [1]
  POPINET_NU: [5.773502692e-03]
  SURFACE_FILE: [box2x1x1.stl]
  MOMENTUM_DIV_SCHEME: ["upwind"]
  MASS_FLUX: ["rhoLENT"]
  MASS_FLUX_BOUND_RHO: ["true"]
  VOLUME_CORRECTION: ["noVolumeCorrection"]
  MOMENTUM_DDT_SCHEME: ["backward"]
  RHO_DDT_SCHEME: ["backward"]
  CURVATURE_EXTENSION: ["none"]
  SURFACE_TENSION_FORCE: ["reconstructedCurvature"]
  FACE_CURVATURE_SOURCE: [model]
  PSI_FILTER: [none]
  PHASE_INDICATOR: [detrixheAslam]
  SL_TRACE_VELOCITY: ["projectedFlux"]
  SL_RECONSTRUCTION: [uncachedQuadraticWeightedLeastSquares]
  SL_FOOT_INTEGRATOR: ["taylor"]
collapse_other_axes: true
export_slides: false
mpi_launcher: "mpirun -np {np}"
env_preamble: "source $HOME/OpenFOAM/OpenFOAM-v2512/etc/bashrc; [ -f $HOME/.leia_env ] && . $HOME/.leia_env || true"
