# SDPLS under Navier-Stokes coupling: the 2D stationary droplet.
#
# FIRST COUPLED TEST of the source. Everything so far is kinematic (prescribed
# velocity); this runs the full two-phase solver, where psi feeds curvature and
# the phase indicator every PIMPLE iteration, and the velocity the source reads
# is the computed one -- spurious currents included. The stationary droplet is
# the standard instrument: the exact solution is u = 0 with the Laplace pressure
# jump, so every velocity is error, and the question is whether maintaining the
# signed-distance property (R) reduces or amplifies the parasitic currents
# against the identical solver with the source off.
#
# WHAT IS KNOWN GOING IN (kinematic ladders, measured):
#   R converges the band gradient error where sourceless transport diverges
#   (+1.23 2D / +0.67 3D shear vs -0.09), its ceiling within second-order
#   transport is ~1.2 (complete elimination: limiter, dt, Picard, gradient
#   scheme, fitted normal), and on 3D shear it pays in volume (+2.57 -> +0.96)
#   and shape. Whether that trade helps or hurts a coupled run is exactly what
#   this study measures -- per the standing rule, volume AND shape are reported
#   alongside every headline metric.
#
# NO CONFLICT WITH THE SEMI-LAGRANGIAN LINE, by construction: this uses the
# EULERIAN two-phase solver (leiaLevelSetTwoPhaseFoam); the SL sessions run
# leiaSemiLagrangianLevelSetTwoPhaseFoam from their own clone
# (/work/scratch/tm83tomy/leia-curvature). The shared case template gained one
# additive sdplsSource block whose default (noSource) is inert for both solvers,
# and SDPLS_SOURCE defaults to noSource in cases/default.parameter, so every
# existing SL config renders behaviourally identical dictionaries.
#
#   make studies-one STUDY=sdplsDropletNS2D PROFILE=profiles/slurm

study_name: sdplsDropletNS2D
case: stationaryDroplet2D
mesh: hex
mode: parallel
np: 8

solver: leiaLevelSetTwoPhaseFoam
# The two-phase field is alpha.water, not alpha; every droplet config sets this
# and omitting it fails leiaSetFields at launch (measured -- first submission).
setfields_args: "-alphaName alpha.water" 
theme: sdpls-level-set

axes_override:
  N_CELLS: [32, 64, 128]
  # The paired comparison: identical solver, source off vs on.
  # Rdiv = the CONSERVATIVE (divergence-form) source. The algebraic R drains
  # the droplet under coupling regardless of curvature model (raw FV or fitted
  # production) and cut-off (none or band); its failure is a conservation
  # failure, and Rdiv removes it structurally -- what enters through fvm::div
  # fluxes cannot drain. Continuum-identical to R for incompressible flow.
  SDPLS_SOURCE: [noSource, R, Rdiv]
  SOURCE_SCHEME: [simpleLinearImplicit]

  # THE COUPLED CUT-OFF TEST. Without one, R drains the droplet completely
  # (relative volume error -1.0 by t=0.1 at every N) while noSource conserves to
  # 4e-4 -- the far-field amplification that was harmless under a prescribed
  # velocity is fatal under a computed one, where parasitic currents make the
  # strain noisy everywhere. `band` is the scale-free cut-off (a cell count, not
  # a physical width -- m1's w1/w2 would need rescaling to this geometry) and it
  # flattened the far field completely in the kinematic tests (-0.02). The band
  # error cost that disqualified it kinematically is moot here: a destroyed
  # droplet has no band error worth protecting. noSource x band is inert
  # (nothing to cut off) but keeps the matrix full and the renumbering simple.
  # band's answer is in (irrelevant to the drain; data preserved in
  # sdplsDropletNS2D-bandCutoffRun). Rdiv refuses a mollifier by construction
  # (a cut-off on a flux breaks conservation), so the axis returns to none.
  MOLLIFIER: [none]

  # Self-contained psi-based CSF: kappa = div(grad psi/|grad psi|). The case
  # default (reconstructedCurvature) needs the SL quadratic reconstruction's
  # registered kappa, which the Eulerian solver does not build.
  # PRODUCTION curvature: the SL line's reconstructedCurvature, fed by the
  # quadratic LSQ fit + stabilized foot-point face delivery -- now constructible
  # in the Eulerian solver (reconstructedCurvatureFields.H). kappa comes from a
  # smooth local fit rather than raw FV derivatives of psi, so the
  # source-curvature feedback that drained the droplet with
  # divGradPsiSnGradAlpha does not pass high-wavenumber psi perturbations
  # straight through to the force. The divGradPsiSnGradAlpha arms already ran;
  # their data stands as the feedback measurement.
  SURFACE_TENSION_FORCE: [reconstructedCurvature]
collapse_other_axes: true

export_slides: false

mpi_launcher: "mpirun -np {np}"
env_preamble: "source $HOME/OpenFOAM/OpenFOAM-v2512/etc/bashrc"
