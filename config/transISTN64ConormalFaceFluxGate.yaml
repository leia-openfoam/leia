# Historical N=64 laboratory-frame translating-droplet conormal face-flux run.
# The now-mandatory production contract uses
# Gsigma = linearInterpolate(fSigmaCell) & Sf, removes the direct UEqn source,
# and sends Gsigma through phig, pEqn and the common fvc::reconstruct.
study_name: transISTN64ConormalFaceFluxGate
case: transISTDroplet2D
mesh: hex
mode: serial
np: 1
solver: leiaSemiLagrangianLevelSetTwoPhaseFoam
theme: semi-lagrangian-level-set
setfields_args: "-alphaName alpha.water"
axes_override:
  N_CELLS: [64]
  END_TIME: [0.05]
  SL_RECONSTRUCTION: [uncachedQuadraticWeightedLeastSquares]
  TIME_STEP_CONTROL: [capillary]
  VELOCITY_EXTENSION: [none]
  TRAJECTORY_VELOCITY: [input]
  MASS_FLUX: [rhoLENT]
  MASS_FLUX_FACE_INTERPOLATION: [central]
  SURFACE_TENSION_FORCE: [integralConormalSurfaceTension]
  SURFACE_TENSION_CURVATURE_SOURCE: [none]
  SURFACE_TENSION_CURVATURE: [1000]
  SURFACE_TENSION_SIGN: [-1]
  SURFACE_TENSION_GEOMETRIC_METHOD: [conormal]
  SURFACE_TENSION_SIGMA: [0.07274]
export_slides: false
env_preamble: "source $HOME/OpenFOAM/OpenFOAM-v2512/etc/bashrc"
