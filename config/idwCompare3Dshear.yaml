# Focused 3D shear comparison: quadraticWeightedLeastSquares vs defectCorrectedIDW at N = 32/64
# (128^3 is the ~1.5-2 h/case tier -- run it via config/3DshearSL.yaml on a node
# that stays up). Only the departure-point reconstruction changes.
#
#   snakemake --workflow-profile profiles/local --configfile config/idwCompare3Dshear.yaml --resources tasks=8
study_name: idwCompare3Dshear
case: 3Dshear
mesh: hex
mode: parallel
np: 8

solver: leiaSemiLagrangeLevelSetFoam

axes_override:
  END_TIME: [3.0]
  N_CELLS:  [32, 64]
  CFL:      [0.5, 1.0]
  SL_RECONSTRUCTION: [quadraticWeightedLeastSquares, defectCorrectedIDW]
  PHASE_INDICATOR: [detrixheAslam]
  DIV: [linear]          # 3D fvSchemes references @!DIV!@; pin so it does not merge/duplicate
collapse_other_axes: true

export_slides: false

mpi_launcher: "mpirun -np {np}"
env_preamble: "source $HOME/OpenFOAM/OpenFOAM-v2512/etc/bashrc"
