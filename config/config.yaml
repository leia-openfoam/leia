# leia Snakemake test-suite — study selection + scope.
#
# One invocation runs ONE (case, mesh, mode) study.  Switch the execution
# backend with the profile (NOT by editing this file):
#   snakemake --workflow-profile profiles/local     # this machine, mpirun
#   snakemake --workflow-profile profiles/slurm      # cluster, one sbatch / case
#
# Override any value on the command line, e.g.:
#   snakemake --workflow-profile profiles/local --config case=3Dshear mode=parallel np=8

study_name: smoke-3Drotation-hex-serial
case: 3Drotation          # any directory under cases/
mesh: hex                 # hex | perturbed | poly   (poly = 3D cases only)
mode: serial              # serial | parallel
np: 4                     # MPI ranks for parallel mode; decomposeParDict is
                          # regenerated from this, so they cannot disagree.

# --- scope control --------------------------------------------------------
# axes_override: replace the value list of specific @!TOKEN!@ axes.
# collapse_other_axes: reduce every *other* multi-valued axis to its first
#   value, keeping the default "smoke" study tiny.
# For the FULL cartesian product from cases/<case>.parameter, set
#   axes_override: {}   and   collapse_other_axes: false
axes_override:
  N_CELLS: [32, 64]
  DIV: [linear, upwind]
  PHASE_INDICATOR: [geometric, detrixheAslam]   # compare the two geometric methods
collapse_other_axes: true

# --- execution ------------------------------------------------------------
# env_preamble runs at the top of every OpenFOAM rule shell. It sources the
# OpenFOAM install the leia binaries were built against, then an OPTIONAL,
# MACHINE-LOCAL $HOME/.leia_env. Set the path/version for your machine, or "" if
# you always source OpenFOAM before launching snakemake.
#
# WHY THE HOOK EXISTS (measured 2026-09-01, Lichtenberg). Sourcing the OpenFOAM
# bashrc RESETS WM_PROJECT_USER_DIR to the account default. Where a session builds
# into its own user dir -- as on Lichtenberg, where the tm83tomy account is SHARED
# and this work builds into curvature-v2512 -- that reset puts the account-default
# bin dir first on PATH, and the Snakefile invokes the solver bare by name.
# Fourteen arms silently ran an AUGUST 19 binary predating the fvOption they need
# and were recorded as fourteen divergences.
#
# THE ROOT CAUSE WAS NOT CONFIG PRECEDENCE, and an earlier commit message of mine
# said it was -- retracted. The profile's preamble was correct all along: probed on
# a compute node it sets WM_OPTIONS, exports curvature-v2512 and resolves
# `which leiaSemiLagrangianLevelSetTwoPhaseFoam` to the right binary, first on PATH.
# The failure is that **mpirun resolves the executable from the ORCHESTRATING
# process's PATH** and bakes the absolute path into the launch, so the DRIVER's own
# environment decides which binary every rank runs -- the job preamble never gets a
# say. The give-away was in the logs the whole time: OpenFOAM's `Exec :` line showed
# a full absolute path under the wrong user dir, not a bare command name.
#
# So the rule on such a machine is: source $HOME/.leia_env in the shell that
# launches snakemake, not only inside the rules. This hook keeps the RULE shells
# consistent with that; both matter, and the driver one is what was missing.
#
# Where $HOME/.leia_env does not exist this is exactly the old single-command line,
# so machines that do not need it are unaffected.
mpi_launcher: "mpirun -np {np}"
env_preamble: "source $HOME/OpenFOAM/OpenFOAM-v2512/etc/bashrc; [ -f $HOME/.leia_env ] && . $HOME/.leia_env || true"

# studies_dir: studies     # default: <repo>/studies  (already in .gitignore)
