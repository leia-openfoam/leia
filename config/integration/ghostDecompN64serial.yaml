# ============================================================================
# INTEGRATION IDENTITY CHECK, round 2 (2026-11-13): control for the decomposition dependence
# of the ghost-cell class
#
# The N = 64 rung of config/gates/ghostCellRefinedBox3D.yaml, both SL_RECONSTRUCTION arms,
# in SERIAL. Its twin is ghostDecompN64np4.yaml. The two files differ in study_name, mode, np and the solve memory only.
# refineHexMesh on a blockMesh box is deterministic: the comparison prints the mesh digests,
# and a pair is valid only when they match.
#
# A MEASUREMENT, not a PASS/FAIL item. Compare serial against 4 ranks per class with
# workflow/scripts/compare_metrics_csv.py at tolerance 0 and with
# workflow/scripts/integration/column_differences.py (first step and largest relative
# difference per column; L1, L2 and volume columns, no L_inf verdict).
#
# PRE-REGISTERED READING (coordinator, before the run). If the original class
# (uncachedQuadraticWeightedLeastSquares) also differs between serial and 4 ranks at a
# similar size, the dependence is not specific to ghost cells. If the original class is
# identical at tolerance 0 and the ghost class differs, the ghost class adds it.
# ============================================================================
study_name: ghostDecompN64serial
case: 3Dtranslation
mesh: hexRefined
mode: serial
np: 1
solve_mem_mb: 16000
solver: leiaSemiLagrangeLevelSetFoam
theme: semi-lagrangian-level-set
solve_runtime: 7200
setfields_args: "-alphaName alpha"
axes_override:
  # The domain is [0,2] x [0,1] x [0,1]; the sphere starts at (0.5 0.5 0.5) with radius 0.15
  # and travels to x = 1.5 at U = 1, T = 1. The box spans x in [0.8, 1.2] and the full cross
  # section, so the sphere meets a coarse -> fine transition at x = 0.8 and a fine -> coarse
  # one at x = 1.2, and starts and ends well clear of both.
  REFINE_SOURCE: ["box"]
  REFINE_LEVELS: ['1']
  REFINE_BOX_MIN: ["(0.8 -0.1 -0.1)"]
  REFINE_BOX_MAX: ["(1.2 1.1 1.1)"]
  N_CELLS: ['64']
  CFL: ['0.5']
  END_TIME: ['1.0']
  OSCILLATION: ['off']
  END_REFERENCE: ['translate']
  ADVECTION: [semiLagrangian]
  PHASE_INDICATOR: [detrixheAslam]
  PROFILE: [signedDistance]
  # The one variable: the reconstruction. Everything else is the production transport.
  SL_SCHEME: [pointValue]
  SL_RECONSTRUCTION: [uncachedQuadraticWeightedLeastSquares, ghostCellQuadraticWeightedLeastSquares]
  SL_VALUE_BOUND: ["none"]
  SL_LIMITER: ["none"]
  SL_FOOT_INTEGRATOR: ["taylor"]
  SL_STENCIL: ["point"]
  SL_CLIP: ["false"]
  SL_TRACE_VELOCITY: [projectedFlux]
  SL_SOURCE: [none]
  FLUX_PROJECTION: ["none"]
  SDPLS_SOURCE: [noSource]
  SOURCE_SCHEME: [explicit]
collapse_other_axes: true
export_slides: false
