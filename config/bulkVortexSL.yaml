# Semi-Lagrangian level set advection on the reversed single (shear) vortex.
# >>> FAST DEFAULT SL suite (N <= 128, 3 reconstructions, ~few min). <<<
#
# The PARALLEL research line to velocity extension: instead of correcting the
# velocity, leiaSemiLagrangeLevelSetFoam solves Dpsi/Dt = 0 along characteristics
# (psi^{n+1}(x_c) = psi^n(x_d)), with the reconstruction of psi^n at the departure
# foot as the sweepable axis -- the SL analog of the VELOCITY_EXTENSION model
# sweep. Same 2Dvortex case files, same error norms, its own study dir.
#
#   snakemake --workflow-profile profiles/local --configfile config/bulkVortexSL.yaml
#
# reconstruction:
#   linearTaylor  -- O(h) baseline (= first-order upwind; validates the pipeline)
#   linearWeightedLeastSquares    -- O(h) value-fit (per-cell weighted LSQ of a linear polynomial; stable by construction)
#   quadraticTaylor               -- O(h^2) via nested fvc::grad passes (field-differentiation; conditionally stable)
#   quadraticWeightedLeastSquares -- O(h^2) production (per-cell weighted LSQ over the CPC stencil)
# CFL (maxCo) sweeps 0.5 and 1.0 to confirm the order at both stability bounds.
# N=256 lives in the opt-in bulkVortexSLHighRes.yaml (8x cost per level in 2D).

study_name: bulkVortexSL
case: 2Dvortex
mesh: hex
mode: parallel
np: 4

solver: leiaSemiLagrangeLevelSetFoam

axes_override:
  END_TIME: [0.5, 2, 4, 8]                              # T = period = end time
  N_CELLS:  [32, 64, 128]                               # fast; 256 -> HighRes
  CFL:      [0.5, 1.0]                                  # stability-bound sweep
  SL_RECONSTRUCTION: [linearTaylor, linearWeightedLeastSquares, quadraticTaylor, quadraticWeightedLeastSquares, bandQuadraticWeightedLeastSquares, defectCorrectedIDW]
  PHASE_INDICATOR: [detrixheAslam]
collapse_other_axes: true

export_slides: false  # fast tier: keep figures in the study dir

mpi_launcher: "mpirun -np {np}"
env_preamble: "source $HOME/OpenFOAM/OpenFOAM-v2506/etc/bashrc"
